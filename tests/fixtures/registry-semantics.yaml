# Semantic probes for the Azure/GCP registry entries reconciled with Checkov
# 3.3.29. The configurations use Checkov's normalized Terraform shape.
CKV_AZURE_44:
  check_name: "Ensure Storage Account is using the latest version of TLS encryption"
  supported_resource: azurerm_storage_account
  articles:
    - [NIS2, "Art. 21(2)(h)"]
    - [GDPR, "Art. 32(1)(a)"]
  severity: HIGH
  remediation_contains: [min_tls_version, TLS1_2]
  fail_conf:
    min_tls_version: [TLS1_1]
  pass_conf:
    min_tls_version: [TLS1_2]

