[project]
name = "tf-eu-guard"
version = "0.2.1"
description = "EU compliance security linter for Terraform and Kubernetes — NIS2 and GDPR mapping"
authors = [
    {name = "44aayush", email = "k44aayush.official@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["terraform", "security", "compliance", "nis2", "gdpr", "iac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "checkov==3.3.13",   # Pinned for reproducible scans; supports Python 3.10+
    "pyyaml>=6.0.1",
    "rich>=13.7.1",      # For terminal output formatting
    "jinja2>=3.1.4",     # For HTML report templating
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
tf-eu-guard = "tf_eu_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tf_eu_guard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=tf_eu_guard --cov-report=term-missing"
