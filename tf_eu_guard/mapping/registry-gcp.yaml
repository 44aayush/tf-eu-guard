# =============================================================================
# GCP Compliance Mapping Registry: Checkov Check ID -> EU Regulations
# =============================================================================
# NIS2 Art. 21(2) and GDPR Art. 32(1)/44 mappings for Checkov GCP checks.
# Article letters verified against Directive (EU) 2022/2555 and Regulation
# (EU) 2016/679. Severity is authored here (Checkov leaves it null).
# Check IDs confirmed to exist in Checkov 3.3.29's Terraform policy registry.
# =============================================================================

# -----------------------------------------------------------------------------
# Storage, Cloud SQL, and audit controls
# -----------------------------------------------------------------------------
CKV_GCP_62:
  check_name: "Bucket should log access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A Cloud Storage bucket without access logging leaves reads and writes without an audit trail for detecting and investigating incidents."
  remediation: |
    resource "google_storage_bucket" "example" {
      logging {
        log_bucket = google_storage_bucket.audit.name
      }
    }
  severity: MEDIUM

CKV_GCP_11:
  check_name: "Ensure that Cloud SQL database Instances are not open to the world"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A Cloud SQL instance with an authorized network of 0.0.0.0/0 is reachable from any host on the internet, inviting brute-force and exploitation."
  remediation: |
    resource "google_sql_database_instance" "example" {
      settings {
        ip_configuration {
          authorized_networks {
            value = "10.0.0.0/8"
          }
        }
      }
    }
  severity: CRITICAL

CKV_GCP_51:
  check_name: "Ensure PostgreSQL database 'log_checkpoints' flag is set to 'on'"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A PostgreSQL instance without the log_checkpoints flag enabled omits checkpoint events from the database audit trail, making incident analysis less complete."
  remediation: |
    resource "google_sql_database_instance" "example" {
      database_version = "POSTGRES_15"
      settings {
        database_flags {
          name  = "log_checkpoints"
          value = "on"
        }
      }
    }
  severity: MEDIUM

# -----------------------------------------------------------------------------
# Transport security / network exposure / access control
# -----------------------------------------------------------------------------
CKV_GCP_6:
  check_name: "Ensure all Cloud SQL database instance requires all incoming connections to use SSL"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Cloud SQL instances that accept unencrypted connections expose queries — including personal data — to interception."
  remediation: |
    resource "google_sql_database_instance" "example" {
      settings {
        ip_configuration {
          require_ssl = true
        }
      }
    }
  severity: HIGH

CKV_GCP_26:
  check_name: "Ensure that VPC Flow Logs is enabled for every subnet in a VPC Network"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without VPC flow logs, network traffic needed to detect and investigate intrusions is not recorded."
  remediation: |
    resource "google_compute_subnetwork" "example" {
      log_config {
        aggregation_interval = "INTERVAL_10_MIN"
        flow_sampling        = 0.5
        metadata             = "INCLUDE_ALL_METADATA"
      }
    }
  severity: MEDIUM

CKV_GCP_88:
  check_name: "Ensure Google compute firewall ingress does not allow unrestricted mysql access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A Google Compute firewall that exposes TCP port 3306 to 0.0.0.0/0 makes MySQL services reachable from the internet, inviting brute-force and exploitation."
  remediation: |
    resource "google_compute_firewall" "example" {
      allow {
        protocol = "tcp"
        ports    = ["3306"]
      }
      source_ranges = ["10.0.0.0/8"]
    }
  severity: CRITICAL

CKV_GCP_28:
  check_name: "Ensure that Cloud Storage bucket is not anonymously or publicly accessible"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A bucket IAM binding that includes allUsers or allAuthenticatedUsers exposes bucket data without authentication — if personal data is stored, this may weaken the confidentiality safeguards expected by GDPR Art. 32(1)(b) and the access-control measures relevant to NIS2 Art. 21(2)(i)."
  remediation: |
    # Remove 'allUsers' and 'allAuthenticatedUsers' members from
    # google_storage_bucket_iam_binding / _member resources.
  severity: CRITICAL

CKV_GCP_49:
  check_name: "Ensure roles do not impersonate or manage Service Accounts used at project level"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Project IAM bindings that grant service-account impersonation, administration, token creation, or broad project roles allow principals to act as workloads or manage their credentials, weakening least privilege."
  remediation: |
    resource "google_project_iam_member" "workload" {
      role   = "roles/logging.logWriter"
      member = "serviceAccount:workload@example.iam.gserviceaccount.com"
    }
    # Do not grant roles/owner, roles/editor, or service-account
    # impersonation/administration roles at project level.
  severity: HIGH

CKV_GCP_27:
  check_name: "Ensure that the default network does not exist in a project"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "The GCP default network uses permissive firewall rules and broad subnets that conflict with a segmented, least-privilege network design."
  remediation: |
    # Set 'auto_create_network = false' on google_project resources and create
    # an explicit google_compute_network with restricted subnets.
  severity: MEDIUM

# -----------------------------------------------------------------------------
# Kubernetes / GKE hardening
# -----------------------------------------------------------------------------
CKV_GCP_13:
  check_name: "Ensure client certificate authentication to Kubernetes Engine Clusters is disabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(j)"
      title: "Authentication and secured communications"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Enabling legacy client certificate authentication for a Kubernetes Engine cluster creates static credentials that are difficult to rotate and revoke."
  remediation: |
    resource "google_container_cluster" "example" {
      master_auth {
        client_certificate_config {
          issue_client_certificate = false
        }
      }
    }
  severity: MEDIUM

CKV_GCP_18:
  check_name: "Ensure GKE Control Plane is not public"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A GKE control plane authorized network containing 0.0.0.0/0 is reachable from the internet, exposing the Kubernetes API to probing and unauthorized access."
  remediation: |
    resource "google_container_cluster" "example" {
      master_authorized_networks_config {
        cidr_blocks {
          cidr_block   = "10.0.0.0/8"
          display_name = "internal"
        }
      }
    }
  severity: HIGH

CKV_GCP_25:
  check_name: "Ensure Kubernetes Cluster is created with Private cluster enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A cluster with public control-plane endpoints is reachable from any network and can be probed or attacked."
  remediation: |
    resource "google_container_cluster" "example" {
      private_cluster_config {
        enable_private_endpoint = true
        enable_private_nodes     = true
      }
    }
  severity: HIGH

CKV_GCP_20:
  check_name: "Ensure master authorized networks is set to enabled in GKE clusters"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without authorized networks, the Kubernetes API endpoint is reachable from any IP address."
  remediation: |
    resource "google_container_cluster" "example" {
      master_authorized_networks_config {
        cidr_blocks {
          cidr_block   = "10.0.0.0/8"
          display_name = "internal"
        }
      }
    }
  severity: MEDIUM

CKV_GCP_68:
  check_name: "Ensure Secure Boot for Shielded GKE Nodes is Enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "GKE nodes without Shielded VM Secure Boot can start tampered boot components, weakening workload integrity and supply-chain protection."
  remediation: |
    resource "google_container_cluster" "example" {
      node_config {
        shielded_instance_config {
          enable_secure_boot = true
        }
      }
    }
  severity: MEDIUM

CKV_GCP_10:
  check_name: "Ensure 'Automatic node upgrade' is enabled for Kubernetes Clusters"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without automatic node upgrades, GKE nodes can remain on outdated software and miss security fixes, increasing maintenance and vulnerability exposure."
  remediation: |
    resource "google_container_node_pool" "example" {
      management {
        auto_upgrade = true
      }
    }
  severity: MEDIUM

CKV_GCP_22:
  check_name: "Ensure Container-Optimized OS (cos) is used for Kubernetes Engine Clusters Node image"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "General-purpose node images run unnecessary software, enlarging the attack surface compared to the minimal Container-Optimized OS."
  remediation: |
    resource "google_container_node_pool" "example" {
      node_config {
        image_type = "COS_CONTAINERD"
      }
    }
  severity: LOW

# -----------------------------------------------------------------------------
# Compute / IAM / secrets
# -----------------------------------------------------------------------------
CKV_GCP_30:
  check_name: "Ensure that instances are not configured to use the default service account"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Using the Compute Engine default service account gives a VM a broadly reusable identity whose permissions may exceed the workload's needs, increasing the blast radius of compromise."
  remediation: |
    resource "google_compute_instance" "example" {
      service_account {
        email  = google_service_account.workload.email
        scopes = ["https://www.googleapis.com/auth/cloud-platform"]
      }
    }
  severity: MEDIUM

CKV_GCP_33:
  check_name: "Ensure oslogin is enabled for a Project"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without OS Login, SSH access relies on key metadata that is hard to audit and revoke centrally."
  remediation: |
    resource "google_compute_project_metadata" "example" {
      metadata = {
        enable-oslogin = "TRUE"
      }
    }
  severity: LOW

CKV_GCP_38:
  check_name: "Ensure VM disks for critical VMs are encrypted with Customer Supplied Encryption Keys (CSEK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Critical VM boot disks without a customer-supplied or customer-managed encryption key rely on provider defaults rather than a key controlled and governed by the data controller."
  remediation: |
    resource "google_compute_instance" "example" {
      boot_disk {
        initialize_params {
          image = "debian-cloud/debian-12"
        }
        kms_key_self_link = google_kms_crypto_key.vm.id
      }
    }
  severity: HIGH

CKV_GCP_78:
  check_name: "Ensure Cloud storage has versioning enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: "A Cloud Storage bucket without object versioning cannot reliably recover prior object contents after accidental deletion or overwrite, weakening data recovery."
  remediation: |
    resource "google_storage_bucket" "example" {
      versioning {
        enabled = true
      }
    }
  severity: MEDIUM

CKV_GCP_16:
  check_name: "Ensure that DNSSEC is enabled for Cloud DNS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Without DNSSEC, DNS responses for the zone can be spoofed, redirecting users to attacker-controlled hosts."
  remediation: |
    resource "google_dns_managed_zone" "example" {
      dnssec_config {
        state = "on"
      }
    }
  severity: MEDIUM

CKV_GCP_23:
  check_name: "Ensure Kubernetes Cluster is created with Alias IP ranges enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without alias IP ranges, pod traffic cannot be filtered by network policy at the VPC level, weakening segmentation."
  remediation: |
    resource "google_container_cluster" "example" {
      networking_mode = "VPC_NATIVE"
      ip_allocation_policy { }
    }
  severity: MEDIUM
