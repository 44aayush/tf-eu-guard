# =============================================================================
# Secrets Compliance Mapping Registry: Checkov secrets framework -> EU Regulations
# =============================================================================
# Only used with `--secrets`. One entry per check ID in Checkov 3.4.5's
# SECRET_TYPE_TO_ID table (checkov/secrets/runner.py). NIS2 Art. 21(2)(e) and
# GDPR Art. 32(1)(b) apply to every entry. Reports never carry secret values.
# =============================================================================

CKV_SECRET_1:
  check_name: "Artifactory Credentials"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A hard-coded Artifactory Credentials in source control can be read by anyone with repository
    access and stays valid until rotated, undermining the confidentiality of
    systems and personal data. NIS2 Art. 21(2)(e) and GDPR Art. 32(1)(b)
    expect credentials to be kept out of code.
  remediation: |
    Remove the secret from the repository, rotate it, and load it from a secret manager at runtime.
  severity: HIGH

