# =============================================================================
# AWS Compliance Mapping Registry: Checkov Check ID -> EU Regulations
# =============================================================================
# NIS2 Art. 21(2) and GDPR Art. 32(1)/44 mappings for Checkov AWS checks.
# Article letters verified against Directive (EU) 2022/2555 and Regulation
# (EU) 2016/679 — see docs/nis2-mapping.md, docs/gdpr-mapping.md and
# docs/check-mapping-table.md for the reasoning and verification status.
# Severity is authored here (Checkov 3.3.13 leaves `severity` null).
# =============================================================================


# -----------------------------------------------------------------------------
# IAM / Access control  (iam.tf)  ->  NIS2 Art. 21(2)(i), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV_AWS_273:
  check_name: "Ensure access is controlled through SSO and not AWS IAM defined users"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Long-lived IAM users bypass centralized identity management and SSO, making it
    difficult to enforce MFA, audit access centrally, and revoke credentials quickly
    during an incident. NIS2 Art. 21(2)(i) requires effective access control policies.
  remediation: |
    Delete standing IAM users and federate access through AWS IAM Identity Center (SSO):
      # Remove:
      # resource "aws_iam_user" "admin" { ... }
      # Use Identity Center permission sets + account assignments instead
      # (managed via aws_ssoadmin_* resources or the Identity Center console).
  severity: HIGH

CKV_AWS_287:
  check_name: "Ensure IAM policies does not allow credentials exposure"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Policies that permit credential-generation actions (sts:GetFederationToken,
    iam:CreateAccessKey, ec2:GetPasswordData, etc.) let an attacker mint new
    credentials and pivot, undermining the confidentiality controls GDPR
    Art. 32(1)(b) requires and the access control NIS2 Art. 21(2)(i) mandates.
  remediation: |
    Remove credential-exposing actions and scope to least privilege:
      # Before:
      "Action": ["sts:*", "iam:CreateAccessKey"]
      # After:
      "Action": ["s3:GetObject", "s3:PutObject"]
      "Resource": "arn:aws:s3:::my-app-data/*"
  severity: CRITICAL

CKV_AWS_288:
  check_name: "Ensure IAM policies does not allow data exfiltration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
    - framework: GDPR
      article: "Art. 4(12)"
      title: "Personal data breach"
    - framework: GDPR
      article: "Art. 33"
      title: "Notification of a personal data breach to the supervisory authority"
  risk: >
    Broad read actions on all resources (s3:GetObject, secretsmanager:GetSecretValue,
    rds:DownloadDBLogFilePortion on "*") enable bulk exfiltration of data — if that
    data is personal, an exfiltration through them may constitute a personal data
    breach (GDPR Art. 4(12)); notification under Art. 33 depends on the risk
    assessment. These permissions may indicate a control gap relevant to the
    access control expected by NIS2 Art. 21(2)(i).
  remediation: |
    Constrain read actions to specific resource ARNs, never "*":
      "Action": ["s3:GetObject"]
      "Resource": "arn:aws:s3:::approved-bucket/*"
  severity: CRITICAL

CKV_AWS_62:
  check_name: "Ensure IAM policies that allow full \"*-*\" administrative privileges are not created"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A policy granting Action "*" on Resource "*" is unrestricted administrative
    access. It can weaken least privilege and access segregation, and gives any
    holder the ability to read, alter, or destroy all data - which may weaken both
    NIS2 Art. 21(2)(i) and the confidentiality/integrity goals of GDPR Art. 32(1)(b).
  remediation: |
    Replace the wildcard grant with explicit, scoped statements:
      # Before:
      "Action": "*"
      "Resource": "*"
      # After:
      "Action": ["s3:GetObject", "s3:PutObject"]
      "Resource": "arn:aws:s3:::my-app-data/*"
  severity: CRITICAL

CKV_AWS_286:
  check_name: "Ensure IAM policies does not allow privilege escalation"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Actions such as iam:PassRole, iam:AttachUserPolicy, or iam:PutUserPolicy allow a
    low-privileged principal to grant itself higher privileges, collapsing access
    control (NIS2 Art. 21(2)(i)) and putting the confidentiality of all data at risk.
  remediation: |
    Remove privilege-management actions from workload policies, or constrain them
    with a permissions boundary and explicit resource ARNs:
      "Action": ["iam:PassRole"]
      "Resource": "arn:aws:iam::123456789012:role/app-task-role"
      "Condition": { "StringEquals": { "iam:PassedToService": "ecs-tasks.amazonaws.com" } }
  severity: CRITICAL

CKV_AWS_63:
  check_name: "Ensure no IAM policies documents allow \"*\" as a statement's actions"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A statement with Action "*" grants every API action the principal can hold.
    Even when the resource is scoped, an unrestricted action set weakens least
    privilege and lets a compromised identity read or alter any reachable data -
    which may weaken the access control of NIS2 Art. 21(2)(i) and the confidentiality
    goal of GDPR Art. 32(1)(b).
  remediation: |
    Enumerate only the actions the workload needs:
      # Before:
      "Action": "*"
      # After:
      "Action": ["s3:GetObject", "s3:PutObject"]
  severity: CRITICAL

CKV_AWS_355:
  check_name: "Ensure no IAM policies documents allow \"*\" as a statement's resource for restrictable actions"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Using Resource "*" for actions that support resource-level scoping lets the
    policy reach every object in the account, not just those the workload owns.
    This over-broad reach undermines the access segregation NIS2 Art. 21(2)(i)
    expects and the data confidentiality GDPR Art. 32(1)(b) requires.
  remediation: |
    Constrain each statement to specific resource ARNs:
      # Before:
      "Resource": "*"
      # After:
      "Resource": "arn:aws:s3:::my-app-data/*"
  severity: HIGH

CKV_AWS_289:
  check_name: "Ensure IAM policies does not allow permissions management / resource exposure without constraints"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Permissions-management actions (iam:PutUserPolicy, iam:AttachUserPolicy,
    s3:PutBucketPolicy, etc.) on unconstrained resources let a principal rewrite
    who can access what, collapsing access control (NIS2 Art. 21(2)(i)) and putting
    the confidentiality of all data at risk (GDPR Art. 32(1)(b)).
  remediation: |
    Remove permissions-management actions from workload policies, or bound them
    with a permissions boundary and explicit resource ARNs:
      "Action": ["iam:AttachUserPolicy"]
      "Resource": "arn:aws:iam::123456789012:user/app-*"
  severity: CRITICAL

CKV_AWS_290:
  check_name: "Ensure IAM policies does not allow write access without constraints"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Write actions (Create/Put/Update/Delete) allowed on Resource "*" let a principal
    modify or destroy any resource in the account, threatening the integrity and
    availability of personal data (GDPR Art. 32(1)(b)) and breaking the least-privilege
    access control of NIS2 Art. 21(2)(i).
  remediation: |
    Scope write actions to the specific resources the workload manages:
      "Action": ["dynamodb:PutItem", "dynamodb:UpdateItem"]
      "Resource": "arn:aws:dynamodb:eu-west-1:123456789012:table/app-*"
  severity: HIGH

CKV_AWS_274:
  check_name: "Disallow IAM roles, users, and groups from using the AWS AdministratorAccess policy"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Attaching the AWS-managed AdministratorAccess policy grants unrestricted control
    over the account. It is the managed-policy equivalent of "*:*" and breaks the
    least-privilege access control required by NIS2 Art. 21(2)(i).
  remediation: |
    Attach a scoped, purpose-built policy instead of AdministratorAccess:
      # Before:
      policy_arn = "arn:aws:iam::aws:policy/AdministratorAccess"
      # After:
      policy_arn = aws_iam_policy.app_least_privilege.arn
  severity: HIGH

CKV_AWS_40:
  check_name: "Ensure IAM policies are attached only to groups or roles (Reducing access management complexity may in-turn reduce opportunity for a principal to inadvertently receive or retain excessive privileges.)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Attaching policies directly to individual IAM users makes entitlements hard to
    review and revoke at scale, weakening the asset- and access-management discipline
    NIS2 Art. 21(2)(i) expects. Group/role attachment keeps privileges auditable.
  remediation: |
    Attach the policy to a group or role and add the user to the group:
      resource "aws_iam_group_policy_attachment" "app" {
        group      = aws_iam_group.app.name
        policy_arn = aws_iam_policy.app.arn
      }
  severity: MEDIUM

CKV_AWS_9:
  check_name: "Ensure IAM password policy expires passwords within 90 days or less"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Without a password-expiry policy, compromised or leaked console passwords stay
    valid indefinitely. A rotation ceiling is a baseline access control hygiene
    measure under NIS2 Art. 21(2)(i). (Represents the account password-policy family:
    CKV_AWS_9-15.)
  remediation: |
    Define an account password policy with rotation and strength requirements:
      resource "aws_iam_account_password_policy" "strict" {
        max_password_age               = 90
        minimum_password_length        = 14
        require_symbols                = true
        require_numbers                = true
        require_uppercase_characters   = true
        require_lowercase_characters   = true
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# S3 storage  (s3.tf)  ->  encryption / public exposure / logging / resilience
# -----------------------------------------------------------------------------

CKV_AWS_145:
  check_name: "Ensure that S3 buckets are encrypted with KMS by default"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Buckets without KMS-managed encryption at rest lack the auditable key control and
    key-rotation guarantees expected of encrypted personal data. GDPR Art. 32(1)(a)
    names encryption explicitly; NIS2 Art. 21(2)(h) requires cryptography policies.
  remediation: |
    Configure default SSE-KMS on the bucket:
      resource "aws_s3_bucket_server_side_encryption_configuration" "this" {
        bucket = aws_s3_bucket.data.id
        rule {
          apply_server_side_encryption_by_default {
            sse_algorithm     = "aws:kms"
            kms_master_key_id = aws_kms_key.s3.arn
          }
        }
      }
  severity: HIGH

CKV_AWS_20:
  check_name: "S3 Bucket has an ACL defined which allows public READ access."
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A public-READ ACL exposes every object in the bucket to anonymous internet users.
    If the bucket holds personal data this may weaken the confidentiality safeguards
    expected by GDPR Art. 32(1)(b) and the access-control measures relevant to NIS2
    Art. 21(2)(i).
  remediation: |
    Remove the public ACL and keep the bucket private:
      # Before:
      acl = "public-read"
      # After: omit the ACL (buckets are private by default) or set:
      acl = "private"
      # and enforce with an aws_s3_bucket_public_access_block (see CKV2_AWS_6).
  severity: CRITICAL

CKV_AWS_53:
  check_name: "Ensure S3 bucket has block public ACLS enabled"
  articles:
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With block_public_acls disabled, a future ACL change can silently make objects
    public, weakensing the confidentiality control GDPR Art. 32(1)(b) requires. The
    public access block is the account-level guardrail that prevents that drift.
  remediation: |
    Enable the guardrail on the bucket's public access block:
      resource "aws_s3_bucket_public_access_block" "this" {
        bucket                  = aws_s3_bucket.data.id
        block_public_acls       = true
        ignore_public_acls      = true
        block_public_policy     = true
        restrict_public_buckets = true
      }
  severity: HIGH

CKV2_AWS_6:
  check_name: "Ensure that S3 bucket has a Public Access block"
  articles:
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A bucket with no aws_s3_bucket_public_access_block has no safety net against
    accidental public exposure via ACLs or bucket policy - a standing confidentiality
    risk for any personal data under GDPR Art. 32(1)(b).
  remediation: |
    Attach a public access block that denies all public access (see CKV_AWS_53 for the
    full resource); at minimum:
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
  severity: HIGH

CKV_AWS_54:
  check_name: "Ensure S3 bucket has block public policy enabled"
  articles:
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With block_public_policy disabled, a bucket policy can grant anonymous access
    to objects, silently exposing personal data. It is the policy-side counterpart
    to CKV_AWS_53 and a direct confidentiality risk under GDPR Art. 32(1)(b).
  remediation: |
    Enable the guardrail on the bucket's public access block:
      block_public_policy = true
  severity: HIGH

CKV_AWS_55:
  check_name: "Ensure S3 bucket has ignore public ACLs enabled"
  articles:
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With ignore_public_acls disabled, public ACLs applied to the bucket or its
    objects are honoured rather than neutralised, allowing anonymous read/write and
    undermining the confidentiality control of GDPR Art. 32(1)(b).
  remediation: |
    Enable the guardrail on the bucket's public access block:
      ignore_public_acls = true
  severity: HIGH

CKV_AWS_56:
  check_name: "Ensure S3 bucket has 'restrict_public_buckets' enabled"
  articles:
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With restrict_public_buckets disabled, a public bucket policy grants access to
    all principals and anonymous users rather than only authorised AWS services and
    users, widening exposure of personal data which may weaken GDPR Art. 32(1)(b).
  remediation: |
    Enable the guardrail on the bucket's public access block:
      restrict_public_buckets = true
  severity: HIGH

CKV_AWS_18:
  check_name: "Ensure the S3 bucket has access logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without S3 server access logging there is no record of who read or wrote objects,
    so a data-access incident cannot be detected, scoped, or investigated. NIS2
    Art. 21(2)(b) requires the ability to handle and analyse incidents.
  remediation: |
    Send access logs to a dedicated logging bucket:
      resource "aws_s3_bucket_logging" "this" {
        bucket        = aws_s3_bucket.data.id
        target_bucket = aws_s3_bucket.logs.id
        target_prefix = "s3-access/"
      }
  severity: MEDIUM

CKV_AWS_21:
  check_name: "Ensure all data stored in the S3 bucket have versioning enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without versioning, an accidental or malicious overwrite/delete is unrecoverable.
    Versioning provides point-in-time restore, supporting the recovery obligation in
    GDPR Art. 32(1)(c) and business continuity under NIS2 Art. 21(2)(c).
  remediation: |
    Enable bucket versioning:
      resource "aws_s3_bucket_versioning" "this" {
        bucket = aws_s3_bucket.data.id
        versioning_configuration { status = "Enabled" }
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# RDS database  (rds.tf)  ->  encryption / exposure / backup / logging / auth
# -----------------------------------------------------------------------------

CKV_AWS_16:
  check_name: "Ensure all data stored in the RDS is securely encrypted at rest"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An unencrypted RDS instance leaves personal data readable on the underlying
    storage and in snapshots. GDPR Art. 32(1)(a) names encryption explicitly and
    NIS2 Art. 21(2)(h) requires cryptography controls for data at rest.
  remediation: |
    Enable storage encryption (immutable - requires recreate/restore):
      resource "aws_db_instance" "this" {
        storage_encrypted = true
        kms_key_id        = aws_kms_key.rds.arn
        # ...
      }
  severity: HIGH

CKV_AWS_17:
  check_name: "Ensure all data stored in RDS is not publicly accessible"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A publicly accessible database is reachable from the internet, exposing personal
    data to credential-stuffing and exploitation. This may weaken the
    confidentiality safeguards expected by GDPR Art. 32(1)(b) and the access
    control measures relevant to NIS2 Art. 21(2)(i).
  remediation: |
    Keep the instance private and reach it only from within the VPC:
      publicly_accessible = false
      # place the instance in private subnets via a db_subnet_group and
      # restrict the security group to internal CIDRs only.
  severity: CRITICAL

CKV_AWS_133:
  check_name: "Ensure that RDS instances has backup policy"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A zero-day backup retention means no point-in-time recovery: hardware failure,
    corruption, or ransomware results in permanent data loss. Both NIS2 Art. 21(2)(c)
    and GDPR Art. 32(1)(c) require the ability to restore availability of data.
  remediation: |
    Set a non-zero backup retention window (>= 7 days recommended):
      backup_retention_period = 7
      backup_window           = "03:00-04:00"
  severity: HIGH

CKV_AWS_129:
  check_name: "Ensure that respective logs of Amazon Relational Database Service (Amazon RDS) are enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without database engine logs exported to CloudWatch, suspicious queries and
    authentication failures leave no trail, so a data-access incident cannot be
    detected or investigated - which may weaken NIS2 Art. 21(2)(b).
  remediation: |
    Export the relevant engine logs:
      enabled_cloudwatch_logs_exports = ["postgresql", "upgrade"]
      # (for MySQL: ["audit", "error", "general", "slowquery"])
  severity: MEDIUM

CKV_AWS_161:
  check_name: "Ensure RDS database has IAM authentication enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Relying only on static database passwords means no centralized revocation or
    rotation and passwords that are easily shared or leaked. IAM database
    authentication ties DB access to IAM identities, strengthening the access control
    of NIS2 Art. 21(2)(i) and the confidentiality control of GDPR Art. 32(1)(b).
  remediation: |
    Enable IAM database authentication:
      iam_database_authentication_enabled = true
  severity: MEDIUM

CKV_AWS_293:
  check_name: "Ensure that AWS database instances have deletion protection enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without deletion protection, a mistaken or malicious destroy removes the database
    and its data with no confirmation barrier, threatening the availability that both
    NIS2 Art. 21(2)(c) and GDPR Art. 32(1)(c) require.
  remediation: |
    Enable deletion protection on the instance:
      deletion_protection = true
  severity: MEDIUM

CKV_AWS_118:
  check_name: "Ensure that enhanced monitoring is enabled for Amazon RDS instances"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without enhanced monitoring, OS-level metrics (CPU, memory, process and I/O
    activity) are unavailable, so resource-exhaustion attacks or anomalous database
    host behaviour cannot be detected or investigated - which may weaken the incident
    detection and handling required by NIS2 Art. 21(2)(b).
  remediation: |
    Enable enhanced monitoring with a monitoring role and a non-zero interval:
      monitoring_interval = 60
      monitoring_role_arn = aws_iam_role.rds_monitoring.arn
  severity: MEDIUM

CKV_AWS_157:
  check_name: "Ensure that RDS instances have Multi-AZ enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A single-AZ database has no standby: an availability-zone failure takes the data
    offline until manual recovery. Multi-AZ provides automatic failover, supporting
    the availability obligation of GDPR Art. 32(1)(c) and business continuity under
    NIS2 Art. 21(2)(c).
  remediation: |
    Enable Multi-AZ deployment:
      multi_az = true
  severity: MEDIUM


# -----------------------------------------------------------------------------
# DynamoDB  (dynamodb.tf)  ->  encryption / backup
# -----------------------------------------------------------------------------

CKV_AWS_119:
  check_name: "Ensure DynamoDB Tables are encrypted using a KMS Customer Managed CMK"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A DynamoDB table without a customer-managed KMS key falls back to AWS-owned
    encryption, leaving key policy, rotation, and audit trail outside the organisation's
    control. Tables frequently hold personal data (sessions, profiles, transactions), so
    the auditable key governance GDPR Art. 32(1)(a) expects for encryption and the
    cryptography policies NIS2 Art. 21(2)(h) requires cannot be demonstrated.
  remediation: |
    Configure server-side encryption with a customer-managed KMS key:
      resource "aws_dynamodb_table" "sessions" {
        name         = "sessions"
        billing_mode = "PAY_PER_REQUEST"
        hash_key     = "session_id"

        server_side_encryption {
          enabled     = true
          kms_key_arn = aws_kms_key.dynamodb.arn
        }

        attribute {
          name = "session_id"
          type = "S"
        }
      }
  severity: HIGH

CKV_AWS_28:
  check_name: "Ensure DynamoDB point in time recovery (backup) is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without point-in-time recovery, an accidental or malicious delete/overwrite of table
    data is unrecoverable beyond on-demand backups. PITR provides continuous backup with
    35-day retention, supporting the restoration obligation of GDPR Art. 32(1)(c) and the
    backup management duty of NIS2 Art. 21(2)(c).
  remediation: |
    Enable point-in-time recovery on the table:
      resource "aws_dynamodb_table" "sessions" {
        name         = "sessions"
        billing_mode = "PAY_PER_REQUEST"
        hash_key     = "session_id"

        point_in_time_recovery {
          enabled = true
        }

        attribute {
          name = "session_id"
          type = "S"
        }
      }
  severity: HIGH


# -----------------------------------------------------------------------------
# Network  (network.tf)  ->  security groups / flow logging / subnet exposure
# -----------------------------------------------------------------------------

CKV2_AWS_11:
  check_name: "Ensure VPC flow logging is enabled in all VPCs"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without VPC flow logs there is no network-level record of accepted/rejected
    connections, so lateral movement and exfiltration attempts cannot be detected or
    reconstructed. NIS2 Art. 21(2)(b) requires detection and analysis of incidents.
  remediation: |
    Enable flow logs for the VPC:
      resource "aws_flow_log" "this" {
        vpc_id          = aws_vpc.main.id
        traffic_type    = "ALL"
        log_destination = aws_cloudwatch_log_group.vpc_flow.arn
        iam_role_arn    = aws_iam_role.vpc_flow.arn
      }
  severity: MEDIUM

# NOTE: CKV_AWS_24 / CKV_AWS_25 / CKV_AWS_260 are authored from the Checkov 3.3.13
# policy index and were NOT present in the source scan (the earlier fixture set had
# no open-ingress security groups). Confirm the exact IDs against a scan of
# vulnerable_tf/ before treating these as verified — see docs/check-mapping-table.md.
CKV_AWS_24:
  check_name: "Ensure no security groups allow ingress from 0.0.0.0:0 to port 22"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    SSH (port 22) open to 0.0.0.0/0 exposes administrative shell access to the entire
    internet, inviting brute-force and exploitation of any host that may process
    personal data. This may weaken the network access-control measures relevant to
    NIS2 Art. 21(2)(i) and the confidentiality safeguards expected by GDPR Art. 32(1)(b).
  remediation: |
    Restrict SSH to a bastion or corporate CIDR, never the internet:
      # Before:
      cidr_blocks = ["0.0.0.0/0"]
      # After:
      cidr_blocks = ["10.0.0.0/8"]   # or a specific admin range / use SSM Session Manager
  severity: HIGH

CKV_AWS_25:
  check_name: "Ensure no security groups allow ingress from 0.0.0.0:0 to port 3389"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    RDP (port 3389) open to 0.0.0.0/0 exposes remote desktop to the internet, a
    heavily targeted vector for credential attacks and ransomware. It breaks the
    network access control of NIS2 Art. 21(2)(i) and the confidentiality control of
    GDPR Art. 32(1)(b).
  remediation: |
    Restrict RDP to a bastion or corporate CIDR, or remove it entirely:
      # Before:
      cidr_blocks = ["0.0.0.0/0"]
      # After:
      cidr_blocks = ["10.0.0.0/8"]   # or use SSM Session Manager / a VPN
  severity: HIGH

CKV_AWS_260:
  check_name: "Ensure no security groups allow ingress from 0.0.0.0:0 to port 80"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Plain-HTTP (port 80) open to the world serves traffic unencrypted and widens the
    attack surface. Where it fronts systems processing personal data it weakens the
    network access control expected by NIS2 Art. 21(2)(i); traffic should terminate
    TLS at a load balancer instead.
  remediation: |
    Front the service with HTTPS and restrict or redirect port 80:
      # Terminate TLS (443) at an ALB and redirect 80 -> 443, or scope the CIDR:
      cidr_blocks = ["10.0.0.0/8"]
  severity: MEDIUM

CKV_AWS_382:
  check_name: "Ensure no security groups allow egress from 0.0.0.0:0 to port -1"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Unrestricted egress (all ports/protocols to 0.0.0.0/0) gives a compromised host a
    clear path to exfiltrate data or reach command-and-control infrastructure. Egress
    filtering is part of the network segmentation and access control under NIS2
    Art. 21(2)(i).
  remediation: |
    Scope egress to the destinations and ports the workload actually needs:
      egress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["10.0.0.0/8"]
      }
  severity: MEDIUM

CKV2_AWS_12:
  check_name: "Ensure the default security group of every VPC restricts all traffic"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    An unmanaged default security group can implicitly allow traffic between any
    resources that fall back to it, bypassing intended segmentation. NIS2
    Art. 21(2)(i) expects deliberate, least-privilege network access control.
  remediation: |
    Manage the default SG and strip all ingress/egress:
      resource "aws_default_security_group" "default" {
        vpc_id = aws_vpc.main.id
        # no ingress or egress blocks = deny all
      }
  severity: MEDIUM

CKV_AWS_130:
  check_name: "Ensure VPC subnets do not assign public IP by default"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Subnets that auto-assign public IPs place workloads directly on the internet by
    default, widening the attack surface for systems that may process personal data -
    a confidentiality risk (GDPR Art. 32(1)(b)) and weak network segmentation under
    NIS2 Art. 21(2)(i).
  remediation: |
    Disable automatic public IP assignment; use NAT for egress:
      map_public_ip_on_launch = false
  severity: MEDIUM


# -----------------------------------------------------------------------------
# Custom tf-eu-guard checks (Phase 3)  ->  EU-specific requirements not covered
# by stock Checkov policies. Implemented under tf_eu_guard/checks/ and loaded via
# `--external-checks-dir tf_eu_guard/checks` (wired into checkov_runner.py).
#   EUGUARD_GDPR_001  provider-level data residency: EU Sovereign Cloud only
#                     (this project's policy, anchored to GDPR Chapter V)
#   EUGUARD_NIS2_001  hardcoded secrets in IaC (NIS2 secure development)
# -----------------------------------------------------------------------------

EUGUARD_GDPR_001:
  check_name: "Ensure the AWS provider region is in the EU Sovereign Cloud (GDPR data residency)"
  articles:
    - framework: GDPR
      article: "Art. 44"
      title: "General principle for transfers of personal data to third countries"
  risk: >
    This project is based on the AWS European Sovereign Cloud: only EUSC
    regions are acceptable deployment targets. A provider pinned anywhere
    else is flagged - a non-EU region stores personal data outside the EU/EEA,
    a transfer to a third country that GDPR Chapter V (Art. 44-49) permits
    only under specific safeguards (an adequacy decision, Standard Contractual
    Clauses, or Binding Corporate Rules), while a commercial EU region, though
    GDPR-permissible, does not meet this project's sovereignty requirement.
    Either way the configuration is requiring justification under this
    policy - a strong signal for review, but not by itself a violation: the
    lawfulness of a transfer depends on the safeguard in place, which the
    configuration alone cannot show. Justify it with a documented Chapter V
    mechanism, or pin the provider to a Sovereign Cloud region.
  remediation: |
    Pin every aws provider block to an EU Sovereign Cloud region, or gate
    an out-of-policy provider behind a documented Chapter V transfer
    mechanism:
      # Before:
      provider "aws" { region = "us-east-1" }
      # After:
      provider "aws" { region = "eusc-de-east-1" }
  severity: HIGH

EUGUARD_NIS2_001:
  check_name: "Ensure secrets are not hardcoded in Terraform configuration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A literal credential (database password, auth token, private key) committed
    to Terraform is readable by anyone with repository or state access, cannot be
    rotated centrally, and frequently leaks through CI logs. Storing secrets in
    code is an insecure-development practice under NIS2 Art. 21(2)(e) and, where
    the secret protects personal data, a confidentiality risk under GDPR
    Art. 32(1)(b).
  remediation: |
    Never inline secrets. Source them from a secrets manager or a sensitive
    variable injected at apply time:
      # Before:
      password = "ChangeMe123!"
      # After:
      password = data.aws_secretsmanager_secret_version.db.secret_string
      # or a variable marked `sensitive` and sourced from the environment/a vault.
  severity: CRITICAL


# =============================================================================
# Registry extension (2026-08-30): every remaining Checkov AWS check that fires
# against the in-repo stacks (vulnerable_tf/, vulnerable_tf/end2end/,
# examples/vulnerable-aws/) is now mapped. 76 additional mappings, grouped by
# theme. Same citation rules as above: NIS2 Art. 21(2) letters (b) incident
# handling, (c) backup/DR, (e) secure development and maintenance,
# (h) cryptography, (i) access control; GDPR Art. 32(1)(a)-(c).
# =============================================================================

# -----------------------------------------------------------------------------
# Encryption at rest  ->  NIS2 Art. 21(2)(h), GDPR Art. 32(1)(a)
# -----------------------------------------------------------------------------

CKV2_AWS_2:
  check_name: "Ensure that only encrypted EBS volumes are attached to EC2 instances"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An unencrypted EBS volume attached to an EC2 instance leaves all data on that
    volume readable by anyone who obtains the snapshot or the physical disk. Data at
    rest without encryption weakens the encryption policies NIS2 Art. 21(2)(h)
    requires and the pseudonymisation/encryption safeguards of GDPR Art. 32(1)(a).
  remediation: |
    Enable encryption on every EBS volume (and default encryption at the account level):
      resource "aws_ebs_volume" "data" {
        encrypted = true
        # kms_key_id = aws_kms_key.ebs.arn  # for a customer-managed key
      }
  severity: HIGH

CKV_AWS_3:
  check_name: "Ensure all data stored in the EBS is securely encrypted"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    EBS volumes hold filesystem data — including databases and application state —
    in plaintext when not encrypted. Snapshots of unencrypted volumes inherit that
    plaintext exposure. NIS2 Art. 21(2)(h) mandates encryption policies and GDPR
    Art. 32(1)(a) names encryption of personal data as a core safeguard.
  remediation: |
    Set encrypted = true on the volume (existing volumes must be re-created):
      resource "aws_ebs_volume" "data" {
        encrypted   = true
        kms_key_id  = aws_kms_key.ebs.arn
      }
  severity: HIGH

CKV_AWS_8:
  check_name: "Ensure all data stored in the Launch configuration or instance Elastic Blocks Store is securely encrypted"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Launch configurations and launch templates that omit EBS encryption propagate
    unencrypted root and data volumes to every instance they create, so a single
    omission scales into fleet-wide plaintext storage — which may weaken NIS2 Art. 21(2)(h)
    encryption policies and GDPR Art. 32(1)(a).
  remediation: |
    Enable EBS encryption in the launch template block device mapping:
      resource "aws_launch_template" "app" {
        block_device_mappings {
          device_name = "/dev/xvda"
          ebs {
            encrypted = true
          }
        }
      }
  severity: HIGH

CKV_AWS_96:
  check_name: "Ensure all data stored in Aurora is securely encrypted at rest"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An Aurora cluster without storage encryption keeps personal data in plaintext on
    the cluster volume, its snapshots, and replicas. Databases are the most common
    location of personal data, making this a potential control gap relevant to GDPR Art. 32(1)(a) and a
    potential gap in the encryption policy expected by NIS2 Art. 21(2)(h).
  remediation: |
    Enable encryption when creating the cluster (cannot be enabled later):
      resource "aws_rds_cluster" "main" {
        storage_encrypted = true
        kms_key_id        = aws_kms_key.rds.arn
      }
  severity: CRITICAL

CKV_AWS_5:
  check_name: "Ensure all data stored in the Elasticsearch is securely encrypted at rest"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Elasticsearch/OpenSearch domains frequently index personal data (search logs,
    profiles, events) and store it in plaintext when at-rest encryption is disabled.
    NIS2 Art. 21(2)(h) requires encryption policies; GDPR Art. 32(1)(a) names
    encryption as a primary technical measure.
  remediation: |
    Enable at-rest encryption at domain creation:
      resource "aws_elasticsearch_domain" "main" {
        encrypt_at_rest {
          enabled = true
        }
      }
  severity: CRITICAL

CKV_AWS_247:
  check_name: "Ensure all data stored in the Elasticsearch is encrypted with a CMK"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Encryption with the default AWS-managed key still leaves key policy, rotation,
    and audit trail outside the organisation's control. A customer-managed key lets
    the organisation enforce rotation and revoke access as NIS2 Art. 21(2)(h)
    cryptography procedures and GDPR Art. 32(1)(a) encryption expects.
  remediation: |
    Point encrypt_at_rest at a customer-managed KMS key:
      resource "aws_elasticsearch_domain" "main" {
        encrypt_at_rest {
          enabled    = true
          kms_key_id = aws_kms_key.es.arn
        }
      }
  severity: HIGH

CKV_AWS_44:
  check_name: "Ensure Neptune storage is securely encrypted"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A Neptune graph database without storage encryption stores its vertices, edges,
    and property data — often relationship graphs of individuals — in plaintext on
    disk and in snapshots, which may weaken NIS2 Art. 21(2)(h) and GDPR Art. 32(1)(a).
  remediation: |
    Enable encryption at cluster creation (immutable afterwards):
      resource "aws_neptune_cluster" "main" {
        storage_encrypted = true
      }
  severity: CRITICAL

CKV_AWS_347:
  check_name: "Ensure Neptune is encrypted by KMS using a customer managed Key (CMK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Using the AWS-managed key rather than a customer-managed key deprives the
    organisation of key-policy control, rotation schedules, and cross-account audit —
    the cryptographic governance NIS2 Art. 21(2)(h) requires and GDPR Art. 32(1)(a)
    encryption should be able to demonstrate.
  remediation: |
    Specify a customer-managed KMS key for the Neptune cluster:
      resource "aws_neptune_cluster" "main" {
        storage_encrypted = true
        kms_key_arn       = aws_kms_key.neptune.arn
      }
  severity: HIGH

CKV_AWS_279:
  check_name: "Ensure Neptune snapshot is securely encrypted"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Unencrypted snapshots can be copied to any account or region in plaintext,
    removing the cluster's encryption boundary exactly where data is most portable.
    NIS2 Art. 21(2)(h) and GDPR Art. 32(1)(a) expect encryption to follow the data
    into backups.
  remediation: |
    Create snapshots only from encrypted clusters (snapshots inherit the source
    cluster's encryption); re-encrypt manual copies under a CMK:
      resource "aws_neptune_cluster_snapshot" "main" {
        db_cluster_identifier = aws_neptune_cluster.main.id  # source is encrypted
      }
  severity: HIGH

CKV_AWS_280:
  check_name: "Ensure Neptune snapshot is encrypted by KMS using a customer managed Key (CMK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Snapshots under the AWS-managed key cannot carry the organisation's key policy or
    rotation regime, weakening the demonstrable encryption governance of NIS2
    Art. 21(2)(h) and GDPR Art. 32(1)(a) once data leaves the live cluster.
  remediation: |
    Copy manual snapshots under a customer-managed key:
      resource "aws_neptune_cluster_snapshot" "main" {
        db_cluster_identifier = aws_neptune_cluster.main.id
      }
      # copy with: aws neptune copy-db-cluster-snapshot \
      #   --source-... --target-... --kms-key-id <cmk-arn>
  severity: MEDIUM

CKV_AWS_327:
  check_name: "Ensure RDS Clusters are encrypted using KMS CMKs"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An RDS/Aurora cluster encrypted only with the default key gives the organisation
    no key policy, rotation, or grant-revocation control. NIS2 Art. 21(2)(h) expects
    governed cryptography and GDPR Art. 32(1)(a) expects encryption as a real,
    auditable control over personal data.
  remediation: |
    Create the cluster with a customer-managed KMS key:
      resource "aws_rds_cluster" "main" {
        storage_encrypted = true
        kms_key_id        = aws_kms_key.rds.arn
      }
  severity: HIGH

CKV_AWS_136:
  check_name: "Ensure that ECR repositories are encrypted using KMS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Container images bundle application code, configuration, and sometimes embedded
    secrets. An ECR repository on the default AES256 alias keeps that content outside
    the organisation's key governance, which may weaken the cryptography policy of NIS2
    Art. 21(2)(h) and the encryption safeguard of GDPR Art. 32(1)(a).
  remediation: |
    Set a KMS key on the repository:
      resource "aws_ecr_repository" "app" {
        encryption_configuration {
          encryption_type = "KMS"
          kms_key         = aws_kms_key.ecr.arn
        }
      }
  severity: HIGH

CKV_AWS_189:
  check_name: "Ensure that EBS Volume is encrypted by KMS using a customer managed Key (CMK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Volumes encrypted with the AWS-managed key cannot demonstrate organisation-level
    key rotation, policy, or revocation — the governance NIS2 Art. 21(2)(h) expects
    of cryptography and GDPR Art. 32(1)(a) relies on for encryption of personal data.
  remediation: |
    Encrypt volumes with a customer-managed key:
      resource "aws_ebs_volume" "data" {
        encrypted  = true
        kms_key_id = aws_kms_key.ebs.arn
      }
  severity: MEDIUM

CKV_AWS_186:
  check_name: "Ensure S3 bucket Object is encrypted by KMS using a customer managed Key (CMK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Default SSE with AWS-managed keys encrypts objects but keeps key policy, grants,
    and rotation outside the organisation's control. A CMK lets access to personal
    data in S3 be revoked and audited, as the cryptography governance of NIS2
    Art. 21(2)(h) and GDPR Art. 32(1)(a) expects.
  remediation: |
    Require a customer-managed key in the bucket SSE configuration:
      resource "aws_s3_bucket_server_side_encryption_configuration" "data" {
        bucket = aws_s3_bucket.data.id
        rule {
          apply_server_side_encryption_by_default {
            sse_algorithm     = "aws:kms"
            kms_master_key_id = aws_kms_key.s3.arn
          }
        }
      }
  severity: MEDIUM

CKV_AWS_173:
  check_name: "Check encryption settings for Lambda environmental variable"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Lambda environment variables frequently carry connection strings, tokens, and
    personal-data processing flags; without envelope encryption via a customer-managed
    key they are protected only by default AWS keys. NIS2 Art. 21(2)(h) and GDPR
    Art. 32(1)(a) expect governed encryption of that material.
  remediation: |
    Set a KMS key for the function's environment variables:
      resource "aws_lambda_function" "app" {
        kms_key_arn = aws_kms_key.lambda.arn
      }
  severity: HIGH

CKV_AWS_58:
  check_name: "Ensure EKS Cluster has Secrets Encryption Enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Kubernetes secrets — API keys, credentials, personal-data access tokens — are
    stored by default only with etcd's disk encryption. Envelope encryption with a
    KMS provider is the encryption-at-rest control NIS2 Art. 21(2)(h) expects and
    GDPR Art. 32(1)(a) requires for personal data.
  remediation: |
    Enable KMS envelope encryption for secrets at cluster creation:
      resource "aws_eks_cluster" "main" {
        encryption_config {
          resources = ["secrets"]
          provider {
            key_arn = aws_kms_key.eks.arn
          }
        }
      }
  severity: HIGH

CKV_AWS_7:
  check_name: "Ensure rotation for customer created CMKs is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A customer-managed key that never rotates extends the lifetime of any compromised
    key material indefinitely. Key rotation is the operational half of a cryptography
    policy under NIS2 Art. 21(2)(h) and underpins the ongoing effectiveness of the
    encryption GDPR Art. 32(1)(a) requires.
  remediation: |
    Enable automatic annual rotation for every CMK:
      resource "aws_kms_key" "main" {
        is_enabled                = true
        enable_key_rotation       = true
        rotation_period_in_days   = 365
      }
  severity: MEDIUM

CKV2_AWS_64:
  check_name: "Ensure KMS key Policy is defined"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A KMS key without an explicit policy inherits account-root defaults, so nobody
    can prove who may use or administer the key that protects personal data. Key
    policy is access control over the encryption itself (NIS2 Art. 21(2)(i)) and a
    prerequisite for the confidentiality GDPR Art. 32(1)(b) demands.
  remediation: |
    Attach a least-privilege policy to every key:
      resource "aws_kms_key" "main" {
        policy = data.aws_iam_policy_document.kms.json
      }
  severity: MEDIUM

# -----------------------------------------------------------------------------
# Encryption in transit  ->  NIS2 Art. 21(2)(h), GDPR Art. 32(1)(a)
# -----------------------------------------------------------------------------

CKV_AWS_127:
  check_name: "Ensure that Elastic Load Balancer(s) uses SSL certificates provided by AWS Certificate Manager"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An ELB listener without an ACM-managed certificate either serves traffic over
    plaintext or with ungoverned certificates that may expire silently, breaking TLS
    for personal data in transit — which may weaken NIS2 Art. 21(2)(h) and GDPR
    Art. 32(1)(a).
  remediation: |
    Terminate TLS on the load balancer with an ACM certificate:
      resource "aws_lb_listener" "https" {
        protocol    = "HTTPS"
        ssl_policy = "ELBSecurityPolicy-TLS13-1-2-2021-06"
        certificate_arn = aws_acm_certificate.main.arn
      }
  severity: HIGH

CKV_AWS_376:
  check_name: "Ensure AWS Elastic Load Balancer listener uses TLS/SSL"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A plaintext HTTP listener forwards credentials, session tokens, and personal data
    across the network unencrypted, where they can be intercepted. NIS2 Art. 21(2)(h)
    requires cryptography to protect transmissions; GDPR Art. 32(1)(a) names
    encryption as the safeguard for personal data in transit.
  remediation: |
    Change the listener to HTTPS with a certificate:
      resource "aws_lb_listener" "front" {
        protocol         = "HTTPS"
        port             = 443
        ssl_policy       = "ELBSecurityPolicy-TLS13-1-2-2021-06"
        certificate_arn  = aws_acm_certificate.main.arn
      }
  severity: CRITICAL

CKV_AWS_228:
  check_name: "Verify Elasticsearch domain is using an up to date TLS policy"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Old TLS policies (TLS 1.0/1.1) are vulnerable to downgrade and decryption
    attacks, so personal data queried against the domain travels under broken
    cryptography. NIS2 Art. 21(2)(h) requires up-to-date cryptographic policies and
    GDPR Art. 32(1)(a) an effective encryption measure.
  remediation: |
    Set the domain to a modern TLS policy:
      resource "aws_elasticsearch_domain" "main" {
        domain_endpoint_options {
          tls_security_policy = "Policy-Min-TLS-1-2-PFS-2023-10"
        }
      }
  severity: MEDIUM

CKV_AWS_379:
  check_name: "Ensure AWS S3 bucket is configured with secure data transport policy"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Without a bucket policy denying aws:SecureTransport = false, clients may read and
    write objects over plain HTTP, exposing personal data on the wire. NIS2
    Art. 21(2)(h) expects cryptographic transport policies and GDPR Art. 32(1)(a)
    expects encryption of personal data in transit.
  remediation: |
    Deny non-TLS requests at the bucket policy:
      {
        "Effect": "Deny",
        "Principal": "*",
        "Action": "s3:*",
        "Resource": ["arn:aws:s3:::bucket", "arn:aws:s3:::bucket/*"],
        "Condition": { "Bool": { "aws:SecureTransport": "false" } }
      }
  severity: HIGH

CKV2_AWS_69:
  check_name: "Ensure AWS RDS database instance configured with encryption in transit"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An RDS instance without an SSL-enforcing parameter (rds.force_ssl) accepts
    plaintext database sessions, so queries carrying personal data cross the network
    unencrypted — a potential gap in the cryptography measures relevant to NIS2
    Art. 21(2)(h) and the encryption safeguard named by GDPR Art. 32(1)(a).
  remediation: |
    Force TLS on the instance's parameter group:
      resource "aws_db_parameter_group" "main" {
        parameter { name = "rds.force_ssl" value = "1" }
      }
  severity: HIGH

# -----------------------------------------------------------------------------
# Logging, monitoring and detection  ->  NIS2 Art. 21(2)(b), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV_AWS_101:
  check_name: "Ensure Neptune logging is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without audit logging on the Neptune cluster, graph queries and administrative
    actions leave no trace, so incidents involving personal data in the graph cannot
    be detected, analysed, or reconstructed as NIS2 Art. 21(2)(b) incident handling
    requires.
  remediation: |
    Export all audit logs from the cluster:
      resource "aws_neptune_cluster" "main" {
        enable_cloudwatch_logs_exports = ["audit"]
      }
  severity: HIGH

CKV_AWS_84:
  check_name: "Ensure Elasticsearch Domain Logging is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    An Elasticsearch/OpenSearch domain without log publishing produces no record of
    searches or administrative changes, so misuse of personal-data indices is
    undetectable and uninvestigable — undermining the detection and analysis duties
    of NIS2 Art. 21(2)(b).
  remediation: |
    Publish all log types to CloudWatch:
      resource "aws_elasticsearch_domain" "main" {
        log_publishing_options {
          cloudwatch_log_group_arn = aws_cloudwatch_log_group.es.arn
          log_type                 = "AUDIT_LOGS"
        }
      }
  severity: HIGH

CKV_AWS_317:
  check_name: "Ensure Elasticsearch Domain Audit Logging is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Audit logs are the only record of who queried or changed documents in the domain.
    Without them, unauthorised access to personal data cannot be established —
    blocking the incident handling NIS2 Art. 21(2)(b) requires and weakening the
    accountability GDPR Art. 32(1)(b) processing security relies on.
  remediation: |
    Enable fine-grained access control and audit logging:
      resource "aws_elasticsearch_domain" "main" {
        log_publishing_options {
          log_type                 = "AUDIT_LOGS"
          cloudwatch_log_group_arn = aws_cloudwatch_log_group.es_audit.arn
        }
      }
  severity: HIGH

CKV_AWS_324:
  check_name: "Ensure that RDS Cluster log capture is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    An RDS cluster that exports no logs leaves connection attempts, slow queries, and
    errors unrecorded. Detection and analysis of an incident touching personal data
    becomes impossible, which may weaken NIS2 Art. 21(2)(b) and the resilience of
    processing GDPR Art. 32(1)(b) expects.
  remediation: |
    Export engine logs to CloudWatch:
      resource "aws_rds_cluster" "main" {
        enabled_cloudwatch_logs_exports = ["postgresql", "slowquery"]
      }
  severity: HIGH

CKV_AWS_325:
  check_name: "Ensure that RDS Cluster audit logging is enabled for MySQL engine"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    MySQL audit logging is what records who read or modified which personal data.
    Without it, a breach investigation cannot establish scope — failing the incident
    handling duty of NIS2 Art. 21(2)(b) and the security-of-processing account GDPR
    Art. 32(1)(b) implies.
  remediation: |
    Enable the audit log export on the cluster:
      resource "aws_rds_cluster" "main" {
        enabled_cloudwatch_logs_exports = ["audit"]
      }
  severity: HIGH

CKV_AWS_92:
  check_name: "Ensure the ELB has access logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Classic load balancer access logs are the record of every request that reached
    the service. Disabling them removes the evidence needed to detect and analyse
    attacks or data-access anomalies under NIS2 Art. 21(2)(b).
  remediation: |
    Enable access logging to S3:
      resource "aws_elb" "main" {
        access_logs {
          enabled = true
          bucket  = aws_s3_bucket.logs.id
        }
      }
  severity: MEDIUM

CKV_AWS_37:
  check_name: "Ensure Amazon EKS control plane logging is enabled for all log types"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    With control-plane log types (api, audit, authenticator, controllerManager,
    scheduler) disabled, the Kubernetes audit trail is incomplete — API abuse and
    privilege escalation in the cluster cannot be detected or reconstructed as
    NIS2 Art. 21(2)(b) incident handling requires.
  remediation: |
    Enable every log type on the cluster:
      resource "aws_eks_cluster" "main" {
        enabled_log_types = ["api", "audit", "authenticator", "controllerManager", "scheduler"]
      }
  severity: HIGH

CKV_AWS_50:
  check_name: "X-Ray tracing is enabled for Lambda"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without tracing, requests that span Lambda functions cannot be followed during
    an incident, so the blast radius of a fault or intrusion is guesswork. Tracing
    supports the analysis stage of NIS2 Art. 21(2)(b) incident handling.
  remediation: |
    Enable active tracing on the function:
      resource "aws_lambda_function" "app" {
        tracing_config { mode = "Active" }
      }
  severity: LOW

CKV_AWS_126:
  check_name: "Ensure that detailed monitoring is enabled for EC2 instances"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Basic 5-minute metrics miss short anomalies; detailed monitoring gives the
    one-minute resolution needed to detect and time-line incidents, supporting the
    detection duty of NIS2 Art. 21(2)(b).
  remediation: |
    Enable detailed monitoring on the instance:
      resource "aws_instance" "app" {
        monitoring = true
      }
  severity: LOW

CKV_AWS_353:
  check_name: "Ensure that RDS instances have performance insights enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Performance Insights records query-level activity over time — the evidence
    needed to spot anomalous access patterns and analyse database incidents under
    NIS2 Art. 21(2)(b).
  remediation: |
    Enable Performance Insights on the instance:
      resource "aws_db_instance" "main" {
        performance_insights_enabled = true
      }
  severity: LOW

CKV2_AWS_30:
  check_name: "Ensure Postgres RDS as aws_db_instance has Query Logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without Postgres log capture (log_connections, log_disconnections, log_statement)
    there is no record of who touched personal data in the database, weakensing the
    incident detection and analysis NIS2 Art. 21(2)(b) requires and the accountable
    processing security of GDPR Art. 32(1)(b).
  remediation: |
    Enable the logging parameters in the instance's parameter group:
      resource "aws_db_parameter_group" "main" {
        parameter { name = "log_connections"  value = "1" }
        parameter { name = "log_disconnections" value = "1" }
      }
  severity: MEDIUM

CKV2_AWS_62:
  check_name: "Ensure S3 buckets should have event notifications enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without event notifications, writes to a bucket holding personal data raise no
    signal — unexpected mass downloads or deletions go unnoticed instead of feeding
    the detection capability NIS2 Art. 21(2)(b) requires.
  remediation: |
    Subscribe at least one notification target to bucket events:
      resource "aws_s3_bucket_notification" "data" {
        bucket = aws_s3_bucket.data.id
        lambda_function { lambda_function_arn = aws_lambda_function.auditor.arn
                          events = ["s3:ObjectCreated:*"] }
      }
  severity: LOW

# -----------------------------------------------------------------------------
# Backup, resilience and recovery  ->  NIS2 Art. 21(2)(c), GDPR Art. 32(1)(b)/(c)
# -----------------------------------------------------------------------------

CKV_AWS_144:
  check_name: "Ensure that S3 bucket has cross-region replication enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A bucket replicated only in one region is lost with that region. Cross-region
    replication is the mechanism that keeps personal data available and restorable
    after a regional outage, relevant to NIS2 Art. 21(2)(c) and GDPR Art. 32(1)(c).
  remediation: |
    Replicate the bucket to another region permitted by the EU Sovereign Cloud
    policy (an in-policy region, when available):
      resource "aws_s3_bucket_replication_configuration" "data" {
        role   = aws_iam_role.replication.arn
        bucket = aws_s3_bucket.data.id
        rule { destination { bucket = aws_s3_bucket.replica.arn } }
      }
  severity: MEDIUM

CKV2_AWS_8:
  check_name: "Ensure that RDS clusters has backup plan of AWS Backup"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Relying only on automated DB snapshots leaves database recovery outside a managed,
    tested backup regime. AWS Backup plans provide the scheduled, retention-managed,
    cross-account backups that NIS2 Art. 21(2)(c) backup management and GDPR
    Art. 32(1)(c) restoration depend on.
  remediation: |
    Add the cluster to an AWS Backup plan:
      resource "aws_backup_selection" "rds" {
        plan_id      = aws_backup_plan.daily.id
        iam_role_arn = aws_iam_role.backup.arn
        resource { arn = aws_rds_cluster.main.arn }
      }
  severity: HIGH

CKV_AWS_326:
  check_name: "Ensure that RDS Aurora Clusters have backtracking enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without backtracking, undoing a bad write on Aurora means a point-in-time restore
    measured in tens of minutes; backtracking rewinds the cluster in minutes. Fast
    recovery from data corruption is exactly the restoration ability GDPR Art. 32(1)(c)
    and NIS2 Art. 21(2)(c) target.
  remediation: |
    Enable backtracking at cluster creation:
      resource "aws_rds_cluster" "main" {
        backtrack_window = 24
      }
  severity: LOW

CKV_AWS_361:
  check_name: "Ensure that Neptune DB cluster has automated backups enabled with adequate retention"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A Neptune cluster with short or disabled backup retention cannot be restored to a
    recent point in time, so accidental deletion or corruption of personal data
    becomes permanent — failing the backup management of NIS2 Art. 21(2)(c) and the
    restore ability of GDPR Art. 32(1)(c).
  remediation: |
    Set an adequate backup retention window:
      resource "aws_neptune_cluster" "main" {
        backup_retention_period = 14
      }
  severity: HIGH

CKV_AWS_139:
  check_name: "Ensure that RDS clusters have deletion protection enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without deletion protection a single API call or console click destroys the
    cluster (and with it the availability of all personal data it holds). Protection
    against accidental or hostile deletion is the availability side of GDPR
    Art. 32(1)(b) and the continuity planning of NIS2 Art. 21(2)(c).
  remediation: |
    Enable deletion protection on the cluster:
      resource "aws_rds_cluster" "main" {
        deletion_protection = true
      }
  severity: MEDIUM

CKV2_AWS_58:
  check_name: "Ensure AWS Neptune cluster deletion protection is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Neptune graph of personal relationships can be destroyed in one call without
    deletion protection. The safeguard preserves the availability GDPR Art. 32(1)(b)
    requires and the business continuity NIS2 Art. 21(2)(c) plans for.
  remediation: |
    Enable deletion protection on the cluster:
      resource "aws_neptune_cluster" "main" {
        deletion_protection = true
      }
  severity: MEDIUM

CKV_AWS_115:
  check_name: "Ensure that AWS Lambda function is configured for function-level concurrent execution limit"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without a reserved-concurrency limit, one runaway or attacked function can
    exhaust the account's shared concurrency and starve every other workload — a
    self-inflicted availability incident that GDPR Art. 32(1)(b) resilience and NIS2
    Art. 21(2)(c) continuity expect to be prevented.
  remediation: |
    Reserve a concurrency budget for the function:
      resource "aws_lambda_function" "app" {
        reserved_concurrent_executions = 100
      }
  severity: LOW

CKV_AWS_116:
  check_name: "Ensure that AWS Lambda function is configured for a Dead Letter Queue(DLQ)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Failed invocations vanish after their retries without a DLQ — records of personal
    data processed in batches are silently dropped rather than preserved for replay.
    A DLQ is the failure-mode handling that keeps processing recoverable under NIS2
    Art. 21(2)(c).
  remediation: |
    Route failed events to an SQS dead-letter queue:
      resource "aws_lambda_function" "app" {
        dead_letter_config { target_arn = aws_sqs_queue.dlq.arn }
      }
  severity: LOW

CKV_AWS_135:
  check_name: "Ensure that EC2 is EBS optimized"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Instances without dedicated EBS throughput share network bandwidth between disk
    and traffic, so storage I/O can saturate under load and degrade the service that
    processes personal data — the resilience concern of GDPR Art. 32(1)(b) and NIS2
    Art. 21(2)(c).
  remediation: |
    Request dedicated EBS throughput on the instance:
      resource "aws_instance" "app" {
        ebs_optimized = true
      }
  severity: LOW

CKV2_AWS_59:
  check_name: "Ensure AWS ElasticSearch/OpenSearch has dedicated master node enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Without dedicated master nodes, cluster-management work competes with indexing
    and search on the data nodes, so load spikes can destabilise the whole domain.
    Separating the master role is standard resilience engineering under NIS2
    Art. 21(2)(c).
  remediation: |
    Configure dedicated master nodes:
      resource "aws_elasticsearch_domain" "main" {
        cluster_config {
          dedicated_master_enabled = true
          dedicated_master_count   = 3
        }
      }
  severity: LOW

CKV_AWS_318:
  check_name: "Ensure Elasticsearch domains are configured with at least three dedicated master nodes for HA"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Two master nodes cannot survive a split vote; three are the minimum for quorum
    after a failure. Sub-quorum master configs convert one node loss into a full
    domain outage — the opposite of the high availability NIS2 Art. 21(2)(c) and
    GDPR Art. 32(1)(b) resilience require.
  remediation: |
    Run an odd number (>= 3) of dedicated masters:
      resource "aws_elasticsearch_domain" "main" {
        cluster_config {
          dedicated_master_enabled = true
          dedicated_master_count   = 3
        }
      }
  severity: LOW

CKV2_AWS_61:
  check_name: "Ensure that an S3 bucket has a lifecycle configuration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Without lifecycle rules, log and backup objects accumulate indefinitely or are
    manually purged ad hoc, so retention for data protection and continuity purposes
    is unmanaged. Lifecycle configuration is the disciplined data lifecycle NIS2
    Art. 21(2)(c) backup management expects.
  remediation: |
    Define lifecycle rules (transition + expiry) for the bucket:
      resource "aws_s3_bucket_lifecycle_configuration" "logs" {
        bucket = aws_s3_bucket.logs.id
        rule {
          id     = "expire-logs"
          status = "Enabled"
          expiration { days = 365 }
        }
      }
  severity: LOW

CKV_AWS_313:
  check_name: "Ensure RDS cluster configured to copy tags to snapshots"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Snapshots that lose the cluster's tags cannot be located or governed by retention
    or data-classification automation — backups become untracked assets. Tag
    propagation keeps backup management (NIS2 Art. 21(2)(c)) accountable.
  remediation: |
    Copy tags onto snapshots:
      resource "aws_rds_cluster" "main" {
        copy_tags_to_snapshot = true
      }
  severity: LOW

CKV_AWS_362:
  check_name: "Neptune DB clusters should be configured to copy tags to snapshots"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Untagged Neptune snapshots escape the retention and classification rules applied
    to the live cluster, leaving backups ungoverned — the opposite of the backup
    management NIS2 Art. 21(2)(c) requires.
  remediation: |
    Copy tags onto snapshots:
      resource "aws_neptune_cluster" "main" {
        copy_tags_to_snapshot = true
      }
  severity: LOW

CKV2_AWS_60:
  check_name: "Ensure RDS instance with copy tags to snapshots is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
  risk: >
    Snapshots without the instance's tags cannot be found by restore runbooks or
    retention policies, so recovery depends on tribal knowledge. Tag propagation is
    part of accountable backup management under NIS2 Art. 21(2)(c).
  remediation: |
    Copy tags onto snapshots:
      resource "aws_db_instance" "main" {
        copy_tags_to_snapshot = true
      }
  severity: LOW

# -----------------------------------------------------------------------------
# Secure development, maintenance and supply chain
#   ->  NIS2 Art. 21(2)(e), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV_AWS_226:
  check_name: "Ensure DB instance gets all minor upgrades automatically"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
  risk: >
    Postponing minor engine patches leaves known database vulnerabilities in place —
    often for months. Automatic minor upgrades implement the ongoing maintenance and
    vulnerability handling NIS2 Art. 21(2)(e) requires of systems in production.
  remediation: |
    Enable automatic minor version upgrades:
      resource "aws_db_instance" "main" {
        auto_minor_version_upgrade = true
      }
  severity: MEDIUM

CKV_AWS_363:
  check_name: "Ensure Lambda Runtime is not deprecated"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A deprecated Lambda runtime no longer receives security patches, so the function
    that processes personal data runs on software with known, unfixable
    vulnerabilities — is inconsistent with the maintenance duties of NIS2 Art. 21(2)(e)
    and the security of processing GDPR Art. 32(1)(b) expects.
  remediation: |
    Rebuild the function on a supported runtime:
      resource "aws_lambda_function" "app" {
        runtime = "python3.12"   # a currently supported runtime
        handler = "app.handler"
      }
  severity: HIGH

CKV_AWS_272:
  check_name: "Ensure AWS Lambda function is configured to validate code-signing"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
  risk: >
    Without code-signing validation, any code that reaches the deployment package —
    including a compromised dependency or CI runner — executes with the function's
    permissions. Signature validation is the supply-chain integrity control NIS2
    Art. 21(2)(e) expects in development and deployment.
  remediation: |
    Attach a code-signing configuration to the function:
      resource "aws_lambda_code_signing_config" "main" {
        allowed_publishers {
          signing_profile_version_arns = [aws_signer_signing_profile.app.arn]
        }
      }
      resource "aws_lambda_function" "app" {
        code_signing_config_arn = aws_lambda_code_signing_config.main.arn
      }
  severity: MEDIUM

CKV_AWS_51:
  check_name: "Ensure ECR Image Tags are immutable"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Mutable tags mean the image behind "latest" can silently change, so what is
    deployed cannot be reproduced or audited and a poisoned build propagates under a
    trusted name. Tag immutability is a basic integrity control for the supply chain
    under NIS2 Art. 21(2)(e).
  remediation: |
    Make repository tags immutable:
      resource "aws_ecr_repository" "app" {
        image_tag_mutability = "IMMUTABLE"
      }
  severity: MEDIUM

CKV_AWS_163:
  check_name: "Ensure ECR image scanning on push is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Images pushed without scanning carry known CVEs straight into production,
    including into workloads that process personal data. Scan-on-push implements the
    vulnerability detection in development that NIS2 Art. 21(2)(e) requires before
    systems go live.
  remediation: |
    Enable scan-on-push for the repository:
      resource "aws_ecr_repository" "app" {
        image_scanning_configuration { scan_on_push = true }
      }
  severity: HIGH

# -----------------------------------------------------------------------------
# Secrets in code  ->  NIS2 Art. 21(2)(e), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV_AWS_41:
  check_name: "Ensure no hard coded AWS access key and secret key exists in provider"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Hard-coded AWS credentials in the provider block are committed to version control,
    readable by everyone with repo access and impossible to revoke safely. Insecure
    handling of secrets is a development-practice potential control gap relevant to NIS2 Art. 21(2)(e)
    and gives uncontrolled access to personal data, which may weaken GDPR Art. 32(1)(b).
  remediation: |
    Never inline credentials — use ambient roles or injected variables:
      provider "aws" {
        # in CI: assume-role / OIDC; locally: aws sso login
        region = "eusc-de-east-1"
      }
  severity: CRITICAL

CKV_AWS_45:
  check_name: "Ensure no hard-coded secrets exist in lambda environment"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Secrets pasted into Lambda environment variables end up in templates, state, and
    console visibility for anyone with read access. That is an insecure development
    practice under NIS2 Art. 21(2)(e) and a direct confidentiality risk to personal
    data under GDPR Art. 32(1)(b).
  remediation: |
    Fetch secrets at runtime from Secrets Manager:
      resource "aws_lambda_function" "app" {
        environment {
          variables = { DB_PASSWORD = "${aws_secretsmanager_secret_version.db.secret_string}" }
        }
      }
  severity: CRITICAL

CKV_AWS_46:
  check_name: "Ensure no hard-coded secrets exist in EC2 user data"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    user_data scripts are stored in plaintext in the Terraform state and visible in
    the console; secrets baked into them leak with every plan/apply and cannot be
    rotated without rebuilding instances — against NIS2 Art. 21(2)(e) secure
    development and GDPR Art. 32(1)(b) confidentiality.
  remediation: |
    Bootstrap with a role and fetch secrets at boot:
      resource "aws_instance" "app" {
        iam_instance_profile = aws_iam_instance_profile.app.name
        user_data = templatefile("init.sh.tpl", {
          secret_arn = aws_secretsmanager_secret.db.arn  # fetched at runtime
        })
      }
  severity: CRITICAL

# -----------------------------------------------------------------------------
# IAM and access control  ->  NIS2 Art. 21(2)(i), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV2_AWS_40:
  check_name: "Ensure AWS IAM policy does not allow full IAM privileges"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A policy granting full iam:* lets its holder create users, roles, and policies —
    including new admin access — so privilege escalation is one API call away. This
    weakens the access control NIS2 Art. 21(2)(i) requires and endangers all personal
    data under GDPR Art. 32(1)(b).
  remediation: |
    Never grant iam:* ; scope the few IAM actions genuinely needed:
      # Before:
      "Action": "iam:*"
      # After:
      "Action": ["iam:PassRole"]
      "Resource": aws_iam_role.app.arn
  severity: CRITICAL

CKV_AWS_109:
  check_name: "Ensure IAM policies does not allow permissions management / resource exposure without constraints"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Permissions-management actions (iam:PutRolePolicy, s3:PutBucketPolicy, etc.)
    without resource constraints let a principal rewrite who may access what —
    collapsing the access control NIS2 Art. 21(2)(i) mandates and exposing personal
    data, which may weaken GDPR Art. 32(1)(b).
  remediation: |
    Bound permission-management actions with explicit resources and conditions:
      {
        "Effect": "Allow",
        "Action": ["iam:AttachRolePolicy"],
        "Resource": "arn:aws:iam::123456789012:role/app-*"
      }
  severity: HIGH

CKV_AWS_111:
  check_name: "Ensure IAM policies does not allow write access without constraints"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Unconstrained write access (Action "s3:*" or "logs:*" on Resource "*") lets a
    compromised principal modify or destroy any matching resource — an integrity and
    availability risk to personal data under GDPR Art. 32(1)(b) and a least-
    privilege potential control gap relevant to NIS2 Art. 21(2)(i).
  remediation: |
    Constrain writes to named resources:
      {
        "Effect": "Allow",
        "Action": ["s3:PutObject"],
        "Resource": "arn:aws:s3:::my-app-data/*"
      }
  severity: HIGH

CKV_AWS_283:
  check_name: "Ensure no IAM policies documents allow ALL or any AWS principal permissions to the resource"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Principal of "*" (or any AWS principal) in a resource policy hands the resource
    to every account on the planet — for S3/KMS resources that means public access to
    personal data and a potential control gap relevant to the access-control measures
    in NIS2 Art. 21(2)(i) and confidentiality safeguards expected by GDPR Art. 32(1)(b).
  remediation: |
    Name the exact principals that need access:
      # Before:
      "Principal": "*"
      # After:
      "Principal": { "AWS": "arn:aws:iam::123456789012:root" }
  severity: CRITICAL

CKV_AWS_356:
  check_name: "Ensure no IAM policies documents allow \"*\" as a statement's resource for restrictable actions"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Restrictable actions on Resource "*" apply to every resource in the account, so a
    single statement can grant read or write reach over all personal data. Least
    privilege under NIS2 Art. 21(2)(i) and confidentiality under GDPR Art. 32(1)(b)
    both require scoping resources.
  remediation: |
    Scope every restrictable action to explicit ARNs:
      {
        "Action": ["logs:PutLogEvents"],
        "Resource": "${aws_cloudwatch_log_group.app.arn}:*"
      }
  severity: HIGH

CKV_AWS_70:
  check_name: "Ensure S3 bucket does not allow an action with any Principal"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A bucket policy statement whose Principal is "*" makes the bucket world-accessible
    for the listed actions — exposing any personal data in it to unauthenticated
    access and creating a potential control gap relevant to the access-control
    measures in NIS2 Art. 21(2)(i) and the confidentiality safeguards expected by
    GDPR Art. 32(1)(b).
  remediation: |
    Restrict the bucket policy to named principals:
      {
        "Effect": "Allow",
        "Principal": { "AWS": "arn:aws:iam::123456789012:role/app" },
        "Action": ["s3:GetObject"],
        "Resource": "arn:aws:s3:::my-app-data/*"
      }
  severity: CRITICAL

CKV2_AWS_41:
  check_name: "Ensure an IAM role is attached to EC2 instance"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    An instance with no IAM role forces workloads to ship static credentials (access
    keys) instead of short-lived role credentials — the exact anti-pattern the access
    control policies of NIS2 Art. 21(2)(i) are meant to eliminate.
  remediation: |
    Attach a least-privilege instance profile:
      resource "aws_instance" "app" {
        iam_instance_profile = aws_iam_instance_profile.app.name
      }
  severity: MEDIUM

CKV_AWS_79:
  check_name: "Ensure Instance Metadata Service Version 1 is not enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    IMDSv1 answers metadata requests without authentication, so an SSRF bug on the
    host is enough to steal the instance's role credentials and with them access to
    personal data. Requiring IMDSv2 (token-based) is a credential-theft control under
    NIS2 Art. 21(2)(i) and GDPR Art. 32(1)(b).
  remediation: |
    Require IMDSv2 on the instance:
      resource "aws_instance" "app" {
        metadata_options {
          http_tokens = "required"
        }
      }
  severity: HIGH

CKV_AWS_162:
  check_name: "Ensure RDS cluster has IAM authentication enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Without IAM database authentication, access to the cluster rests on long-lived
    database passwords that are shared, rarely rotated, and impossible to revoke per
    identity. Token-based authentication is the centralised access control NIS2
    Art. 21(2)(i) expects.
  remediation: |
    Enable IAM authentication on the cluster:
      resource "aws_rds_cluster" "main" {
        iam_database_authentication_enabled = true
      }
  severity: MEDIUM

CKV_AWS_359:
  check_name: "Neptune DB clusters should have IAM database authentication enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Password-only access to a graph of personal data means untraceable shared
    credentials. IAM authentication ties every session to an auditable identity, as
    the access control policies of NIS2 Art. 21(2)(i) require.
  remediation: |
    Enable IAM authentication on the cluster:
      resource "aws_neptune_cluster" "main" {
        iam_database_authentication_enabled = true
      }
  severity: MEDIUM

CKV2_AWS_52:
  check_name: "Ensure AWS ElasticSearch/OpenSearch Fine-grained access control is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without fine-grained access control every domain user can read every index — no
    document-level, role-based segregation exists for personal data held in the
    domain. That fails the access control NIS2 Art. 21(2)(i) requires and exposes data
    under GDPR Art. 32(1)(b).
  remediation: |
    Enable fine-grained access control with internal or IAM users:
      resource "aws_elasticsearch_domain" "main" {
        advanced_security_options {
          enabled                        = true
          internal_user_database_enabled = true
        }
      }
  severity: HIGH

# -----------------------------------------------------------------------------
# Network segmentation and exposure  ->  NIS2 Art. 21(2)(i), GDPR Art. 32(1)(b)
# -----------------------------------------------------------------------------

CKV_AWS_137:
  check_name: "Ensure that Elasticsearch is configured inside a VPC"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A public-facing Elasticsearch endpoint is internet-reachable and is one of the
    most exploited services for bulk personal-data exfiltration. Placing the domain
    inside a VPC applies the network access control NIS2 Art. 21(2)(i) requires and
    the confidentiality GDPR Art. 32(1)(b) demands.
  remediation: |
    Deploy the domain inside private VPC subnets:
      resource "aws_elasticsearch_domain" "main" {
        vpc_options {
          subnet_ids = [aws_subnet.private_a.id, aws_subnet.private_b.id]
        }
      }
  severity: HIGH

CKV_AWS_248:
  check_name: "Ensure that Elasticsearch is not using the default Security Group"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    The default security group's rules apply to every resource that references it,
    so the domain inherits whatever broad access other teams opened there — network
    access control by accident rather than by policy (NIS2 Art. 21(2)(i)).
  remediation: |
    Attach a dedicated, least-privilege security group:
      resource "aws_elasticsearch_domain" "main" {
        vpc_options {
          security_group_ids = [aws_security_group.es.id]
          subnet_ids         = [aws_subnet.private_a.id]
        }
      }
  severity: HIGH

CKV_AWS_38:
  check_name: "Ensure Amazon EKS public endpoint not accessible to 0.0.0.0/0"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    An EKS API endpoint open to 0.0.0.0/0 lets anyone on the internet attempt
    credential attacks against the cluster that hosts workloads processing personal
    data — a network access control potential control gap relevant to NIS2 Art. 21(2)(i) and a direct
    exposure under GDPR Art. 32(1)(b).
  remediation: |
    Restrict the endpoint to known CIDRs:
      resource "aws_eks_cluster" "main" {
        vpc_config {
          endpoint_public_access = true
          public_access_cidrs    = ["203.0.113.0/24"]
        }
      }
  severity: HIGH

CKV_AWS_39:
  check_name: "Ensure Amazon EKS public endpoint disabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    A public control-plane endpoint is an internet-reachable administrative surface;
    keeping it private routes all cluster administration over the VPC, the tighter
    network access control NIS2 Art. 21(2)(i) expects for systems handling personal
    data.
  remediation: |
    Disable public access to the endpoint:
      resource "aws_eks_cluster" "main" {
        vpc_config {
          endpoint_public_access = false
        }
      }
  severity: MEDIUM

CKV_AWS_117:
  check_name: "Ensure that AWS Lambda function is configured inside a VPC"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    A Lambda outside the VPC reaches data stores over the public internet path and
    cannot be restricted by security groups, so network-level access control over
    personal data access (NIS2 Art. 21(2)(i)) is unavailable for that function.
  remediation: |
    Attach the function to private subnets:
      resource "aws_lambda_function" "app" {
        vpc_config {
          subnet_ids         = [aws_subnet.private_a.id]
          security_group_ids = [aws_security_group.lambda.id]
        }
      }
  severity: LOW

CKV2_AWS_5:
  check_name: "Ensure that Security Groups are attached to another resource"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Orphaned security groups accumulate stale rules that later get attached "because
    they were there", importing unintended access into live environments — an
    unmanaged asset under the access control and asset management of NIS2
    Art. 21(2)(i).
  remediation: |
    Reference every security group from the resource it guards (and delete the rest):
      resource "aws_instance" "app" {
        vpc_security_group_ids = [aws_security_group.app.id]
      }
  severity: LOW

CKV_AWS_23:
  check_name: "Ensure every security group and rule has a description"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    Undocumented rules cannot be reviewed: nobody can tell which rule is a deliberate
    control and which is leftover access. Descriptions are what make rule review —
    and therefore accountable access control under NIS2 Art. 21(2)(i) — possible.
  remediation: |
    Describe the purpose of every group and rule:
      resource "aws_security_group" "web" {
        description = "Web tier: HTTP from office CIDR only"
        ingress {
          description = "HTTP from office"
          cidr_blocks = ["203.0.113.0/24"]
        }
      }
  severity: LOW

CKV_AWS_158:
  check_name: "Ensure that CloudWatch Log Group is encrypted by KMS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Log groups commonly contain personal data (request logs, audit events, query
    trails) and are encrypted only with the AWS-managed key by default, outside the
    organisation's key governance. NIS2 Art. 21(2)(h) expects governed encryption;
    GDPR Art. 32(1)(a) names encryption of personal data as the safeguard.
  remediation: |
    Encrypt the log group with a customer-managed key:
      resource "aws_cloudwatch_log_group" "app" {
        kms_key_id = aws_kms_key.logs.arn
      }
  severity: MEDIUM

CKV_AWS_338:
  check_name: "Ensure CloudWatch log groups retains logs for at least 1 year"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Short log retention destroys the evidence trail before many incidents are
    discovered (breaches are frequently detected months after the fact), weakensing
    the post-incident analysis NIS2 Art. 21(2)(b) requires and the accountable
    processing security of GDPR Art. 32(1)(b).
  remediation: |
    Retain logs for at least a year:
      resource "aws_cloudwatch_log_group" "app" {
        retention_in_days = 365
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# CloudFront  (cloudfront.tf)  ->  transport encryption / WAF / logging / resilience
# -----------------------------------------------------------------------------

CKV_AWS_34:
  check_name: "Ensure CloudFront distribution ViewerProtocolPolicy is set to HTTPS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A "allow-all" viewer protocol policy serves the same content over plaintext HTTP,
    so any viewer can downgrade the connection and send credentials, session cookies,
    and personal data in the clear. NIS2 Art. 21(2)(h) requires cryptography to protect
    transmissions; GDPR Art. 32(1)(a) names encryption as the safeguard for personal
    data in transit.
  remediation: |
    Force HTTPS (or a redirect to it) for viewers:
      resource "aws_cloudfront_distribution" "assets" {
        default_cache_behavior {
          viewer_protocol_policy = "redirect-to-https"
        }
      }
  severity: CRITICAL

CKV_AWS_174:
  check_name: "Verify CloudFront Distribution Viewer Certificate is using TLS v1.2 or higher"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A viewer certificate pinned to TLSv1 negotiates a protocol with known downgrade
    and decryption weaknesses, so the "HTTPS" badge on the distribution does not mean
    the transport is actually protected. NIS2 Art. 21(2)(h) expects cryptography policy
    to keep pace with protocol strength; GDPR Art. 32(1)(a) treats encryption as the
    safeguard for personal data in transit.
  remediation: |
    Require TLS 1.2 or newer at the viewer:
      resource "aws_cloudfront_distribution" "assets" {
        viewer_certificate {
          minimum_protocol_version = "TLSv1.2_2021"
        }
      }
  severity: HIGH

CKV2_AWS_42:
  check_name: "Ensure AWS CloudFront distribution uses custom SSL certificate"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    The default CloudFront certificate covers only the *.cloudfront.net name and cannot
    be scoped by key policy, rotated, or audited — the certificate governance NIS2
    Art. 21(2)(h) expects for cryptography is absent. Viewers also cannot verify they
    reached the organisation's domain, a precondition for trusting the TLS that GDPR
    Art. 32(1)(a) relies on for personal data in transit.
  remediation: |
    Attach an ACM/IAM custom certificate for your own domain:
      resource "aws_cloudfront_distribution" "assets" {
        aliases = ["assets.example.com"]
        viewer_certificate {
          acm_certificate_arn            = aws_acm_certificate.assets.arn
          minimum_protocol_version       = "TLSv1.2_2021"
          ssl_support_method             = "sni-only"
        }
      }
  severity: MEDIUM

CKV_AWS_68:
  check_name: "CloudFront Distribution should have WAF enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without a Web ACL in front, the distribution has no application-layer filter for the
    OWASP-style attacks a CDN is the natural place to block — no rule ever logs, alerts,
    or drops a malicious request. This is a defence-in-depth gap, not a breach by itself:
    the absence of a WAF removes the detection and blocking layer that NIS2 Art. 21(2)(b)
    incident handling and the resilience GDPR Art. 32(1)(b) expects both rely on.
  remediation: |
    Attach a WAFv2 Web ACL to the distribution:
      resource "aws_cloudfront_distribution" "assets" {
        web_acl_id = aws_wafv2_web_acl.cdn.arn
      }
  severity: MEDIUM

CKV2_AWS_47:
  check_name: "Ensure AWS CloudFront attached WAFv2 WebACL is configured with AMR for Log4j Vulnerability"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Web ACL that omits the AWS Managed Rules Log4j rule set leaves the known-CVE request
    patterns unfiltered at the edge, so a vulnerable origin has no compensating control.
    This is a defence-in-depth gap rather than a confirmed exploit: the missing managed
    rule set weakens the detection and blocking that NIS2 Art. 21(2)(b) incident handling
    and GDPR Art. 32(1)(b) resilience assume is present.
  remediation: |
    Add the AWS Managed Rules Log4j rule group to the Web ACL:
      resource "aws_wafv2_web_acl" "cdn" {
        rule {
          name     = "aws-managed-log4j"
          priority = 10
          override_action { count {} }
          statement {
            managed_rule_group_statement {
              name        = "AWSManagedRulesKnownBadInputsRuleSet"
              vendor_name = "AWS"
            }
          }
        }
      }
  severity: MEDIUM

CKV2_AWS_32:
  check_name: "Ensure CloudFront distribution has a response headers policy attached"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With no response headers policy the distribution emits no HSTS, CSP, or X-Content-Type
    headers, so browsers fall back to insecure defaults and the integrity of the content
    delivered to users is not enforced at the edge. That is a hardening gap in the
    delivered system rather than a breach — the missing headers weaken the secure
    configuration NIS2 Art. 21(2)(e) expects and the integrity GDPR Art. 32(1)(b)
    requires.
  remediation: |
    Attach a managed or custom response headers policy:
      resource "aws_cloudfront_distribution" "assets" {
        default_cache_behavior {
          response_headers_policy_id = aws_cloudfront_response_headers_policy.secure.id
        }
      }
  severity: LOW

CKV_AWS_86:
  check_name: "Ensure CloudFront distribution has Access Logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without a logging_config block there is no edge-level record of requests — no way to
    reconstruct who fetched what, or when, during an investigation. NIS2 Art. 21(2)(b)
    requires detection and analysis of incidents; GDPR Art. 32(1)(b) expects an
    accountable record of how personal data was processed.
  remediation: |
    Enable access logging to a bucket the organisation controls:
      resource "aws_cloudfront_distribution" "assets" {
        logging_config {
          bucket          = aws_s3_bucket.cf_logs.bucket_regional_domain_name
          include_cookies = false
          prefix          = "cloudfront/assets/"
        }
      }
  severity: MEDIUM

CKV_AWS_374:
  check_name: "Ensure AWS CloudFront web distribution has geo restriction enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A distribution with no geo restriction is reachable from every region, including
    jurisdictions the organisation has no data-transfer basis or threat interest in.
    That widens the attack surface and complicates the transfer-control story for
    personal data; restricting delivery to expected locations is the access scoping that
    NIS2 Art. 21(2)(i) and the confidentiality concern of GDPR Art. 32(1)(b) both point
    to.
  remediation: |
    Whitelist the countries the service is actually delivered to:
      resource "aws_cloudfront_distribution" "assets" {
        restrictions {
          geo_restriction {
            restriction_type = "whitelist"
            locations        = ["DE", "AT", "CH"]
          }
        }
      }
  severity: LOW

CKV_AWS_305:
  check_name: "Ensure CloudFront distribution has a default root object configured"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
  risk: >
    An empty default root object means a bare request to the distribution root falls
    through to directory listing or an origin-generated index, which can expose more of
    the backing store than the application intends. It is a configuration-hardening gap
    rather than a confirmed exposure: the secure-defaults expectation of NIS2
    Art. 21(2)(e) is not met by the delivered system.
  remediation: |
    Set the object the distribution should serve at the root:
      resource "aws_cloudfront_distribution" "assets" {
        default_root_object = "index.html"
      }
  severity: LOW

CKV_AWS_310:
  check_name: "Ensure CloudFront distributions should have origin failover configured"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A single origin with no failover is a hard dependency on one bucket or service: if it
    is unavailable, the whole distribution is, with no automatic path to a standby.
    Origin failover is the edge-level continuity control that keeps content — and any
    personal data it carries — accessible, which is what NIS2 Art. 21(2)(c) continuity
    and GDPR Art. 32(1)(c) timely restoration expect.
  remediation: |
    Define a primary and failover origin in an origin group:
      resource "aws_cloudfront_distribution" "assets" {
        origin_group {
          origin_id = "assetsGroup"
          failover_criteria {
            status_codes = [500, 502, 503, 504]
          }
          member {
            origin_id = "assetsPrimary"
          }
          member {
            origin_id = "assetsFailover"
          }
        }
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# API Gateway  (apigateway.tf)  ->  tracing / logging / caching / deployment hygiene
# -----------------------------------------------------------------------------
# Graph checks CKV2_AWS_29 / CKV2_AWS_51 are mapped below, not deferred: the
# loader keys findings by check ID, so graph findings enrich the same way.

CKV_AWS_276:
  check_name: "Ensure Data Trace is not enabled in API Gateway Method Settings"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    This is not a logging gap — logging is *on*. Data trace logs the full request and
    response bodies, so whatever personal data an API carries (names, tokens, free-text
    fields) is written verbatim into CloudWatch, where it is retained far longer than
    the transport itself and readable by anyone with log access. Capturing personal data
    into a broad log store is a confidentiality exposure in its own right under GDPR
    Art. 32(1)(b), and it does not improve NIS2 Art. 21(2)(b) incident handling —
    metadata-level tracing already shows which method, caller, and status failed.
  remediation: |
    Turn off full-body capture, keep method-level logging and tracing on:
      resource "aws_api_gateway_method_settings" "prod" {
        settings {
          logging_level      = "INFO"
          metrics_enabled    = true
          data_trace_enabled = false
        }
      }
  severity: HIGH

CKV_AWS_76:
  check_name: "Ensure API Gateway has Access Logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without access_log_settings there is no record of who called which API method, with
    what source, and what status came back — an incident at the API boundary cannot be
    reconstructed. NIS2 Art. 21(2)(b) requires detection and analysis of incidents;
    GDPR Art. 32(1)(b) expects an accountable record of how personal data was processed.
  remediation: |
    Send stage access logs to a retained, KMS-encrypted log group:
      resource "aws_api_gateway_stage" "prod" {
        access_log_settings {
          destination_arn = aws_cloudwatch_log_group.api.arn
          format = jsonencode({
            requestId      = "$context.requestId"
            ip             = "$context.identity.sourceIp"
            requestTime    = "$context.requestTime"
            httpMethod     = "$context.httpMethod"
            resourcePath   = "$context.resourcePath"
            status         = "$context.status"
            protocol       = "$context.protocol"
          })
        }
      }
  severity: MEDIUM

CKV_AWS_73:
  check_name: "Ensure API Gateway has X-Ray Tracing enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without X-Ray the service map of an API — which integration latency spiked, which
    downstream call failed — has to be guessed from status codes alone. Distributed
    tracing is the evidence that lets an incident be timed and scoped under NIS2
    Art. 21(2)(b).
  remediation: |
    Enable tracing on the stage:
      resource "aws_api_gateway_stage" "prod" {
        xray_tracing_enabled = true
      }
  severity: LOW

CKV2_AWS_51:
  check_name: "Ensure AWS API Gateway endpoints uses client certificate authentication"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(j)"
      title: "Authentication and secured communications"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A stage with no client certificate trusts the caller's identity claim alone — any
    system that can reach the endpoint can impersonate a legitimate client. Mutual TLS
    at the API boundary is the authentication control NIS2 Art. 21(2)(j) expects for
    secured communications, and its absence weakens the confidentiality and integrity
    of the processing systems GDPR Art. 32(1)(b) describes.
  remediation: |
    Require a client certificate on the stage:
      resource "aws_api_gateway_stage" "prod" {
        client_certificate_id = aws_api_gateway_client_certificate.this.id
      }
  severity: MEDIUM

CKV2_AWS_29:
  check_name: "Ensure public API gateway are protected by WAF"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A public API stage with no Web ACL has no application-layer filter in front of it,
    so common attack traffic reaches the integrations unblocked and unlogged. This is a
    defence-in-depth gap, not a breach by itself: the missing WAF removes the detection
    and blocking layer that NIS2 Art. 21(2)(b) incident handling and the resilience GDPR
    Art. 32(1)(b) expects both rely on.
  remediation: |
    Attach a WAFv2 Web ACL to the stage:
      resource "aws_api_gateway_stage" "prod" {
        web_acl_arn = aws_wafv2_web_acl.api.arn
      }
  severity: MEDIUM

CKV_AWS_120:
  check_name: "Ensure API Gateway caching is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A stage with caching disabled sends every request straight to the integration, so a
    burst of traffic or a downstream slowdown propagates directly to the API's callers.
    Caching is the capacity headroom that keeps a personal-data-processing service
    available under load — the resilience concern of GDPR Art. 32(1)(b) and the
    continuity expectation of NIS2 Art. 21(2)(c).
  remediation: |
    Enable the stage cache (and encrypt it):
      resource "aws_api_gateway_stage" "prod" {
        cache_cluster_enabled = true
        cache_cluster_size    = "0.5"
      }
  severity: LOW

CKV_AWS_225:
  check_name: "Ensure API Gateway method setting caching is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    With method caching off, the identical request is re-executed at the integration
    every time, multiplying load and latency for no benefit. Per-method caching is the
    finer-grained capacity control that keeps a service processing personal data
    responsive and available — GDPR Art. 32(1)(b) resilience, NIS2 Art. 21(2)(c)
    continuity.
  remediation: |
    Enable caching for the method settings:
      resource "aws_api_gateway_method_settings" "prod" {
        settings {
          caching_enabled      = true
          cache_ttl_in_seconds = 300
        }
      }
  severity: LOW

CKV_AWS_237:
  check_name: "Ensure Create before destroy for API Gateway"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without create-before-destroy, redeploying the API destroys the current stage before
    the replacement exists, so the endpoint — and the personal data it serves — is
    unreachable for the duration of the apply. The lifecycle ordering that keeps
    availability continuous is what NIS2 Art. 21(2)(c) continuity and GDPR Art. 32(1)(c)
    timely restoration expect.
  remediation: |
    Order the replacement before the destroy:
      resource "aws_api_gateway_rest_api" "app" {
        lifecycle {
          create_before_destroy = true
        }
      }
  severity: MEDIUM

CKV_AWS_217:
  check_name: "Ensure Create before destroy for API deployments"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A deployment that destroys first leaves a window where the stage points at no
    deployment and every call fails. Ordering the replacement before the destroy keeps
    the published API continuously available — the continuity NIS2 Art. 21(2)(c) and the
    timely restoration GDPR Art. 32(1)(c) require.
  remediation: |
    Order the replacement before the destroy:
      resource "aws_api_gateway_deployment" "app" {
        lifecycle {
          create_before_destroy = true
        }
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# SNS  (sns.tf)  ->  encryption at rest
# -----------------------------------------------------------------------------

CKV_AWS_26:
  check_name: "Ensure all data stored in the SNS topic is encrypted"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A topic without a customer-managed KMS key is encrypted under an AWS-owned key whose
    policy and rotation nobody in the organisation can see or control. Notification
    payloads routinely carry personal data (order events, user activity, case updates),
    so the auditable key governance GDPR Art. 32(1)(a) expects for encryption and the
    cryptography policies NIS2 Art. 21(2)(h) requires cannot be demonstrated.
  remediation: |
    Encrypt the topic with a customer-managed KMS key:
      resource "aws_sns_topic" "app_notifications" {
        name              = "app-notifications"
        kms_master_key_id = aws_kms_key.sns.arn
      }
  severity: HIGH


# -----------------------------------------------------------------------------
# Secrets Manager  (secretsmanager.tf)  ->  secret encryption / rotation
# -----------------------------------------------------------------------------
# CKV_AWS_149 and the custom EUGUARD_NIS2_001 check are two halves of one
# pattern: EUGUARD_NIS2_001 flags the *bad* version (a literal password in
# aws_db_instance), and a properly configured Secrets Manager secret is the
# *fix* — see the remediation below.

CKV_AWS_149:
  check_name: "Ensure that Secrets Manager secret is encrypted using KMS CMK"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A secret encrypted with the account default key is protected by a key whose policy
    is shared across every default-key secret in the account and cannot be scoped to
    this one. Secrets are the keys to personal data, so the encryption governance GDPR
    Art. 32(1)(a) expects — a dedicated, policy-controlled key — and the cryptography
    policy NIS2 Art. 21(2)(h) requires are both absent. This is also the encryption half
    of the pattern the custom check EUGUARD_NIS2_001 addresses: that check flags a
    literal password hardcoded in aws_db_instance, and a Secrets Manager secret
    encrypted with a customer-managed key is the intended replacement.
  remediation: |
    Encrypt the secret with a dedicated customer-managed key:
      resource "aws_secretsmanager_secret" "db_password" {
        name       = "db-password"
        kms_key_id = aws_kms_key.secrets.arn
      }

    # Then reference it instead of hardcoding the value — this is the fix for
    # EUGUARD_NIS2_001 (hardcoded secrets in aws_db_instance):
      resource "aws_db_instance" "main" {
        password = jsondecode(aws_secretsmanager_secret_version.db_password.secret_string)["password"]
      }
  severity: HIGH

CKV2_AWS_57:
  check_name: "Ensure Secrets Manager secrets should have automatic rotation enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A secret that never rotates has a permanent value: once it leaks — through a log, a
    forked repo, a former maintainer — it stays valid until someone notices and rotates
    it by hand. Automatic rotation is the secure-development hygiene NIS2 Art. 21(2)(e)
    expects and limits the blast radius of a leaked credential protecting personal data
    under GDPR Art. 32(1)(b).
  remediation: |
    Attach a rotation Lambda and schedule:
      resource "aws_secretsmanager_secret_rotation" "db_password" {
        secret_id           = aws_secretsmanager_secret.db_password.id
        rotation_lambda_arn = aws_lambda_function.rotate.arn

        rotation_rules {
          automatically_after_days = 30
        }
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# ALB / ELBv2  (alb.tf)  ->  transport encryption / logging / availability / hardening
# -----------------------------------------------------------------------------
# Graph checks CKV2_AWS_20 / CKV2_AWS_28 are mapped below, not deferred: the
# loader keys findings by check ID, so graph findings enrich the same way.

CKV_AWS_2:
  check_name: "Ensure ALB protocol is HTTPS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A plaintext HTTP listener forwards credentials, session tokens, and personal data
    across the network unencrypted, where they can be intercepted. NIS2 Art. 21(2)(h)
    requires cryptography to protect transmissions; GDPR Art. 32(1)(a) names encryption
    as the safeguard for personal data in transit.
  remediation: |
    Change the listener to HTTPS with a certificate:
      resource "aws_lb_listener" "web_https" {
        load_balancer_arn = aws_lb.web.arn
        port              = 443
        protocol          = "HTTPS"
        ssl_policy        = "ELBSecurityPolicy-TLS13-1-2-2021-06"
        certificate_arn   = aws_acm_certificate.web.arn

        default_action {
          type             = "forward"
          target_group_arn = aws_lb_target_group.web.arn
        }
      }
  severity: CRITICAL

CKV_AWS_103:
  check_name: "Ensure that load balancer is using at least TLS 1.2"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A listener that accepts TLS 1.0/1.1 negotiates protocols with known downgrade and
    decryption weaknesses, so the "HTTPS" listener does not guarantee the transport is
    actually protected. NIS2 Art. 21(2)(h) expects cryptography policy to keep pace with
    protocol strength; GDPR Art. 32(1)(a) treats encryption as the safeguard for
    personal data in transit.
  remediation: |
    Pin the listener to a TLS 1.2+ policy:
      resource "aws_lb_listener" "web_https" {
        protocol       = "HTTPS"
        ssl_policy     = "ELBSecurityPolicy-TLS13-1-2-2021-06"
        certificate_arn = aws_acm_certificate.web.arn
      }
  severity: HIGH

CKV_AWS_378:
  check_name: "Ensure AWS Load Balancer doesn't use HTTP protocol"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    A target group speaking plain HTTP to its targets means traffic is decrypted at the
    balancer and re-sent unencrypted across the VPC network, so credentials and personal
    data travel in the clear on the internal hop even when the client connection is
    HTTPS. NIS2 Art. 21(2)(h) requires cryptography to protect transmissions; GDPR
    Art. 32(1)(a) names encryption as the safeguard for personal data in transit.
  remediation: |
    Use an HTTPS target group and listener:
      resource "aws_lb_target_group" "web" {
        protocol = "HTTPS"
        port     = 443
      }
  severity: HIGH

CKV2_AWS_20:
  check_name: "Ensure that ALB redirects HTTP requests into HTTPS ones"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An HTTP listener that forwards instead of redirecting keeps a working plaintext path
    to the application, so clients (and attackers) can stay on an unencrypted connection
    even where an HTTPS listener exists. Closing the downgrade path is what NIS2
    Art. 21(2)(h) transport cryptography and GDPR Art. 32(1)(a) encryption of personal
    data in transit expect.
  remediation: |
    Redirect, don't forward, on port 80:
      resource "aws_lb_listener" "web_http" {
        load_balancer_arn = aws_lb.web.arn
        port              = 80
        protocol          = "HTTP"

        default_action {
          type = "redirect"
          redirect {
            port        = "443"
            protocol    = "HTTPS"
            status_code = "HTTP_301"
          }
        }
      }
  severity: HIGH

CKV2_AWS_28:
  check_name: "Ensure public facing ALB are protected by WAF"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    An internet-facing load balancer with no Web ACL has no application-layer filter in
    front of it, so common attack traffic reaches the targets unblocked and unlogged.
    This is a defence-in-depth gap, not a breach by itself: the missing WAF removes the
    detection and blocking layer that NIS2 Art. 21(2)(b) incident handling and the
    resilience GDPR Art. 32(1)(b) expects both rely on.
  remediation: |
    Attach a WAFv2 Web ACL to the load balancer:
      resource "aws_wafv2_web_acl" "alb" {
        scope = "REGIONAL"
      }
      resource "aws_wafv2_web_acl_association" "web" {
        resource_arn = aws_lb.web.arn
        web_acl_arn  = aws_wafv2_web_acl.alb.arn
      }
  severity: MEDIUM

CKV_AWS_91:
  check_name: "Ensure the ELBv2 (Application/Network) has access logging enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without an access_logs block there is no record of the requests the load balancer
    accepted and rejected — no way to reconstruct a request trail during an incident at
    the application boundary. NIS2 Art. 21(2)(b) requires detection and analysis of
    incidents; GDPR Art. 32(1)(b) expects an accountable record of how personal data was
    processed.
  remediation: |
    Enable access logging to a bucket the organisation controls:
      resource "aws_lb" "web" {
        access_logs {
          bucket  = aws_s3_bucket.alb_logs.bucket
          prefix  = "web-alb"
          enabled = true
        }
      }
  severity: MEDIUM

CKV_AWS_131:
  check_name: "Ensure that ALB drops HTTP headers"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Forwarding invalid header fields passes malformed or hostile input straight to the
    targets, keeping request-smuggling and header-injection paths open. Dropping them is
    the input-hygiene control that protects the integrity of the systems processing
    personal data — GDPR Art. 32(1)(b) — and is part of the secure configuration NIS2
    Art. 21(2)(e) expects in a delivered system.
  remediation: |
    Drop invalid header fields at the balancer:
      resource "aws_lb" "web" {
        drop_invalid_header_fields = true
      }
  severity: MEDIUM

CKV_AWS_328:
  check_name: "Ensure that ALB is configured with defensive or strictest desync mitigation mode"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    "monitor" mode only observes HTTP desync anomalies; it does not protect against them,
    so request-smuggling attempts that can poison caches or bypass access control are
    logged but still reach the targets. A defensive mode is the protective control for
    the integrity of the processing systems GDPR Art. 32(1)(b) requires and part of the
    secure configuration NIS2 Art. 21(2)(e) expects.
  remediation: |
    Raise the desync mitigation mode:
      resource "aws_lb" "web" {
        desync_mitigation_mode = "defensive"
      }
  severity: MEDIUM

CKV_AWS_150:
  check_name: "Ensure that Load Balancer has deletion protection enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    Without deletion protection a single mis-scoped `terraform destroy` — or a stray
    `aws_lb` removal in a PR — deletes the entry point to the application and everything
    behind it becomes unreachable. Deletion protection is the cheap guard that keeps the
    availability of a personal-data-serving service from depending on a clean apply,
    which NIS2 Art. 21(2)(c) continuity and GDPR Art. 32(1)(c) restoration expect.
  remediation: |
    Enable deletion protection:
      resource "aws_lb" "web" {
        enable_deletion_protection = true
      }
  severity: MEDIUM

CKV_AWS_261:
  check_name: "Ensure HTTP HTTPS Target group defines Healthcheck"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A target group with no health check cannot distinguish a healthy target from a dead
    one, so traffic keeps being sent to instances that stopped serving — the balancer
    keeps the *load* but drops the *balancing*. Health checks are the availability
    control that keeps a service processing personal data resilient under partial
    failure, as GDPR Art. 32(1)(b) and NIS2 Art. 21(2)(c) expect.
  remediation: |
    Define a health check for the target group:
      resource "aws_lb_target_group" "web" {
        health_check {
          enabled             = true
          path                = "/health"
          matcher             = "200"
          interval            = 30
          healthy_threshold   = 2
          unhealthy_threshold = 2
        }
      }
  severity: LOW


# -----------------------------------------------------------------------------
# CloudTrail  (cloudtrail.tf)  ->  audit logging / integrity / cryptography
# -----------------------------------------------------------------------------
# Account-level trail: coverage, integrity, delivery notification, log
# integration and encryption all left off. CKV2_AWS_10 is a graph check; the
# loader keys findings by check ID, so graph findings enrich the same way.

CKV_AWS_67:
  check_name: "Ensure CloudTrail is enabled in all Regions"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    A single-region trail records management events in one region only, so
    activity in every other region — including a region an attacker pivots
    into — leaves no audit trail at all. This project deploys only to the AWS
    European Sovereign Cloud, so an out-of-region foothold is precisely the
    activity that would never appear in the trail; under the EUSC-only
    EUGUARD_GDPR_001 policy, any region outside that partition is already a
    data-residency red flag, and here it is also an invisible one. NIS2
    Art. 21(2)(b) requires detection and analysis of incidents, which a
    partial trail cannot support.
  remediation: |
    Make the trail multi-region (and multi-account via an organization trail):
      resource "aws_cloudtrail" "account_trail" {
        name                  = "account-trail"
        s3_bucket_name        = aws_s3_bucket.cloudtrail_logs.id
        is_multi_region_trail = true
        # org-level: is_organization_trail = true
      }
  severity: HIGH

CKV_AWS_36:
  check_name: "Ensure CloudTrail log file validation is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without log file validation the trail's digest is not published, so there
    is no cryptographic proof that a log file was delivered by CloudTrail and
    has not been tampered with since. A gap in the evidence cannot be told
    apart from an alteration of the evidence, which weakens the integrity of
    the audit record GDPR Art. 32(1)(b) expects for processing systems and
    undermines the incident handling NIS2 Art. 21(2)(b) relies on it for.
  remediation: |
    Enable log file validation:
      resource "aws_cloudtrail" "account_trail" {
        enable_log_file_validation = true
      }
  severity: MEDIUM

CKV_AWS_35:
  check_name: "Ensure CloudTrail logs are encrypted at rest using KMS CMKs"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    CloudTrail logs delivered without a KMS key are encrypted with an
    AWS-owned key, so the key policy, who may decrypt the audit trail, and
    whether rotation is enforced stay outside the organisation's control. The
    trail records account, source-IP and resource activity that is personal
    data, and the audit trail is also the evidence base for every other
    control — the encryption and key governance NIS2 Art. 21(2)(h) and GDPR
    Art. 32(1)(a) expect cannot be demonstrated for it.
  remediation: |
    Encrypt the trail with a customer-managed KMS key:
      resource "aws_cloudtrail" "account_trail" {
        kms_key_id = aws_kms_key.cloudtrail.arn
      }
      # The key policy must allow cloudtrail.amazonaws.com to
      # GenerateDataKey*/Decrypt on the key.
  severity: HIGH

CKV_AWS_252:
  check_name: "Ensure CloudTrail defines an SNS Topic"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without an SNS topic there is no notification when new log files are
    delivered, so the arrival of the audit trail cannot fan out to a
    monitoring pipeline, an alerting rule, or an archival job. The logs are
    written but nothing reacts to them, which is a detection gap, not a
    logging gap — NIS2 Art. 21(2)(b) covers incident detection and handling,
    and notification is the plumbing that makes detection possible.
  remediation: |
    Attach an SNS topic to the trail:
      resource "aws_cloudtrail" "account_trail" {
        sns_topic_name = aws_sns_topic.cloudtrail.name
      }
  severity: LOW

CKV2_AWS_10:
  check_name: "Ensure CloudTrail trails are integrated with CloudWatch Logs"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    A trail that writes only to S3 is not queryable: without the CloudWatch
    Logs integration there is no log group to attach a metric filter or an
    alarm to, so suspicious API activity lands in an object store and stays
    there instead of raising an alert. NIS2 Art. 21(2)(b) requires incidents
    to be detected and analysed, which presupposes the trail is actually
    wired to a monitoring target.
  remediation: |
    Ship the trail to a CloudWatch Logs group:
      resource "aws_cloudtrail" "account_trail" {
        cloud_watch_logs_role_arn  = aws_iam_role.cloudtrail_logs.arn
        cloud_watch_logs_group_arn = aws_cloudwatch_log_group.cloudtrail.arn
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# CodeBuild  (codebuild.tf)  ->  supply chain / build hardening / logging
# -----------------------------------------------------------------------------

CKV_AWS_316:
  check_name: "Ensure CodeBuild project environments do not have privileged mode enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Privileged mode runs the build container as root with host device access, so a
    compromised build script or a malicious dependency can break out of the container
    and reach the build host — the build is the trust root of every artifact it
    produces. Privileged mode is required only for Docker-in-Docker builds, and the
    standard remedy is a dedicated image-build pipeline, not a permanently privileged
    project. This is a build-pipeline hardening gap under NIS2 Art. 21(2)(e), and a
    risk to the integrity of the systems that pipeline feeds (GDPR Art. 32(1)(b)).
  remediation: |
    Disable privileged mode; for image builds use a separate pipeline with the
    minimum required privileges:
      resource "aws_codebuild_project" "app" {
        environment {
          privileged_mode = false
        }
      }
  severity: HIGH

CKV_AWS_147:
  check_name: "Ensure CodeBuild project artifacts are encrypted using a KMS CMK"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Build output encrypted with an AWS-owned key, rather than a customer-managed
    KMS key, leaves the key policy and the decrypt permissions outside the
    organisation's control — artifacts are readable to any account role with
    access to the artifact store, and the access cannot be audited or revoked
    through key policy. Build output can carry compiled application code,
    embedded credentials, and packaged personal data, so the encryption and key
    governance NIS2 Art. 21(2)(h) and GDPR Art. 32(1)(a) expect cannot be
    demonstrated for it.
  remediation: |
    Set a customer-managed KMS key on the project:
      resource "aws_codebuild_project" "app" {
        encryption_key = aws_kms_key.codebuild.arn
      }
  severity: HIGH

CKV_AWS_314:
  check_name: "Ensure CodeBuild project environments have a logging configuration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without a logs_config block the build's CloudWatch Logs group is not pinned, so
    the build transcript — the record of what a pipeline actually fetched, built and
    published — has no guaranteed destination and cannot be searched when a build is
    later suspected of having pulled a compromised dependency or leaked a secret into
    its output. NIS2 Art. 21(2)(b) requires detection and analysis of incidents, and
    the build log is the primary evidence for a supply-chain incident.
  remediation: |
    Configure the logging block on the project:
      resource "aws_codebuild_project" "app" {
        logs_config {
          cloudwatch_logs {
            status      = "ENABLED"
            group_name  = aws_cloudwatch_log_group.codebuild.name
          }
        }
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# ECS  (ecs.tf)  ->  network exposure, logging, and workload hardening
# -----------------------------------------------------------------------------

CKV_AWS_333:
  check_name: "Ensure ECS task definitions do not have public IP assigned"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Fargate task launched with assign_public_ip = true gets a routable internet
    address, so the workload is directly reachable from outside the VPC instead of
    through the load balancer or the NAT gateway that egress is meant to traverse.
    This is the same uncontrolled exposure as a publicly accessible database
    (cf. CKV_AWS_17) or a subnet that assigns public IPs by default
    (cf. CKV_AWS_130): a network segmentation and access control control gap relevant to
    NIS2 Art. 21(2)(i) and a confidentiality risk to the systems that process
    personal data under GDPR Art. 32(1)(b).
  remediation: |
    Launch the tasks into private subnets without a public IP and front them with
    an internal load balancer; use a NAT gateway for egress:
      resource "aws_ecs_service" "app" {
        network_configuration {
          subnets          = [aws_subnet.private.id]   # private subnet
          assign_public_ip = false
        }
      }
  severity: CRITICAL

CKV_AWS_65:
  check_name: "Ensure ECS cluster has container insights enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without container insights the cluster reports only task state, not CPU, memory,
    network, or storage metrics per task. The first evidence of a compromised or
    resource-exhausted workload is usually a metric anomaly, and without it the
    detection and analysis NIS2 Art. 21(2)(b) requires has no data to work from.
  remediation: |
    Enable container insights on the cluster:
      resource "aws_ecs_cluster" "app" {
        setting {
          name  = "containerInsights"
          value = "enabled"
        }
      }
  severity: MEDIUM

CKV_AWS_223:
  check_name: "Ensure ECS cluster enables ECS Exec logging"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    ECS Exec opens an interactive shell into a running container, which is the
    highest-privilege access path a container offers. With logging = "NONE" those
    sessions leave no audit trail, so an interactive session into a workload that
    processes personal data cannot be detected, attributed, or reconstructed
    afterwards — the audit evidence NIS2 Art. 21(2)(b) requires for incident
    handling is not produced.
  remediation: |
    Record ECS Exec sessions to an encrypted log destination:
      resource "aws_ecs_cluster" "batch" {
        configuration {
          execute_command_configuration {
            logging      = "OVERRIDE"
            kms_key_id   = aws_kms_key.ecs_exec.arn
            log_configuration {
              cloud_watch_log_group_name    = aws_cloudwatch_log_group.ecs_exec.name
              cloud_watch_encryption_enabled = true
            }
          }
        }
      }
  severity: HIGH

CKV_AWS_224:
  check_name: "Ensure ECS Exec uses KMS encryption with a customer-managed key"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
  risk: >
    ECS Exec encrypts the interactive session between the client and the container,
    and by default uses an AWS-managed key. Without a customer-managed KMS key the
    key policy and the decrypt permissions are outside the organisation's control,
    so access to the session data cannot be governed, audited, or revoked through
    key policy. Naming a CMK is not sufficient on its own either: the check only
    passes when the log destination itself is flagged as encrypted, so a key
    reference with an unencrypted log_configuration still leaves the recorded
    session outside the encryption governance NIS2 Art. 21(2)(h) expects for the
    highest-privilege access path a container offers.
  remediation: |
    Reference a customer-managed KMS key and enable encryption on the log
    destination — both are required:
      resource "aws_ecs_cluster" "app" {
        configuration {
          execute_command_configuration {
            logging      = "OVERRIDE"
            kms_key_id   = aws_kms_key.ecs_exec.arn
            log_configuration {
              cloud_watch_log_group_name    = aws_cloudwatch_log_group.ecs_exec.name
              cloud_watch_encryption_enabled = true
            }
          }
        }
      }
  severity: MEDIUM

CKV_AWS_332:
  check_name: "Ensure ECS Service uses the latest Fargate platform version"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
  risk: >
    An older Fargate platform version stops receiving security and runtime patches,
    so the workload runs on a platform with known and increasingly unfixable
    vulnerabilities — the same maintenance gap as a deprecated Lambda runtime
    (cf. CKV_AWS_363). This is a platform currency issue, not a direct exposure or
    encryption failure, so it is ranked below the public-IP and encryption findings.
  remediation: |
    Pin the service to the latest Fargate platform version:
      resource "aws_ecs_service" "app" {
        platform_version = "LATEST"
      }
  severity: MEDIUM

CKV_AWS_336:
  check_name: "Ensure ECS task definition has a read-only root file system"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A writable root filesystem lets an attacker who reaches code execution inside
    the container persist a payload, replace a binary, or tamper with the runtime
    that the application depends on — the container is no longer the immutable
    artifact that was built and scanned. Immutability is a baseline integrity
    control for container workloads under NIS2 Art. 21(2)(e) and protects the
    integrity of the processing systems GDPR Art. 32(1)(b) expects.
  remediation: |
    Set the container's root filesystem read-only, mounting writable volumes only
    where the application genuinely needs them:
      resource "aws_ecs_task_definition" "app" {
        container_definitions = jsonencode([{
          name                    = "app"
          image                   = "app:latest"
          readonly_root_filesystem = true
          mount_points            = [{ containerPath = "/tmp", sourceVolume = "tmp" }]
        }])
        volume {
          name = "tmp"
          docker_volume_configuration {}
        }
      }
  severity: MEDIUM

CKV_AWS_249:
  check_name: "Ensure ECS task definition does not have the same task and execution role"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    The execution role is what the ECS agent uses to pull images, attach network
    interfaces and write logs — infrastructure permissions. The task role is what
    the application itself gets. Sharing one role between them means an application
    compromise yields the infrastructure permissions too, and that the pull and
    logging actions cannot be attributed to a principal separate from the workload.
    That is least-privilege separation and accountability under NIS2 Art. 21(2)(i).
  remediation: |
    Define a dedicated execution role scoped to the ECS agent's needs and keep the
    task role separate:
      resource "aws_ecs_task_definition" "app" {
        execution_role_arn = aws_iam_role.ecs_execution.arn   # agent only
        task_role_arn      = aws_iam_role.app_runtime.arn     # application only
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# ElastiCache  (elasticache.tf)  ->  encryption / auth / availability
# -----------------------------------------------------------------------------
# Redis replication group used as a session cache: the values it holds are
# session tokens, so they are simultaneously credentials and personal data.
# CKV2_AWS_50 is a graph check; the loader keys findings by check ID, so graph
# findings enrich the same way.

CKV_AWS_29:
  check_name: "Ensure all data stored in the ElastiCache Replication Group is securely encrypted at rest"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An unencrypted replication group leaves session data — and any personal data
    the application caches alongside it — readable on the underlying storage, in
    snapshots, and in any replica created from the group. GDPR Art. 32(1)(a) names
    encryption explicitly and NIS2 Art. 21(2)(h) requires cryptography controls for
    data at rest.
  remediation: |
    Enable at-rest encryption (immutable - requires recreating the group):
      resource "aws_elasticache_replication_group" "sessions" {
        at_rest_encryption_enabled = true
      }
  severity: HIGH

CKV_AWS_30:
  check_name: "Ensure all data stored in the ElastiCache Replication Group is securely encrypted at transit"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Without TLS the connection between the application and the cache is plaintext,
    so session tokens and any personal data held in the cache are readable to
    anything on the path between them. GDPR Art. 32(1)(a) names encryption and
    NIS2 Art. 21(2)(h) requires cryptography for data in transit as well as at rest.
  remediation: |
    Enable in-transit encryption:
      resource "aws_elasticache_replication_group" "sessions" {
        transit_encryption_enabled = true
      }
  severity: HIGH

CKV_AWS_31:
  check_name: "Ensure all data stored in the ElastiCache Replication Group is securely encrypted at transit and has auth token"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    Without an AUTH token any client that can reach the cluster can read and write
    its keys — there is no authentication boundary in front of the session store.
    That is an access control control gap relevant to NIS2 Art. 21(2)(i) and a confidentiality
    control gap relevant to GDPR Art. 32(1)(b).
  remediation: |
    Set an AUTH token and store it in Secrets Manager, not in the module:
      resource "aws_elasticache_replication_group" "sessions" {
        auth_token = aws_secretsmanager_secret_version.cache_auth.secret_string
      }
  severity: HIGH

CKV_AWS_191:
  check_name: "Ensure ElastiCache replication group is encrypted by KMS using a customer managed Key (CMK)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Default encryption uses an AWS owned key that is not auditable or revocable, so
    the organisation cannot account for who used the key material or take it out of
    service. A customer-managed key gives a visible key policy and CloudTrail
    records of use - the accountability NIS2 Art. 21(2)(h) expects from a
    cryptography control.
  remediation: |
    Reference a customer-managed key:
      resource "aws_elasticache_replication_group" "sessions" {
        kms_key_id = aws_kms_key.cache.arn
      }
  severity: MEDIUM

CKV2_AWS_50:
  check_name: "Ensure AWS ElastiCache Redis cluster with Multi-AZ Automatic Failover feature set to enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: >
    A single-node cache has no failover, so the loss of one node takes the whole
    session store down until it is rebuilt. For a session cache that means users are
    logged out en masse or the application fails outright - an availability gap
    against the recovery objective in NIS2 Art. 21(2)(c) and GDPR Art. 32(1)(c).
    This is a resilience gap, not data loss on its own.
  remediation: |
    Run the group across multiple nodes with automatic failover:
      resource "aws_elasticache_replication_group" "sessions" {
        num_cache_clusters     = 2
        automatic_failover_enabled = true
        multi_az_enabled       = true
      }
  severity: MEDIUM


# -----------------------------------------------------------------------------
# Redshift  (redshift.tf)  ->  exposure / encryption / logging / routing
# -----------------------------------------------------------------------------
# Data warehouse: holds the analytics copy of personal data, so exposure and
# encryption gaps are GDPR-relevant. CKV_AWS_391 is a compound check (username
# and public access together); CKV_AWS_154 is a graph check. The loader keys
# findings by check ID, so graph findings enrich the same way.

CKV_AWS_87:
  check_name: "Redshift cluster should not be publicly accessible"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A publicly accessible data warehouse is reachable from the internet, exposing
    the analytics copy of personal data to credential-stuffing and exploitation.
    This is a confidentiality control gap relevant to GDPR Art. 32(1)(b) and an access control
    control gap relevant to NIS2 Art. 21(2)(i).
  remediation: |
    Keep the cluster private and reach it only from within the VPC:
      publicly_accessible = false
  severity: CRITICAL

CKV_AWS_64:
  check_name: "Ensure all data stored in the Redshift cluster is securely encrypted at rest"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    An unencrypted cluster leaves the analytics copy of personal data readable on
    the underlying storage and in any snapshot taken from it. GDPR Art. 32(1)(a)
    names encryption explicitly and NIS2 Art. 21(2)(h) requires cryptography controls
    for data at rest.
  remediation: |
    Enable cluster encryption (immutable - requires recreating the cluster):
      encrypted = true
  severity: HIGH

CKV_AWS_142:
  check_name: "Ensure that Redshift cluster is encrypted by KMS"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: >
    Default encryption uses an AWS owned key that is not auditable or revocable, so
    the organisation cannot account for who used the key material or take it out of
    service. A customer-managed key gives a visible key policy and CloudTrail
    records of use - the accountability NIS2 Art. 21(2)(h) expects from a
    cryptography control.
  remediation: |
    Reference a customer-managed key:
      kms_key_id = aws_kms_key.warehouse.arn
  severity: MEDIUM

CKV_AWS_71:
  check_name: "Ensure Redshift Cluster logging is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
  risk: >
    Without audit logging there is no record of who queried or modified the
    warehouse, so a data-access incident cannot be detected, scoped, or
    investigated. NIS2 Art. 21(2)(b) requires the ability to handle and analyse
    incidents.
  remediation: |
    Enable audit logging to CloudWatch/S3:
      logging {
        enable      = true
        log_destination_type = "cloudwatch"
      }
  severity: MEDIUM

CKV_AWS_321:
  check_name: "Ensure Redshift clusters use enhanced VPC routing"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
  risk: >
    With enhanced VPC routing off, COPY/UNLOAD and other cluster traffic leaves the
    VPC and crosses the public AWS network path instead of flowing through
    controllable VPC resources. That bypasses the egress inspection and network
    controls NIS2 Art. 21(2)(i) expects around a system holding personal data.
    This is a network-path control, not an encryption or confidentiality measure.
  remediation: |
    Route cluster traffic through the VPC:
      enhanced_vpc_routing = true
  severity: MEDIUM

CKV_AWS_391:
  check_name: "Avoid AWS Redshift cluster with commonly used master username and public access setting enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A well-known master username (`admin`) on an internet-reachable cluster is the
    combination automated scanners look for first, so the database is one guessed
    password away from exposure. That is an access control control gap relevant to NIS2
    Art. 21(2)(i) and a confidentiality risk under GDPR Art. 32(1)(b).
  remediation: |
    Use a non-default master username and keep the cluster private:
      master_username     = "warehouse_admin"   # not admin/root
      publicly_accessible = false
  severity: HIGH

CKV_AWS_154:
  check_name: "Ensure Redshift is not deployed outside of a VPC"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A cluster deployed outside a VPC sits directly on the public AWS network with no
    subnet, security group, or flow-log boundary of its own. It cannot be segmented
    or inspected, which is the network access control NIS2 Art. 21(2)(i) expects
    around a system holding personal data.
  remediation: |
    Deploy the cluster into a private subnet group:
      cluster_subnet_group_name = aws_redshift_subnet_group.warehouse.name
  severity: HIGH


# -----------------------------------------------------------------------------
# WAFv2  (waf.tf)  ->  edge protection / detection evidence
# -----------------------------------------------------------------------------
# An ACL that is present but carries no rules and no logging provides no
# protection. CKV2_AWS_31 is a graph check; the loader keys findings by check
# ID, so graph findings enrich the same way.

CKV_AWS_192:
  check_name: "Ensure WAF prevents message lookup in Log4j2. See CVE-2021-44228 aka log4jshell"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Web ACL that omits the AWS Managed Rules Log4j rule set leaves the known-CVE
    request patterns unfiltered at the edge, so a vulnerable origin has no
    compensating control. This is a defence-in-depth gap rather than a confirmed
    exploit: the missing managed rule set weakens the detection and blocking that
    NIS2 Art. 21(2)(b) incident handling and GDPR Art. 32(1)(b) resilience assume
    is present.
  remediation: |
    Add the AWS Managed Rules Log4j rule group to the Web ACL:
      resource "aws_wafv2_web_acl" "app" {
        rule {
          name     = "aws-managed-log4j"
          priority = 10
          override_action { count {} }
          statement {
            managed_rule_group_statement {
              name        = "AWSManagedRulesKnownBadInputsRuleSet"
              vendor_name = "AWS"
            }
          }
        }
      }
  severity: MEDIUM

CKV_AWS_175:
  check_name: "Ensure WAF has associated rules"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Web ACL with no rules and a default-allow action does not inspect any traffic,
    so it provides no protection at all despite appearing in the architecture as a
    control. A missing rule set is a defence-in-depth gap, not a confirmed exploit:
    it weakens the detection and blocking that NIS2 Art. 21(2)(b) incident handling
    and GDPR Art. 32(1)(b) resilience assume is present.
  remediation: |
    Attach at least the AWS Managed Rules baseline and set a default deny:
      resource "aws_wafv2_web_acl" "app" {
        default_action { block {} }
        rule {
          name     = "aws-managed-common"
          priority = 10
          override_action { count {} }
          statement {
            managed_rule_group_statement {
              name        = "AWSManagedRulesCommonRuleSet"
              vendor_name = "AWS"
            }
          }
        }
      }
  severity: MEDIUM

CKV2_AWS_31:
  check_name: "Ensure WAF2 has a Logging Configuration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: >
    A Web ACL with no logging configuration discards every request it sees, so
    blocked and allowed traffic alike leave no record. After an incident there is
    nothing to scope it from, and the WAF cannot be used as security evidence -
    which may weaken NIS2 Art. 21(2)(b), which requires the ability to handle and
    analyse incidents.
  remediation: |
    Attach a logging configuration:
      resource "aws_wafv2_web_acl_logging_configuration" "app" {
        log_destination_configs = [aws_cloudwatch_log_group.waf.arn]
        resource_arn            = aws_wafv2_web_acl.app.arn
      }
  severity: MEDIUM
