# =============================================================================
# Azure Compliance Mapping Registry: Checkov Check ID -> EU Regulations
# =============================================================================
# NIS2 Art. 21(2) and GDPR Art. 32(1)/44 mappings for Checkov Azure checks.
# Article letters verified against Directive (EU) 2022/2555 and Regulation
# (EU) 2016/679. Severity is authored here (Checkov leaves it null).
# Check IDs confirmed to exist in Checkov 3.3.29's Terraform policy registry.
# =============================================================================

# -----------------------------------------------------------------------------
# Encryption at rest / in transit
# -----------------------------------------------------------------------------
CKV_AZURE_3:
  check_name: "Ensure that 'enable_https_traffic_only' is enabled"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Storage account data accessible over unencrypted HTTP connections can be intercepted in transit, undermining the confidentiality of personal data."
  remediation: |
    resource "azurerm_storage_account" "example" {
      enable_https_traffic_only = true
    }
  severity: HIGH

CKV_AZURE_44:
  check_name: "Ensure Storage Account is using the latest version of TLS encryption"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "A Storage Account accepting obsolete TLS versions allows data and credentials to be intercepted or modified in transit."
  remediation: |
    resource "azurerm_storage_account" "example" {
      min_tls_version = "TLS1_2"
    }
  severity: HIGH

CKV_AZURE_110:
  check_name: "Ensure that key vault enables purge protection"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(c)"
      title: "Business continuity, backup management and disaster recovery"
    - framework: GDPR
      article: "Art. 32(1)(c)"
      title: "Ability to restore availability and access to personal data in a timely manner"
  risk: "A Key Vault without purge protection allows an accidental or malicious deletion to permanently destroy keys and secrets, weakening recovery of dependent services."
  remediation: |
    resource "azurerm_key_vault" "example" {
      purge_protection_enabled = true
    }
  severity: HIGH

CKV_AZURE_41:
  check_name: "Ensure that the expiration date is set on all secrets"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Secrets without expiry dates remain valid indefinitely, increasing the window of exposure if compromised."
  remediation: |
    resource "azurerm_key_vault_secret" "example" {
      expiration_date = "2027-01-01T00:00:00Z"
    }
  severity: MEDIUM

CKV_AZURE_139:
  check_name: "Ensure ACR set to disable public networking"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A Container Registry with public network access exposes images and registry operations to hosts on the internet, widening the attack surface for supply-chain and data-access attacks."
  remediation: |
    resource "azurerm_container_registry" "example" {
      public_network_access_enabled = false
    }
  severity: HIGH

# -----------------------------------------------------------------------------
# Network exposure / access control
# -----------------------------------------------------------------------------
CKV_AZURE_35:
  check_name: "Ensure default network access rule for Storage Accounts is set to deny"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Storage accounts that accept traffic from any network are reachable by attackers scanning for exposed data."
  remediation: |
    resource "azurerm_storage_account_network_rules" "example" {
      default_action = "Deny"
    }
  severity: HIGH

CKV_AZURE_36:
  check_name: "Ensure 'Trusted Microsoft Services' is enabled for Storage Account access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Blocking trusted Microsoft services can force workarounds that widen access; allowlisting them keeps the default-deny posture workable."
  remediation: |
    resource "azurerm_storage_account_network_rules" "example" {
      bypass = ["AzureServices"]
    }
  severity: LOW

CKV_AZURE_11:
  check_name: "Ensure no SQL Databases allow ingress from 0.0.0.0/0 (ANY IP)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A firewall rule allowing any source IP exposes the database to brute-force and exploitation attempts from the entire internet."
  remediation: |
    resource "azurerm_postgresql_firewall_rule" "example" {
      start_ip_address = "10.0.0.0"
      end_ip_address   = "10.0.0.255"
    }
  severity: CRITICAL

CKV_AZURE_53:
  check_name: "Ensure 'public network access enabled' is set to 'False' for mySQL servers"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A MySQL server with public network access is reachable from any host on the internet."
  remediation: |
    resource "azurerm_mysql_server" "example" {
      public_network_access_enabled = false
    }
  severity: HIGH

CKV_AZURE_48:
  check_name: "Ensure 'public network access enabled' is set to 'False' for MariaDB servers"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "A MariaDB server with public network access is reachable from any host on the internet."
  remediation: |
    resource "azurerm_mariadb_server" "example" {
      public_network_access_enabled = false
    }
  severity: HIGH

CKV_AZURE_160:
  check_name: "Ensure that HTTP (port 80) access is restricted from the internet"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Basic cyber hygiene practices and cybersecurity training"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "HTTP port 80 open to the internet exposes a network service to probing and unauthorized access; any sensitive traffic should be restricted or protected by an appropriate HTTPS boundary."
  remediation: |
    resource "azurerm_network_security_rule" "example" {
      direction                  = "Inbound"
      access                     = "Allow"
      protocol                   = "Tcp"
      source_address_prefix      = "10.0.0.0/8"
      destination_port_range     = "80"
    }
  severity: HIGH

CKV_AZURE_59:
  check_name: "Ensure that Storage accounts disallow public access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Human resources security, access control policies and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Storage account public access lets anyone retrieve blob data without authentication — a common cause of personal-data breaches."
  remediation: |
    resource "azurerm_storage_account" "example" {
      public_network_access_enabled = false
    }
  severity: CRITICAL

CKV_AZURE_103:
  check_name: "Ensure that Azure Data Factory uses Git repository for source control"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(d)"
      title: "Regularly testing, assessing and evaluating effectiveness"
  risk: "Pipelines edited directly in production have no version history or peer review, weakening change control for data-processing logic."
  remediation: |
    resource "azurerm_data_factory" "example" {
      github_configuration {
        repository_name = "data-factory"
      }
      # Alternatively use vsts_configuration.repository_name for Azure DevOps.
    }
  severity: LOW

# -----------------------------------------------------------------------------
# Logging / monitoring / detection
# -----------------------------------------------------------------------------
CKV_AZURE_37:
  check_name: "Ensure that Activity Log Retention is set 365 days or greater"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Short log retention destroys the evidence needed to investigate and report security incidents within regulatory deadlines."
  remediation: |
    resource "azurerm_monitor_log_profile" "example" {
      retention_policy {
        enabled = true
        days    = 365
      }
    }
  severity: MEDIUM

CKV_AZURE_38:
  check_name: "Ensure audit profile captures all the activities"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "An Activity Log profile that omits write, delete, or action categories leaves gaps in the audit trail needed for incident forensics."
  remediation: |
    resource "azurerm_monitor_log_profile" "example" {
      categories = ["Write", "Delete", "Action"]
    }
  severity: MEDIUM

CKV_AZURE_84:
  check_name: "Ensure that Azure Defender is set to On for Storage"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(d)"
      title: "Regularly testing, assessing and evaluating effectiveness"
  risk: "A Storage Accounts security center pricing tier below Standard omits Azure Defender threat detection, leaving attacks on storage workloads less likely to be detected."
  remediation: |
    resource "azurerm_security_center_subscription_pricing" "example" {
      resource_type = "StorageAccounts"
      tier         = "Standard"
    }
  severity: MEDIUM

CKV_AZURE_17:
  check_name: "Ensure the web app has 'Client Certificates (Incoming client certificates)' set"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(j)"
      title: "Authentication and secured communications"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "An App Service without client certificate authentication accepts callers without the additional certificate-based identity signal expected for sensitive endpoints."
  remediation: |
    resource "azurerm_linux_web_app" "example" {
      client_certificate_enabled = true
    }
  severity: MEDIUM

CKV_AZURE_66:
  check_name: "Ensure that App service enables failed request tracing"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Without failed-request tracing, diagnostic evidence for application failures and suspicious request handling is unavailable during incident investigation."
  remediation: |
    resource "azurerm_linux_web_app" "example" {
      logs {
        failed_request_tracing = true
      }
    }
  severity: MEDIUM

CKV_AZURE_82:
  check_name: "Ensure that 'Python version' is the latest, if used to run the web app"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "An App Service using an outdated Python runtime may miss security fixes and expose application code to known runtime vulnerabilities."
  remediation: |
    resource "azurerm_app_service" "example" {
      site_config {
        python_version = "3.4"
      }
    }
  severity: MEDIUM

# -----------------------------------------------------------------------------
# Compute / infrastructure hardening
# -----------------------------------------------------------------------------
CKV_AZURE_50:
  check_name: "Ensure Virtual Machine Extensions are not Installed"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Third-party VM extensions run with elevated privileges and widen the supply-chain attack surface."
  remediation: |
    resource "azurerm_linux_virtual_machine" "example" {
      allow_extension_operations = false
    }
  severity: LOW

CKV_AZURE_52:
  check_name: "Ensure MSSQL is using the latest version of TLS encryption"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Policies and procedures on the use of cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Older TLS versions have known cryptographic weaknesses and are insufficient for protecting personal data in transit."
  remediation: |
    resource "azurerm_mssql_server" "example" {
      minimum_tls_version = "1.2"
    }
  severity: MEDIUM

CKV_AZURE_45:
  check_name: "Ensure that no sensitive credentials are exposed in VM custom_data"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(e)"
      title: "Security in network and information systems acquisition, development and maintenance"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Sensitive credentials embedded in VM custom_data can be exposed through instance metadata, logs, or state, allowing unauthorized access to the workload."
  remediation: |
    resource "azurerm_virtual_machine" "example" {
      os_profile {
        custom_data = file("cloud-init-without-credentials.yaml")
      }
    }
  severity: HIGH

CKV_AZURE_49:
  check_name: "Ensure Azure linux scale set does not use basic authentication(Use SSH Key Instead)"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(j)"
      title: "Authentication and secured communications"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity, availability and resilience of processing systems"
  risk: "Password-based authentication on VM scale sets is prone to brute force compared to SSH keys."
  remediation: |
    resource "azurerm_linux_virtual_machine_scale_set" "example" {
      disable_password_authentication = true
      admin_ssh_keys {
        username   = "azureuser"
        public_key = file("~/.ssh/id_rsa.pub")
      }
    }
  severity: MEDIUM
