# =============================================================================
# Azure Compliance Mapping Registry: Checkov Check ID -> EU Regulations
# =============================================================================
# NIS2 Art. 21(2) and GDPR Art. 32(1)/44 mappings for Checkov Azure checks.
# Article letters verified against Directive (EU) 2022/2555 and Regulation
# (EU) 2016/679. Severity is authored here (Checkov leaves it null).
# Check IDs confirmed to exist in Checkov 3.3.13's Terraform policy registry.
# =============================================================================

# -----------------------------------------------------------------------------
# Encryption at rest
# -----------------------------------------------------------------------------
CKV_AZURE_3:
  check_name: "Ensure that 'Secure transfer required' is set to 'Enabled'"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Storage account data accessible over unencrypted HTTP connections can be intercepted in transit, undermining the confidentiality of personal data."
  remediation: |
    resource "azurerm_storage_account" "example" {
      enable_https_traffic_only = true
    }
  severity: HIGH

CKV_AZURE_44:
  check_name: "Ensure that Account name space is set"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Storage account without Microsoft-managed key configuration lacks guaranteed encryption at rest."
  remediation: |
    resource "azurerm_storage_account" "example" {
      account_kind = "StorageV2"
    }
  severity: MEDIUM

CKV_AZURE_110:
  check_name: "Ensure that Key Vault allows firewall rules settings"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "A Key Vault reachable from any network exposes stored secrets and keys to a wider attack surface than necessary."
  remediation: |
    resource "azurerm_key_vault" "example" {
      network_acls {
        default_action = "Deny"
        bypass         = "AzureServices"
      }
    }
  severity: HIGH

CKV_AZURE_41:
  check_name: "Ensure that the expiration date is set on all secrets"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Secrets without expiry dates remain valid indefinitely, increasing the window of exposure if compromised."
  remediation: |
    resource "azurerm_key_vault_secret" "example" {
      expiration_date = "2027-01-01T00:00:00Z"
    }
  severity: MEDIUM

CKV_AZURE_139:
  check_name: "Ensure Container Registry uses Azure AD or RBAC authentication"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Registry images accessible with the admin account bypass Azure AD-based access control."
  remediation: |
    resource "azurerm_container_registry" "example" {
      admin_enabled = false
    }
  severity: MEDIUM

# -----------------------------------------------------------------------------
# Network exposure / access control
# -----------------------------------------------------------------------------
CKV_AZURE_35:
  check_name: "Ensure default network access rule for Storage Accounts is set to deny"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Storage accounts that accept traffic from any network are reachable by attackers scanning for exposed data."
  remediation: |
    resource "azurerm_storage_account_network_rules" "example" {
      default_action = "Deny"
    }
  severity: HIGH

CKV_AZURE_36:
  check_name: "Ensure 'Trusted Microsoft Services' is enabled for Storage Account access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Blocking trusted Microsoft services can force workarounds that widen access; allowlisting them keeps the default-deny posture workable."
  remediation: |
    resource "azurerm_storage_account_network_rules" "example" {
      bypass = ["AzureServices"]
    }
  severity: LOW

CKV_AZURE_11:
  check_name: "Ensure no SQL Databases allow ingress from 0.0.0.0/0"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Network security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "A firewall rule allowing any source IP exposes the database to brute-force and exploitation attempts from the entire internet."
  remediation: |
    resource "azurerm_postgresql_firewall_rule" "example" {
      start_ip_address = "10.0.0.0"
      end_ip_address   = "10.0.0.255"
    }
  severity: CRITICAL

CKV_AZURE_53:
  check_name: "Ensure 'public network access enabled' is set to 'False' for MySQL servers"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Network security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "A MySQL server with public network access is reachable from any host on the internet."
  remediation: |
    resource "azurerm_mysql_server" "example" {
      public_network_access_enabled = false
    }
  severity: HIGH

CKV_AZURE_48:
  check_name: "Ensure 'public network access enabled' is set to 'False' for MariaDB servers"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Network security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "A MariaDB server with public network access is reachable from any host on the internet."
  remediation: |
    resource "azurerm_mariadb_server" "example" {
      public_network_access_enabled = false
    }
  severity: HIGH

CKV_AZURE_160:
  check_name: "Ensure that SSH (TCP:22) access is restricted from the internet"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(g)"
      title: "Network security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "SSH open to the internet invites credential-stuffing and brute-force attacks against administrative access."
  remediation: |
    resource "azurerm_network_security_rule" "example" {
      direction                  = "Inbound"
      access                     = "Allow"
      source_address_prefix      = "10.0.0.0/8"
      destination_port_range     = "22"
    }
  severity: HIGH

CKV_AZURE_59:
  check_name: "Ensure that Storage Accounts disallow public access"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Storage account public access lets anyone retrieve blob data without authentication — a common cause of personal-data breaches."
  remediation: |
    resource "azurerm_storage_account" "example" {
      allow_nested_items_to_be_public = false
    }
  severity: CRITICAL

CKV_AZURE_103:
  check_name: "Ensure that Data Factory uses Git repository for collaboration"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(d)"
      title: "Regular testing and assessment of effectiveness"
  risk: "Pipelines edited directly in production have no version history or peer review, weakening change control for data-processing logic."
  remediation: |
    resource "azurerm_data_factory" "example" {
      github_enterprise_configuration { }
    }
  severity: LOW

# -----------------------------------------------------------------------------
# Logging / monitoring / detection
# -----------------------------------------------------------------------------
CKV_AZURE_37:
  check_name: "Ensure that Activity Log Retention is set 90 days or greater"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Short log retention destroys the evidence needed to investigate and report security incidents within regulatory deadlines."
  remediation: |
    resource "azurerm_monitor_log_profile" "example" {
      retention_policy {
        enabled = true
        days    = 90
      }
    }
  severity: MEDIUM

CKV_AZURE_38:
  check_name: "Ensure that Activity Log Retention is set 90 days or greater"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Activity logs without retention leave no audit trail for incident forensics."
  remediation: |
    resource "azurerm_monitor_log_profile" "example" {
      retention_policy {
        enabled = true
        days    = 90
      }
    }
  severity: MEDIUM

CKV_AZURE_84:
  check_name: "Ensure that Security Center pricing tier is set to Standard"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(d)"
      title: "Regular testing and assessment of effectiveness"
  risk: "The free tier omits advanced threat detection, leaving attacks on workloads undetected."
  remediation: |
    resource "azurerm_security_center_subscription_pricing" "example" {
      tier = "Standard"
    }
  severity: MEDIUM

CKV_AZURE_17:
  check_name: "Ensure HTTP is not used for App Service"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "App Service accepting plain HTTP lets traffic — including personal data and credentials — be read or modified in transit."
  remediation: |
    resource "azurerm_linux_web_app" "example" {
      https_only = true
    }
  severity: HIGH

CKV_AZURE_66:
  check_name: "Ensure that App Service enables HTTP logging"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(b)"
      title: "Incident handling"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Without HTTP logs, requests to the app cannot be audited or investigated after an incident."
  remediation: |
    resource "azurerm_linux_web_app" "example" {
      logs {
        http_logs { }
      }
    }
  severity: MEDIUM

CKV_AZURE_82:
  check_name: "Ensure App Service Authentication is set on Azure App Service"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "An App Service without managed authentication exposes endpoints without verifying caller identity."
  remediation: |
    resource "azurerm_linux_web_app" "example" {
      auth_settings {
        enabled = true
      }
    }
  severity: HIGH

# -----------------------------------------------------------------------------
# Compute / infrastructure hardening
# -----------------------------------------------------------------------------
CKV_AZURE_50:
  check_name: "Ensure Virtual Machine Extensions are not Installed"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(d)"
      title: "Supply chain security"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Third-party VM extensions run with elevated privileges and widen the supply-chain attack surface."
  remediation: |
    # Remove extension blocks from azurerm_linux_virtual_machine and manage agents explicitly.
  severity: LOW

CKV_AZURE_52:
  check_name: "Ensure MSSQL is using the latest version of TLS encryption"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(h)"
      title: "Cryptography and encryption"
    - framework: GDPR
      article: "Art. 32(1)(a)"
      title: "Pseudonymisation and encryption of personal data"
  risk: "Older TLS versions have known cryptographic weaknesses and are insufficient for protecting personal data in transit."
  remediation: |
    resource "azurerm_mssql_server" "example" {
      minimum_tls_version = "1.2"
    }
  severity: MEDIUM

CKV_AZURE_45:
  check_name: "Ensure that no custom subscription RBAC roles exist"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(i)"
      title: "Access control and asset management"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Custom RBAC roles bypass the audited, well-understood built-in roles and can grant unintended privileges."
  remediation: |
    # Replace custom azurerm_role_definition resources with built-in roles where possible.
  severity: LOW

CKV_AZURE_49:
  check_name: "Ensure that Virtual machine scale sets do not use basic auth"
  articles:
    - framework: NIS2
      article: "Art. 21(2)(j)"
      title: "Authentication and secured communications"
    - framework: GDPR
      article: "Art. 32(1)(b)"
      title: "Confidentiality, integrity and availability"
  risk: "Password-based authentication on VM scale sets is prone to brute force compared to SSH keys."
  remediation: |
    resource "azurerm_linux_virtual_machine_scale_set" "example" {
      os_profile {
        computer_name_prefix = "vm"
        admin_username      = "azureuser"
        admin_password      = null
        custom_data         = file("cloud-init.yaml")
      }
      # Provision SSH keys via azurerm_linux_virtual_machine_scale_set_extension or custom_data.
    }
  severity: MEDIUM
