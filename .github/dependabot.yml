version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Let new releases age before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Let new releases age before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Let new releases age before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
