name: Action e2e

# End-to-end test of the GitHub Action itself — the Docker container and
# the composite steps, not just the CLI (the CLI has its own coverage in
# ci.yml's example-scan job and the pytest suite).
#
# Assertions are on SPECIFIC check IDs, not finding counts: a count-only
# assertion wouldn't catch a regression that dropped one check while a
# different one was added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # For the upload-sarif path exercised in the first scan (Code Scanning
  # ingestion). Fork PRs lack this permission, so the input is scoped to
  # push events below.
  security-events: write

jobs:
  docker-action-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Terraform source → SARIF, severity gating disabled. If the empty
      #    fail-on-severity handling regressed, this step itself would fail
      #    with exit 2 (argparse rejecting the empty value).
      - name: Scan vulnerable Terraform fixture (sarif, gating disabled)
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: sarif
          fail-on-severity: ''
          # Code Scanning upload only on push — fork PRs can't write
          # security events.
          upload-sarif: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Assert specific check IDs in the Terraform SARIF
        run: |
          set -euo pipefail
          test -f tf-eu-guard.sarif
          for expected in CKV_AWS_18 CKV_AWS_288 EUGUARD_GDPR_001 EUGUARD_NIS2_001; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's SARIF output"; exit 1; }
            echo "OK: $expected present"
          done
          # The regulatory metadata is the tool's whole point — it must
          # ride along in the SARIF properties.
          jq -e '.runs[0].results[] | select((.properties.articles | length) > 0)' \
            tf-eu-guard.sarif > /dev/null
          jq -e '.runs[0].tool.driver.name == "tf-eu-guard"' tf-eu-guard.sarif > /dev/null

      # 2. Kubernetes through the Action — the iac-type passthrough.
      - name: "Scan Kubernetes fixture (iac-type: kubernetes)"
        uses: ./
        with:
          path: examples/vulnerable-kubernetes
          iac-type: kubernetes
          output: sarif
          fail-on-severity: ''

      - name: Assert specific check IDs in the Kubernetes SARIF
        run: |
          set -euo pipefail
          for expected in EUGUARD_NIS2_001 CKV2_K8S_6; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's k8s SARIF output"; exit 1; }
            echo "OK: $expected present"
          done

      # 3. Terraform plan JSON through the Action — the third iac-type.
      - name: "Scan plan fixture (iac-type: terraform_plan)"
        uses: ./
        with:
          path: examples/vulnerable-aws-plan/plan.json
          iac-type: terraform_plan
          output: sarif
          fail-on-severity: ''

      - name: Assert specific check IDs in the plan SARIF
        run: |
          set -euo pipefail
          for expected in EUGUARD_NIS2_001 CKV2_AWS_30; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's plan SARIF output"; exit 1; }
            echo "OK: $expected present"
          done

      # 4. HTML reports must be retrievable as a workflow artifact.
      - name: Scan with HTML reports and artifact upload
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: all
          fail-on-severity: ''
          upload-reports: true

      - name: Assert the HTML reports were written for the artifact
        run: |
          set -euo pipefail
          # The artifact upload step (if-no-files-found: ignore) won't
          # fail on its own if the reports never landed — assert here.
          ls reports/ | grep -E 'dev_report_.*\.html'
          ls reports/ | grep -E 'scan_report_.*\.html'
          ls reports/ | grep -E 'auditor_report_.*\.html'

      # 5. The severity gate must actually fail the scan step: default
      #    fail-on-severity (HIGH) on a fixture with HIGH findings.
      - name: Severity gate fails the scan step (default HIGH)
        id: gated
        continue-on-error: true
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: json

      - name: Assert the gated scan failed
        if: steps.gated.outcome != 'failure'
        run: |
          echo "::error::Default fail-on-severity (HIGH) did not fail the scan step (outcome: ${{ steps.gated.outcome }})"
          exit 1
