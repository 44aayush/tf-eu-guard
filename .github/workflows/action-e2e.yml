name: Action e2e

# End-to-end test of the GitHub Action itself — the Docker container and
# the composite steps, not just the CLI (the CLI has its own coverage in
# ci.yml's example-scan job and the pytest suite).
#
# Assertions are on SPECIFIC check IDs, not finding counts: a count-only
# assertion wouldn't catch a regression that dropped one check while a
# different one was added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-action-e2e:
    runs-on: ubuntu-24.04
    permissions:
      # Fork PRs cannot grant this permission; upload-sarif is disabled there.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 1. Terraform source → SARIF, severity gating disabled. If the empty
      #    fail-on-severity handling regressed, this step itself would fail
      #    with exit 2 (argparse rejecting the empty value).
      - name: Scan vulnerable Terraform fixture (sarif, gating disabled)
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: sarif
          fail-on-severity: ''
          # upload-reports is intentionally harmless for SARIF: it must not
          # try to upload the absent reports/ directory.
          upload-reports: true
          # Code Scanning upload only on push — fork PRs can't write
          # security events.
          upload-sarif: ${{ github.event_name == 'push' && 'true' || 'false' }}
          category: terraform-source

      - name: Assert specific check IDs in the Terraform SARIF
        run: |
          set -euo pipefail
          test -f tf-eu-guard.sarif
          for expected in CKV_AWS_18 CKV_AWS_288 EUGUARD_GDPR_001 EUGUARD_NIS2_001; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's SARIF output"; exit 1; }
            echo "OK: $expected present"
          done
          # The regulatory metadata is the tool's whole point — it must
          # ride along in the SARIF properties.
          jq -e '.runs[0].results[] | select((.properties.articles | length) > 0)' \
            tf-eu-guard.sarif > /dev/null
          jq -e '.runs[0].tool.driver.name == "tf-eu-guard"' tf-eu-guard.sarif > /dev/null

      # 1b. A custom SARIF destination must be the file consumed by the
      #     Code Scanning upload step, rather than the default path.
      - name: Scan with a custom SARIF output file
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: sarif
          output-file: action-artifacts/custom-result.sarif
          fail-on-severity: ''
          upload-sarif: ${{ github.event_name == 'push' && 'true' || 'false' }}
          category: terraform-custom

      - name: Assert the custom SARIF destination
        run: |
          set -euo pipefail
          test -f action-artifacts/custom-result.sarif
          jq -e '.runs[0].tool.driver.name == "tf-eu-guard"' \
            action-artifacts/custom-result.sarif > /dev/null

      # 2. Kubernetes through the Action — the iac-type passthrough.
      - name: "Scan Kubernetes fixture (iac-type: kubernetes)"
        uses: ./
        with:
          path: examples/vulnerable-kubernetes
          iac-type: kubernetes
          output: sarif
          fail-on-severity: ''

      - name: Assert specific check IDs in the Kubernetes SARIF
        run: |
          set -euo pipefail
          for expected in EUGUARD_NIS2_002 CKV2_K8S_6; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's k8s SARIF output"; exit 1; }
            echo "OK: $expected present"
          done

      # 3. Terraform plan JSON through the Action — the third iac-type.
      - name: "Scan plan fixture (iac-type: terraform_plan)"
        uses: ./
        with:
          path: examples/vulnerable-aws-plan/plan.json
          iac-type: terraform_plan
          output: sarif
          fail-on-severity: ''

      - name: Assert specific check IDs in the plan SARIF
        run: |
          set -euo pipefail
          # Checkov's terraform_plan runner does not run provider-level checks;
          # EUGUARD_GDPR_001 only fires on Terraform source (see README).
          for expected in EUGUARD_NIS2_001 CKV2_AWS_30; do
            jq -e --arg id "$expected" \
              '.runs[0].results[] | select(.ruleId == $id)' \
              tf-eu-guard.sarif > /dev/null \
              || { echo "::error::$expected missing from the Action's plan SARIF output"; exit 1; }
            echo "OK: $expected present"
          done

      # 4. All three HTML reports must be retrievable as a workflow artifact,
      #    including when output-dir is not the CLI default.
      - name: Scan with custom-directory HTML reports and artifact upload
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: all
          output-dir: action-artifacts
          fail-on-severity: ''
          upload-reports: true

      - name: Assert the HTML reports were written for the artifact
        run: |
          set -euo pipefail
          for prefix in dev_report scan_report auditor_report; do
            found=false
            for report in "action-artifacts/${prefix}"_*.html; do
              if [ -f "$report" ]; then
                found=true
                break
              fi
            done
            if [ "$found" != true ]; then
              echo "::error::No ${prefix} HTML report was written"
              exit 1
            fi
          done

      # 4b. A single HTML report with output-file must be written to that
      #     exact file, rather than under output-dir. This invocation leaves
      #     artifact upload disabled because upload-artifact v4 does not allow
      #     two action invocations in one workflow run to reuse one artifact name.
      - name: Scan with a custom single HTML report
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: security
          output-file: action-artifacts/custom-security.html
          fail-on-severity: ''

      - name: Assert the custom HTML report was written
        run: test -f action-artifacts/custom-security.html

      # 5. The severity gate must actually fail the scan step: default
      #    fail-on-severity (HIGH) on a fixture with HIGH findings.
      - name: Severity gate fails the scan step (default HIGH)
        id: gated
        continue-on-error: true
        uses: ./
        with:
          path: examples/vulnerable-aws
          output: json

      - name: Assert the gated scan returned findings exit code 1
        if: steps.gated.outcome != 'failure' || steps.gated.outputs['exit-code'] != '1'
        run: |
          echo "::error::Default fail-on-severity (HIGH) did not fail the scan step (outcome: ${{ steps.gated.outcome }})"
          exit 1
