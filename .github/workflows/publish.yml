name: Publish to PyPI

# Build, publish, and release the SBOM as separate trust boundaries. The
# build job never receives PyPI's OIDC permission and the publish job consumes
# only the already-built artifact.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Create isolated release tooling environment
        # Keep the virtualenv outside the checkout. build creates an sdist first,
        # and a venv inside the checkout contains absolute-path symlinks that
        # Python 3.12+ refuses to extract from that sdist.
        run: python -m venv "$RUNNER_TEMP/tf-eu-guard-release-tools"
      - name: Install hashed release tooling lock
        run: |
          "$RUNNER_TEMP/tf-eu-guard-release-tools/bin/python" -m pip install --require-hashes -r requirements-ci.lock
      - name: Build distribution
        run: |
          "$RUNNER_TEMP/tf-eu-guard-release-tools/bin/python" -m build --no-isolation
      - name: Verify the built version matches the tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          built_version="$(unzip -p dist/*.whl '*/METADATA' | awk -F': ' '$1 == "Version" {print $2; exit}')"
          if [ "$tag_version" != "$built_version" ]; then
            echo "::error::Tag version $tag_version does not match wheel metadata $built_version"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches wheel metadata $built_version"
      - name: Generate release SBOM
        run: |
          "$RUNNER_TEMP/tf-eu-guard-release-tools/bin/cyclonedx-py" requirements requirements.lock --of JSON --output-reproducible -o tf-eu-guard-${GITHUB_REF_NAME#v}.cdx.json
      - name: Upload distribution and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            tf-eu-guard-*.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/dist/

  release-sbom:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download release SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Attach SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A tag push does not automatically create a GitHub release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/tf-eu-guard-*.cdx.json --clobber
