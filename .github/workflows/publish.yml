name: Publish to PyPI

# Build, publish, and release the SBOM as separate trust boundaries. The
# build job never receives PyPI's OIDC permission and the publish job consumes
# only the already-built artifact.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build cyclonedx-bom
      - name: Build distribution
        run: python -m build
      - name: Verify the built version matches the tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          built_version="$(unzip -p dist/*.whl '*/METADATA' | awk -F': ' '$1 == "Version" {print $2; exit}')"
          if [ "$tag_version" != "$built_version" ]; then
            echo "::error::Tag version $tag_version does not match wheel metadata $built_version"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches wheel metadata $built_version"
      - name: Generate release SBOM
        run: cyclonedx-py requirements requirements.lock --of JSON --output-reproducible -o tf-eu-guard-${GITHUB_REF_NAME#v}.cdx.json
      - name: Upload distribution and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            tf-eu-guard-*.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/dist/

  release-sbom:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download release SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Attach SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A tag push does not automatically create a GitHub release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/tf-eu-guard-*.cdx.json --clobber
