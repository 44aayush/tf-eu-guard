name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check tf_eu_guard/ tools/

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the hashed runtime lock
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install supply-chain tooling
        run: python -m pip install pip-audit cyclonedx-bom
      - name: Audit the runtime lock
        # Checkov 3.3.13 pins asteval==1.0.6 and ecdsa==0.19.2; neither
        # can be upgraded without upgrading Checkov. Keep the exceptions
        # explicit until Checkov offers a compatible fix (see ISSUES.md).
        run: |
          pip-audit --strict --disable-pip --no-deps -r requirements.lock \
            --ignore-vuln PYSEC-2026-3807 \
            --ignore-vuln GHSA-9w56-46f6-3qhx \
            --ignore-vuln PYSEC-2026-1325
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.lock --of JSON --output-reproducible -o sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    needs: [lint, supply-chain]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        env:
          TFEG_RUN_CHECKOV: "1"
        run: |
          pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

      - name: Validate registry schema
        run: |
          python -c "from tf_eu_guard.mapping.loader import validate_all; print(validate_all())"

      - name: Check documented mapping counts against the registries
        # Hand-typed counts in the docs drifted before (stale 38/44/30 next to
        # the real 116/23/22/24) — regenerate from the registry files instead.
        run: |
          python tools/check_doc_counts.py

      - name: Check regulatory-coverage doc against the registries
        # docs/regulatory-coverage.md is generated (requirement-level
        # automated/partial/manual classification); this fails if it drifts
        # from the registries or the requirement inventory.
        run: |
          python tools/generate_coverage_doc.py --check

  example-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install tf-eu-guard
        run: |
          pip install -e .

      - name: Scan vulnerable examples
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-aws/ --output all
          count=$(find reports -maxdepth 1 -type f -name '*.html' | wc -l)
          test "$count" -eq 3 || { echo "::error::expected 3 HTML reports, found $count"; exit 1; }

      - name: Scan Azure/GCP examples
        # Baselines live in tools/smoke_baselines.json — the same single
        # source of truth tools/smoke_check.py (and the local Claude Code
        # hook) read. Update the counts there, not here.
        run: |
          set -euo pipefail
          for d in vulnerable-azure vulnerable-gcp; do
            tf-eu-guard scan "examples/$d/" --output json > "scan-$d.json"
            count=$(jq 'length' "scan-$d.json")
            min=$(jq -r ".terraform.vulnerable[\"examples/$d\"].min" tools/smoke_baselines.json)
            if [ "$count" -lt "$min" ]; then
              echo "::error::$d produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
              exit 1
            fi
            echo "OK: $d -> $count mapped findings"
          done

      - name: Scan end2end test suite
        # The full multi-service scenario. Every check that fires here is
        # mapped, so the unmapped count must be zero — a non-zero count means
        # a registry entry was dropped or a fixture drifted out from under
        # its mapping.
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/end2end/ --output json > end2end-scan.json
          count=$(jq 'length' end2end-scan.json)
          min=$(jq -r '.terraform.vulnerable["examples/end2end"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::end2end produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: end2end -> $count mapped findings"
          tf-eu-guard scan examples/end2end/ --output dev

      - name: Scan Terraform plan example (terraform_plan)
        # Scan the file the README actually tells users to scan — the real
        # end-to-end plan path (checkov -f <plan.json> --framework terraform_plan),
        # not the pre-shaped unit fixture.
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-aws-plan/plan.json \
            --iac-type terraform_plan --output json > plan-scan.json
          count=$(jq 'length' plan-scan.json)
          min=$(jq -r '.terraform_plan.vulnerable["examples/vulnerable-aws-plan/plan.json"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::terraform_plan scan produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: terraform_plan -> $count mapped findings"

      - name: Scan Kubernetes fixtures
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-kubernetes/ --iac-type kubernetes \
            --output json > k8s-scan.json
          count=$(jq 'length' k8s-scan.json)
          min=$(jq -r '.kubernetes.vulnerable["examples/vulnerable-kubernetes"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::kubernetes scan produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: vulnerable-kubernetes -> $count mapped findings"
          # The custom K8s secrets check must fire on the vulnerable fixture...
          for expected in EUGUARD_NIS2_002 CKV2_K8S_6; do
            grep -q "\"$expected\"" k8s-scan.json \
              || { echo "::error::$expected did not fire on the vulnerable fixture"; exit 1; }
          done
          # ...and stay quiet on the compliant one.
          tf-eu-guard scan examples/compliant-kubernetes/ --iac-type kubernetes \
            --output json > k8s-clean.json
          clean=$(jq 'length' k8s-clean.json)
          if [ "$clean" -ne 0 ]; then
            echo "::error::compliant-kubernetes produced $clean mapped findings (expected 0)"
            exit 1
          fi
          echo "OK: compliant-kubernetes -> clean"

      - name: Assert custom EU-compliance checks fire
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/end2end/ --output json > scan.json
          for id in EUGUARD_GDPR_001 EUGUARD_NIS2_001; do
            if grep -q "\"$id\"" scan.json; then
              echo "OK: $id fired and was enriched"
            else
              echo "::error::Custom check $id did not fire against examples/end2end/ (external-check loading may be broken)"
              exit 1
            fi
          done

      - name: Scan compliant examples (should be clean)
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/compliant-aws/ --output json > compliant-scan.json
          # --output json emits a top-level array of enriched findings
          finding_count=$(jq 'length' compliant-scan.json)
          test "$finding_count" -eq 0 || {
            echo "::error::Compliant example has $finding_count mapped findings (baseline: 0)"
            exit 1
          }
          echo "OK: compliant-aws matched baseline (0 mapped findings)"

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compliance-reports
          path: reports/*.html
          if-no-files-found: error
          retention-days: 30
