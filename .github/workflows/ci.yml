name: CI

# Read-only token: CI only checks out and tests code, it never writes to the repo.
permissions:
  contents: read

# One run per ref. Superseded pull-request runs are cancelled; pushes to main
# and release-tag runs (this workflow is also called by publish.yml) always
# finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by publish.yml so a release tag runs the same checks as main.
  workflow_call:

jobs:
  lint:
    name: lint
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        # Same versions as the Docker image: the hashed runtime lock, the
        # project itself without resolving anything, then the hashed dev tools
        # (requirements-dev.lock is constrained by requirements.lock).
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          pip install --no-deps -e .

      # Keep these commands identical to .githooks/pre-commit.
      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check formatting with ruff
        run: |
          ruff format --check .

      - name: Type-check with mypy
        run: |
          mypy --ignore-missing-imports tf_eu_guard tools

      - name: Install hashed workflow-lint tooling (zizmor)
        # zizmor is pinned with hashes in requirements-ci.lock, like the other
        # CI tools; it lives in its own venv outside the project environment.
        run: |
          python -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/python" -m pip install --require-hashes -r requirements-ci.lock

      - name: Audit workflows and the Action with zizmor
        # Offline (no token, no network) and with the strictest persona so
        # undocumented permissions and missing concurrency limits fail too.
        # Settings live in .github/zizmor.yml.
        run: |
          "$RUNNER_TEMP/ci-tools/bin/zizmor" --offline --persona auditor --min-severity informational .

      - name: Install actionlint (pinned release, sha256-verified)
        # Release binary rather than an action: the checksum below is the
        # only trust anchor. Dependabot cannot bump it; update the version
        # and checksum together from the release's checksums file.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows with actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color

  image-scan:
    name: image-scan
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build -t tf-eu-guard:ci .

      - name: Install trivy (pinned release, sha256-verified)
        # Same trust model as actionlint above: update the version and the
        # checksum together from the release's checksums file.
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy

      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        run: |
          "$RUNNER_TEMP/trivy" image --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml tf-eu-guard:ci

  lock-check:
    name: lock-check
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create isolated lock tooling environment
        run: python -m venv .ci-tools
      - name: Install hashed lock tooling (uv is pinned in requirements-ci.lock)
        run: .ci-tools/bin/python -m pip install --require-hashes -r requirements-ci.lock
      - name: Regenerate the lock files
        # uv keeps the versions already recorded in each lock, so this only
        # changes a file when pyproject.toml or a *.in file changed without
        # the lock being refreshed. Same command as CONTRIBUTING.md.
        run: PATH="$PWD/.ci-tools/bin:$PATH" tools/compile-locks.sh
      - name: Fail if a lock file is out of date
        run: git diff --exit-code -- requirements.lock requirements-dev.lock requirements-ci.lock

  supply-chain:
    name: supply-chain
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed runtime lock
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Create isolated supply-chain tooling environment
        run: python -m venv .ci-tools
      - name: Install hashed supply-chain tooling lock
        run: .ci-tools/bin/python -m pip install --require-hashes -r requirements-ci.lock
      - name: Validate bounded dependency exceptions
        run: python tools/check_dependency_exceptions.py
      - name: Audit the runtime lock
        # The three ignores are bounded records in dependency-exceptions.json;
        # the validation step above makes expiry and workflow drift fatal.
        run: |
          .ci-tools/bin/pip-audit --strict --disable-pip --no-deps -r requirements.lock \
            --ignore-vuln PYSEC-2026-3807 \
            --ignore-vuln GHSA-9w56-46f6-3qhx \
            --ignore-vuln PYSEC-2026-1325
      - name: Generate CycloneDX SBOM
        run: .ci-tools/bin/cyclonedx-py requirements requirements.lock --of JSON --output-reproducible -o sbom.json
      - name: Verify SBOM matches the runtime lock
        run: python tools/check_sbom_lock.py requirements.lock sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  wheel-install:
    name: wheel-install
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [supply-chain]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated wheel build environment
        run: python -m venv .ci-tools

      - name: Install hashed wheel build tooling lock
        run: .ci-tools/bin/python -m pip install --require-hashes -r requirements-ci.lock

      - name: Build wheel
        run: |
          set -euo pipefail
          .ci-tools/bin/python -m build --wheel --no-isolation --outdir dist
          .ci-tools/bin/python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/tf-eu-guard-wheel-rebuild"
          cmp dist/*.whl "$RUNNER_TEMP/tf-eu-guard-wheel-rebuild/"*.whl
          echo "OK: repeated no-isolation wheel builds are byte-for-byte identical"

      - name: Create fresh wheel installation environment
        env:
          # Keep the installed-wheel environment outside GITHUB_WORKSPACE. The
          # smoke test rejects imports whose paths are under the checkout.
          WHEEL_VENV_DIR: ${{ runner.temp }}/tf-eu-guard-wheel-venv
        run: python -m venv "$WHEEL_VENV_DIR"

      - name: Install the locked runtime and built wheel
        env:
          WHEEL_VENV_DIR: ${{ runner.temp }}/tf-eu-guard-wheel-venv
        run: |
          "$WHEEL_VENV_DIR/bin/python" -m pip install --require-hashes -r requirements.lock
          "$WHEEL_VENV_DIR/bin/python" -m pip install --no-deps dist/*.whl

      - name: Smoke-test the installed wheel outside the checkout
        env:
          WHEEL_VENV_DIR: ${{ runner.temp }}/tf-eu-guard-wheel-venv
          WHEEL_SMOKE_DIR: ${{ runner.temp }}/tf-eu-guard-wheel-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WHEEL_SMOKE_DIR"
          cd "$WHEEL_SMOKE_DIR"
          export PATH="$WHEEL_VENV_DIR/bin:$PATH"
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import tf_eu_guard
          from tf_eu_guard.checks.nis2 import secrets_in_code

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          package = Path(tf_eu_guard.__file__).resolve()
          custom_check = Path(secrets_in_code.__file__).resolve()
          if package.is_relative_to(checkout):
              raise SystemExit(f"tf_eu_guard imported from checkout: {package}")
          if custom_check.is_relative_to(checkout):
              raise SystemExit(f"custom check imported from checkout: {custom_check}")
          registry = package.parent / "mapping" / "registry-aws.yaml"
          if not registry.is_file():
              raise SystemExit(f"wheel is missing the bundled registry: {registry}")
          if not custom_check.is_file():
              raise SystemExit(f"wheel is missing the bundled custom check: {custom_check}")
          if any(Path(entry or ".").resolve().is_relative_to(checkout) for entry in sys.path):
              raise SystemExit(f"checkout unexpectedly appears on sys.path: {sys.path}")
          print(f"tf_eu_guard imported from installed wheel: {package}")
          print(f"custom check imported from installed wheel: {custom_check}")
          print(f"bundled registry loaded from: {registry}")
          PY
          tf-eu-guard version
          tf-eu-guard scan "$GITHUB_WORKSPACE/examples/compliant-aws" --output json > compliant-scan.json
          test "$(jq 'length' compliant-scan.json)" -eq 0
          echo "OK: installed wheel scanned examples/compliant-aws with zero mapped findings"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: [lint, supply-chain]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One interpreter per extra OS keeps the cost down while still
          # exercising the package's "OS Independent" classifier.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        # The lock is universal (platform markers), so the same hashed files
        # install on every matrix Python and on Windows and macOS.
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run tests
        env:
          TFEG_RUN_CHECKOV: "1"
        run: |
          pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

      - name: Validate registry schema
        run: |
          python -c "from tf_eu_guard.mapping.loader import validate_all; print(validate_all())"

      - name: Check documented mapping counts against the registries
        # Hand-typed counts in the docs drifted before (stale 38/44/30 next to
        # the real 116/23/22/24) — regenerate from the registry files instead.
        run: |
          python tools/check_doc_counts.py

      - name: Check regulatory-coverage doc against the registries
        # docs/regulatory-coverage.md is generated (requirement-level
        # automated/partial/manual classification); this fails if it drifts
        # from the registries or the requirement inventory.
        run: |
          python tools/generate_coverage_doc.py --check

  emulator:
    name: emulator
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [lint]

    # Opt-in LocalStack tier (tests/emulator): real Terraform plans and applies
    # against an emulator, so plan-format drift and ground-truth read-backs are
    # tested without a cloud account. 4.9 is the last community tag that runs
    # without an auth token.
    services:
      localstack:
        image: localstack/localstack@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,dynamodb,sts,iam

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run emulator tests
        env:
          TFEG_RUN_EMULATOR: "1"
        run: |
          pytest tests/emulator -p no:cacheprovider -o addopts=""

  example-scan:
    name: example-scan
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tf-eu-guard
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .

      - name: Scan vulnerable examples
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-aws/ --output all
          count=$(find reports -maxdepth 1 -type f -name '*.html' | wc -l)
          test "$count" -eq 3 || { echo "::error::expected 3 HTML reports, found $count"; exit 1; }

      - name: Scan Azure/GCP examples
        # Baselines live in tools/smoke_baselines.json — the same single
        # source of truth tools/smoke_check.py (and the local Claude Code
        # hook) read. Update the counts there, not here.
        run: |
          set -euo pipefail
          for d in vulnerable-azure vulnerable-gcp; do
            tf-eu-guard scan "examples/$d/" --output json > "scan-$d.json"
            count=$(jq 'length' "scan-$d.json")
            min=$(jq -r ".terraform.vulnerable[\"examples/$d\"].min" tools/smoke_baselines.json)
            if [ "$count" -lt "$min" ]; then
              echo "::error::$d produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
              exit 1
            fi
            echo "OK: $d -> $count mapped findings"
          done

      - name: Scan end2end test suite
        # The full multi-service scenario. Every check that fires here is
        # mapped, so the unmapped count must be zero — a non-zero count means
        # a registry entry was dropped or a fixture drifted out from under
        # its mapping.
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/end2end/ --output json > end2end-scan.json
          count=$(jq 'length' end2end-scan.json)
          min=$(jq -r '.terraform.vulnerable["examples/end2end"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::end2end produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: end2end -> $count mapped findings"
          tf-eu-guard scan examples/end2end/ --output dev

      - name: Scan Terraform plan example (terraform_plan)
        # Scan the file the README actually tells users to scan — the real
        # end-to-end plan path (checkov -f <plan.json> --framework terraform_plan),
        # not the pre-shaped unit fixture.
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-aws-plan/plan.json \
            --iac-type terraform_plan --output json > plan-scan.json
          count=$(jq 'length' plan-scan.json)
          min=$(jq -r '.terraform_plan.vulnerable["examples/vulnerable-aws-plan/plan.json"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::terraform_plan scan produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: terraform_plan -> $count mapped findings"

      - name: Scan Kubernetes fixtures
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/vulnerable-kubernetes/ --iac-type kubernetes \
            --output json > k8s-scan.json
          count=$(jq 'length' k8s-scan.json)
          min=$(jq -r '.kubernetes.vulnerable["examples/vulnerable-kubernetes"].min' tools/smoke_baselines.json)
          if [ "$count" -lt "$min" ]; then
            echo "::error::kubernetes scan produced $count mapped findings (floor: $min, per tools/smoke_baselines.json)"
            exit 1
          fi
          echo "OK: vulnerable-kubernetes -> $count mapped findings"
          # The custom K8s secrets check must fire on the vulnerable fixture...
          for expected in EUGUARD_NIS2_002 CKV2_K8S_6; do
            grep -q "\"$expected\"" k8s-scan.json \
              || { echo "::error::$expected did not fire on the vulnerable fixture"; exit 1; }
          done
          # ...and stay quiet on the compliant one.
          tf-eu-guard scan examples/compliant-kubernetes/ --iac-type kubernetes \
            --output json > k8s-clean.json
          clean=$(jq 'length' k8s-clean.json)
          if [ "$clean" -ne 0 ]; then
            echo "::error::compliant-kubernetes produced $clean mapped findings (expected 0)"
            exit 1
          fi
          echo "OK: compliant-kubernetes -> clean"

      - name: Assert custom EU-compliance checks fire
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/end2end/ --output json > scan.json
          for id in EUGUARD_POLICY_001 EUGUARD_NIS2_001; do
            if grep -q "\"$id\"" scan.json; then
              echo "OK: $id fired and was enriched"
            else
              echo "::error::Custom check $id did not fire against examples/end2end/ (external-check loading may be broken)"
              exit 1
            fi
          done

      - name: Scan compliant examples (should be clean)
        run: |
          set -euo pipefail
          tf-eu-guard scan examples/compliant-aws/ --output json > compliant-scan.json
          # --output json emits a top-level array of enriched findings
          finding_count=$(jq 'length' compliant-scan.json)
          test "$finding_count" -eq 0 || {
            echo "::error::Compliant example has $finding_count mapped findings (baseline: 0)"
            exit 1
          }
          echo "OK: compliant-aws matched baseline (0 mapped findings)"

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-reports
          path: reports/*.html
          if-no-files-found: error
          retention-days: 30
