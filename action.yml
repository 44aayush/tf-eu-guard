name: 'tf-eu-guard'
description: 'Scan Terraform, Terraform plan JSON, and Kubernetes for NIS2/GDPR findings with terminal, HTML, JSON, SARIF, and CI gating. Requires a Linux runner with Docker (for example ubuntu-latest); macOS and Windows runners are not supported'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to the IaC directory (or, for iac-type: terraform_plan, the "terraform show -json" plan file), relative to the repository root or an absolute path under the workspace; ".." is rejected'
    required: false
    default: './terraform'
  output:
    description: 'Report format (dev, security, auditor, json, sarif, all). The default, dev, prints a readable report to the job log; the Action does not upload SARIF unless upload-sarif is true. upload-reports applies to HTML outputs (security, auditor, or all); sarif writes tf-eu-guard.sarif into the workspace by default for GitHub Code Scanning'
    required: false
    default: 'dev'
  iac-type:
    description: 'IaC target to scan: terraform, terraform_plan (pass the plan file path as path), or kubernetes — mirrors the CLI --iac-type flag'
    required: false
    default: 'terraform'
  framework:
    description: 'Framework filter (nis2, gdpr, all)'
    required: false
    default: 'all'
  fail-on-severity:
    description: 'Fail the workflow if findings at or above this severity exist (CRITICAL, HIGH, MEDIUM, LOW, INFO); empty disables gating'
    required: false
    default: 'HIGH'
  upload-reports:
    description: 'Upload generated HTML report(s) as a workflow artifact (true, 1 or yes, any case); applies only to output security, auditor, or all (ignored for dev, json, and sarif)'
    required: false
    default: 'false'
  fail-on-any:
    description: 'Fail the workflow when any mapped finding exists, regardless of severity (true, 1 or yes, any case)'
    required: false
    default: 'false'
  fail-on-suppressed:
    description: 'Fail the workflow when any mapped finding is suppressed by an inline checkov:skip comment (true, 1 or yes, any case; mirrors --fail-on-suppressed)'
    required: false
    default: 'false'
  residency-policy:
    description: 'AWS region residency policy for EUGUARD_POLICY_001/002: eu-eea (default), eusc, or custom (requires allowed-regions); mirrors --residency-policy. Ignored with checkov-json'
    required: false
    default: 'eu-eea'
  allowed-regions:
    description: 'Comma-separated region allowlist; required with, and only valid with, residency-policy: custom; mirrors --allowed-regions'
    required: false
    default: ''
  checkov-json:
    description: 'Workspace-relative path to a pre-generated Checkov JSON result, used instead of running Checkov (path is optional when set); an absolute path must be under the workspace and ".." is rejected'
    required: false
    default: ''
  output-dir:
    description: 'Directory for generated HTML reports (default: reports/); upload-reports uses this directory for output all or when a single HTML report has no output-file'
    required: false
    default: ''
  output-file:
    description: 'Destination for one security, auditor, or SARIF report; relative paths are under the workspace, as are absolute paths beginning with the runner workspace directory; upload-reports uses this exact path for security/auditor, and upload-sarif uses it for SARIF (default: tf-eu-guard.sarif in the workspace)'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF output to GitHub Code Scanning (true, 1 or yes, any case; the workflow needs security-events: write permission); only applies when output is sarif and uses output-file or tf-eu-guard.sarif by default'
    required: false
    default: 'false'
  category:
    description: 'Optional unique GitHub Code Scanning category for this SARIF upload; set a distinct value when uploading multiple scans in one job'
    required: false
    default: ''
  artifact-name:
    description: 'Name of the workflow artifact created by upload-reports; set a distinct value when the Action runs more than once in a job or workflow with upload-reports'
    required: false
    default: 'tf-eu-guard-reports'
  timeout:
    description: 'Checkov timeout in seconds, passed to the CLI --timeout flag (0 disables it); empty keeps the CLI default'
    required: false
    default: ''
  image:
    description: 'Optional container image to run instead of the default ghcr.io/44aayush/tf-eu-guard:<action ref>. Pin by digest for a verifiable supply chain (ghcr.io/44aayush/tf-eu-guard@sha256:...). When set, a failed pull fails the step; there is no fallback to a local build'
    required: false
    default: ''
  verify-image:
    description: 'Verify the build-provenance attestation of the published image (gh attestation verify, signed by publish.yml) before running it, then run it by digest; if verification is not possible the image is built locally instead (true, 1 or yes, any case). Set false to run the tag as pulled. Ignored when image is set'
    required: false
    default: 'true'
  config:
    description: 'Workspace-relative path to a tf-eu-guard config file, passed as --config. It lives in the scanned checkout, so a pull request can change it; use trusted-config to prevent that. Cannot be combined with trusted-config'
    required: false
    default: ''
  trusted-config:
    description: 'Absolute path, outside the scanned checkout and the workspace (resolved with readlink -f), to a config file, for example a copy of the base-branch config in RUNNER_TEMP. It is mounted read-only and passed as --config, so a .tf-eu-guard.yaml or .tf-eu-guard-waivers.yaml in the scanned code is ignored. Keep it self-contained (inline settings and severity_overrides): only this file is mounted, at /trusted/config.yaml, so any file it references (waivers, registry_dirs, var_files) must be in the workspace and is controlled by the pull request. Inline checkov:skip comments in the pull request still remove findings from the gate unless fail-on-suppressed is set. Cannot be combined with config'
    required: false
    default: ''
  waivers:
    description: 'Workspace-relative path to a waivers file, passed as --waivers'
    required: false
    default: ''
  max-waiver-days:
    description: 'Do not apply a waiver that expires more than this many days from today (a whole number, passed as --max-waiver-days); its findings stay active. Empty means no limit'
    required: false
    default: ''
  baseline:
    description: 'Workspace-relative path to a baseline file, passed as --baseline'
    required: false
    default: ''
  discover-config:
    description: 'Read .tf-eu-guard.yaml and .tf-eu-guard-waivers.yaml from the scanned directory (true, 1 or yes, any case). Off by default because a pull request controls those files; on pull requests use trusted-config for settings'
    required: false
    default: 'false'
  job-summary:
    description: 'Append a Markdown summary of the scan to the job summary (true, 1 or yes, any case)'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'Exit code returned by the tf-eu-guard scan (0, 1, 2, or 3)'
    value: ${{ steps.scan.outputs.exit-code }}
  critical:
    description: 'Number of critical findings (critical)'
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: 'Number of high findings (high)'
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: 'Number of medium findings (medium)'
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: 'Number of low findings (low)'
    value: ${{ steps.scan.outputs.low }}
  info:
    description: 'Number of info findings (info)'
    value: ${{ steps.scan.outputs.info }}
  unmapped:
    description: 'Number of unmapped findings (unmapped)'
    value: ${{ steps.scan.outputs.unmapped }}
  suppressed:
    description: 'Number of suppressed findings (suppressed)'
    value: ${{ steps.scan.outputs.suppressed }}
  waived:
    description: 'Number of waived findings (waived)'
    value: ${{ steps.scan.outputs.waived }}
  baselined:
    description: 'Number of baselined findings (baselined)'
    value: ${{ steps.scan.outputs.baselined }}
  total:
    description: 'Number of total findings (all findings)'
    value: ${{ steps.scan.outputs.total }}

runs:
  using: 'composite'
  steps:
    - name: Run tf-eu-guard scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IAC_TYPE: ${{ inputs.iac-type }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_FAIL_ON_ANY: ${{ inputs.fail-on-any }}
        INPUT_FAIL_ON_SUPPRESSED: ${{ inputs.fail-on-suppressed }}
        INPUT_RESIDENCY_POLICY: ${{ inputs.residency-policy }}
        INPUT_ALLOWED_REGIONS: ${{ inputs.allowed-regions }}
        INPUT_CHECKOV_JSON: ${{ inputs.checkov-json }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_VERIFY_IMAGE: ${{ inputs.verify-image }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_UPLOAD_REPORTS: ${{ inputs.upload-reports }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TRUSTED_CONFIG: ${{ inputs.trusted-config }}
        INPUT_WAIVERS: ${{ inputs.waivers }}
        INPUT_MAX_WAIVER_DAYS: ${{ inputs.max-waiver-days }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
        INPUT_DISCOVER_CONFIG: ${{ inputs.discover-config }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_TOKEN: ${{ github.token }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail

        # Boolean inputs accept true/True/TRUE/1/yes/YES (case-insensitive).
        is_true() {
          case "$1" in
            [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]) return 0 ;;
            *) return 1 ;;
          esac
        }
        # Normalised values for the upload steps' `if:` conditions. Both start
        # false so every early exit leaves uploads disabled; the real values
        # are written after the scan, once the upload targets are checked.
        echo "upload-reports=false" >> "$GITHUB_OUTPUT"
        echo "upload-sarif=false" >> "$GITHUB_OUTPUT"
        upload_reports=false
        upload_sarif=false
        if is_true "$INPUT_UPLOAD_REPORTS"; then upload_reports=true; fi
        if is_true "$INPUT_UPLOAD_SARIF"; then upload_sarif=true; fi

        # Prefer the release image published to GHCR by publish.yml (tagged
        # with the action ref, e.g. v0.10.0). The tag is mutable, so the pulled
        # digest must carry a build-provenance attestation from that workflow
        # (gh attestation verify) and the scan then runs by digest. If the pull,
        # the digest lookup or the verification fails (ref is a branch or SHA,
        # image not published yet, no gh, registry unreachable) fall back to
        # building the image from the action's own source. An explicit `image`
        # input (for example a @sha256 digest) is used as given and never falls back.
        local_image="tf-eu-guard:action-${GITHUB_RUN_ID:-local}"
        if [ -n "$INPUT_IMAGE" ]; then
          docker pull --quiet "$INPUT_IMAGE" >/dev/null
          image="$INPUT_IMAGE"
        else
          image=""
          if [ -n "$ACTION_REF" ]; then
            candidate="ghcr.io/44aayush/tf-eu-guard:${ACTION_REF}"
            digest_re='^ghcr\.io/44aayush/tf-eu-guard@sha256:[0-9a-f]{64}$'
            ref=""
            if docker pull --quiet "$candidate" >/dev/null 2>&1 \
              && ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$candidate" 2>/dev/null)" \
              && [[ "$ref" =~ $digest_re ]]; then
              if ! is_true "$INPUT_VERIFY_IMAGE"; then
                image="$candidate"
              elif command -v gh >/dev/null 2>&1 \
                && GH_TOKEN="$ACTION_TOKEN" gh attestation verify "oci://$ref" \
                  --repo 44aayush/tf-eu-guard \
                  --signer-workflow 44aayush/tf-eu-guard/.github/workflows/publish.yml \
                  --source-ref "refs/tags/${ACTION_REF}" >/dev/null 2>&1; then
                image="$ref"
              fi
            fi
            if [ -z "$image" ]; then
              echo "::notice::could not verify the published image $candidate; building the image locally"
            fi
          fi
          if [ -z "$image" ]; then
            docker build --quiet -t "$local_image" "$ACTION_PATH"
            image="$local_image"
          fi
        fi

        # Refusal: also disable the always() upload steps so a symlink target
        # is never published.
        refuse_symlink() {
          echo "upload-reports=false" >> "$GITHUB_OUTPUT"
          echo "upload-sarif=false" >> "$GITHUB_OUTPUT"
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          # Encode like @actions/core so a newline in the name cannot start a command.
          msg=${1//'%'/%25}; msg=${msg//$'\r'/%0D}; msg=${msg//$'\n'/%0A}
          echo "::error::refusing to copy reports through a symlink in the workspace: $msg"
          exit 2
        }

        # Writable output area. The workspace is mounted read-only (the scanned
        # code is untrusted); every report is written under /out and copied
        # back into the workspace after the scan, so later steps (artifact and
        # SARIF upload) keep finding them at the usual relative paths.
        out_host="$(mktemp -d "${RUNNER_TEMP_DIR:-${TMPDIR:-/tmp}}/tf-eu-guard-out.XXXXXX")"
        trap 'rm -rf "$out_host"' EXIT

        # Map a user-supplied output location to a path under /out. A leading
        # $GITHUB_WORKSPACE/ (the workspace is mounted at its host path) or
        # /workspace/ (the old container path) is accepted as
        # workspace-relative; any other absolute path is rejected.
        out_rel() {
          local value="$1"
          value="${value#"$GITHUB_WORKSPACE"/}"
          value="${value#/workspace/}"
          case "$value" in
            /*|..|../*|*/..|*/../*)
              echo "::error::paths must be inside the workspace and must not contain '..': $1" >&2
              exit 2
              ;;
          esac
          value="${value#./}"
          printf '/out/%s' "$value"
        }

        # Same validation for inputs that read from the (read-only) workspace
        # mount: map to the host path, which is also the container path.
        ws_rel() {
          local value
          value="$(out_rel "$1")" || exit 2
          printf '%s/%s' "$GITHUB_WORKSPACE" "${value#/out/}"
        }

        args=()
        if [ -n "$INPUT_CHECKOV_JSON" ]; then
          checkov_json_path="$(ws_rel "$INPUT_CHECKOV_JSON")" || exit 2
          args+=(--checkov-json "$checkov_json_path")
        else
          scan_path="$(ws_rel "$INPUT_PATH")" || exit 2
          args+=("$scan_path")
        fi
        args+=(
          --iac-type "$INPUT_IAC_TYPE"
          --output "$INPUT_OUTPUT"
          --framework "$INPUT_FRAMEWORK"
        )
        # An empty fail-on-severity input means "no gating" — the CLI
        # accepts '' with that meaning too, but omitting the flag entirely
        # is what the input description promises.
        if [ -n "$INPUT_FAIL_ON_SEVERITY" ]; then
          args+=(--fail-on-severity "$INPUT_FAIL_ON_SEVERITY")
        fi
        if is_true "$INPUT_FAIL_ON_ANY"; then
          args+=(--fail-on-any)
        fi
        if is_true "$INPUT_FAIL_ON_SUPPRESSED"; then
          args+=(--fail-on-suppressed)
        fi
        if [ -n "$INPUT_RESIDENCY_POLICY" ]; then
          args+=(--residency-policy "$INPUT_RESIDENCY_POLICY")
        fi
        if [ -n "$INPUT_ALLOWED_REGIONS" ]; then
          args+=(--allowed-regions "$INPUT_ALLOWED_REGIONS")
        fi
        if [ -n "$INPUT_TIMEOUT" ]; then
          args+=(--timeout "$INPUT_TIMEOUT")
        fi
        # Reports always go to the writable /out mount (default: reports/).
        output_dir="$INPUT_OUTPUT_DIR"
        if [ -z "$output_dir" ]; then
          output_dir=reports
        fi
        out_dir_path="$(out_rel "$output_dir")" || exit 2
        args+=(--output-dir "$out_dir_path")
        # Machine-readable summary and counts go to a scratch dir under /out.
        args+=(
          --summary-file /out/.tf-eu-guard/summary.md
          --counts-file /out/.tf-eu-guard/counts.txt
        )
        mounts=()
        if [ -n "$INPUT_CONFIG" ] && [ -n "$INPUT_TRUSTED_CONFIG" ]; then
          echo "::error::set only one of config and trusted-config" >&2
          exit 2
        fi
        # The scanned directory is attacker-controlled in pull requests, so
        # its .tf-eu-guard*.yaml files are ignored unless discovery is opted in.
        if ! is_true "$INPUT_DISCOVER_CONFIG"; then
          args+=(--no-discovery)
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          config_path="$(ws_rel "$INPUT_CONFIG")" || exit 2
          args+=(--config "$config_path")
        fi
        if [ -n "$INPUT_TRUSTED_CONFIG" ]; then
          case "$INPUT_TRUSTED_CONFIG" in
            /*:*|*,*) trusted_ok=false ;;
            /*) trusted_ok=true ;;
            *) trusted_ok=false ;;
          esac
          if [ "$trusted_ok" != true ] || [ ! -f "$INPUT_TRUSTED_CONFIG" ]; then
            echo "::error::trusted-config must be an absolute path to an existing file (no ':' or ','): $INPUT_TRUSTED_CONFIG" >&2
            exit 2
          fi
          # Resolve symlinks first: a link outside the checkout can point into it.
          trusted_real="$(readlink -f "$INPUT_TRUSTED_CONFIG")"
          case "$trusted_real" in
            *:*|*,*) trusted_real="" ;;
          esac
          if [ -z "$trusted_real" ] || [ ! -f "$trusted_real" ]; then
            echo "::error::trusted-config must resolve to an existing file (no ':' or ','): $INPUT_TRUSTED_CONFIG" >&2
            exit 2
          fi
          # A file inside the checkout is controlled by the pull request.
          ws_phys="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          case "$trusted_real" in
            "$ws_phys"/*)
              echo "::error::trusted-config must be outside the workspace (the checkout is attacker-controlled in pull requests): $INPUT_TRUSTED_CONFIG" >&2
              exit 2
              ;;
          esac
          mounts+=(-v "$trusted_real:/trusted/config.yaml:ro")
          args+=(--config /trusted/config.yaml)
        fi
        if [ -n "$INPUT_WAIVERS" ]; then
          waivers_path="$(ws_rel "$INPUT_WAIVERS")" || exit 2
          args+=(--waivers "$waivers_path")
        fi
        if [ -n "$INPUT_MAX_WAIVER_DAYS" ]; then
          case "$INPUT_MAX_WAIVER_DAYS" in
            ''|*[!0-9]*)
              echo "::error::max-waiver-days must be a whole number of days" >&2
              exit 2
              ;;
          esac
          args+=(--max-waiver-days "$INPUT_MAX_WAIVER_DAYS")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          baseline_path="$(ws_rel "$INPUT_BASELINE")" || exit 2
          args+=(--baseline "$baseline_path")
        fi
        # SARIF always lands in the workspace (not just stdout) so later
        # steps — and the Code Scanning upload below — can consume it.
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          out_file_path="$(out_rel "$INPUT_OUTPUT_FILE")" || exit 2
          args+=(--output-file "$out_file_path")
        elif [ "$INPUT_OUTPUT" = "sarif" ]; then
          args+=(--output-file /out/tf-eu-guard.sarif)
        fi

        # The Python runner executes the installed Checkov package from a
        # trusted directory and ignores checkout .checkov.yml filters. Keep
        # the mounted workspace available only as the scan target.

        # The scan's exit code IS the gate (1 = findings at/above
        # threshold, 2 = bad invocation, 3 = tool failure); let it
        # propagate.
        set +e
        # The container output is untrusted: stop workflow-command processing
        # until the random token is echoed back after the scan.
        stop_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        case "$stop_token" in
          *[!0-9a-f]*|"") stop_token="" ;;
        esac
        if [ "${#stop_token}" -ne 32 ]; then
          echo "::error::could not create stop-commands token"
          exit 3
        fi
        echo "::stop-commands::$stop_token"
        # Hardening: the scanned code is untrusted and Checkov evaluates
        # Terraform expressions from it (asteval), so the container has no
        # network (Checkov runs with --skip-download), a read-only root
        # filesystem, no capabilities, no privilege escalation, and a
        # read-only workspace. Only /tmp (tmpfs) and /out are writable. The
        # workspace is mounted at its host path so absolute runner paths in
        # `path` and `checkov-json` resolve inside the container.
        docker run --rm \
          --network none \
          --read-only \
          --tmpfs /tmp \
          --cap-drop ALL \
          --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e XDG_CACHE_HOME=/tmp/.cache \
          -e TF_EU_GUARD_COMMIT="${GITHUB_SHA:-}" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
          -v "$out_host:/out" \
          ${mounts[@]+"${mounts[@]}"} \
          -w "$GITHUB_WORKSPACE" \
          "$image" "${args[@]}" 2>&1
        status=$?
        echo "::$stop_token::"
        set -e

        # Publish the summary and counts. The container processed untrusted
        # input, so only well-formed count lines reach $GITHUB_OUTPUT. Files
        # are absent when the scan failed before writing them.
        # The container can plant symlinks; never follow them on the host.
        meta="$out_host/.tf-eu-guard"
        if [ ! -L "$meta" ] && [ -d "$meta" ]; then
          if is_true "$INPUT_JOB_SUMMARY" && [ ! -L "$meta/summary.md" ] && [ -f "$meta/summary.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            head -c 1048576 "$meta/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if [ ! -L "$meta/counts.txt" ] && [ -f "$meta/counts.txt" ]; then
            LC_ALL=C grep -a -E '^[a-z]+=[0-9]+$' "$meta/counts.txt" >> "$GITHUB_OUTPUT" || true
          fi
        fi
        rm -rf "$meta"
        if [ -n "$(find "$out_host" -type l 2>/dev/null | head -n 1)" ]; then
          echo "::warning::removed symlinks created by the scan container; they are not copied into the workspace"
          find "$out_host" -type l -exec rm -f {} +
        fi

        # The upload steps follow symlinks and include every descendant of a
        # matched directory, so each upload target must be absent or a regular
        # file. Runs even when nothing was written or the scan failed.
        not_regular() {
          [ -L "$1" ] || { [ -e "$1" ] && [ ! -f "$1" ]; }
        }
        # Refuse when any segment of a workspace-relative path is a symlink.
        # Empty segments (repeated or trailing slashes) are skipped.
        refuse_symlink_in_path() {
          local rest="$1" seg walk="$GITHUB_WORKSPACE"
          while [ -n "$rest" ]; do
            seg="${rest%%/*}"
            case "$rest" in
              */*) rest="${rest#*/}" ;;
              *) rest="" ;;
            esac
            [ -n "$seg" ] || continue
            walk="$walk/$seg"
            if [ -L "$walk" ]; then
              refuse_symlink "${walk#"$GITHUB_WORKSPACE"/}"
            fi
          done
        }
        upload_dir="${out_dir_path#/out/}"
        refuse_symlink_in_path "$upload_dir"
        for target in "$GITHUB_WORKSPACE/$upload_dir"/*.html; do
          if not_regular "$target"; then
            refuse_symlink "${target#"$GITHUB_WORKSPACE"/}"
          fi
        done
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          upload_file="${out_file_path#/out/}"
        elif [ "$INPUT_OUTPUT" = "sarif" ]; then
          upload_file="tf-eu-guard.sarif"
        else
          upload_file=""
        fi
        if [ -n "$upload_file" ]; then
          refuse_symlink_in_path "$upload_file"
        fi
        if [ -n "$upload_file" ] && not_regular "$GITHUB_WORKSPACE/$upload_file"; then
          refuse_symlink "$upload_file"
        fi

        # Copy generated reports into the workspace for later steps.
        if [ -n "$(ls -A "$out_host")" ]; then
          # The checkout is attacker-controlled: a committed symlink at any
          # destination (directory or file) would redirect the copy elsewhere.
          while IFS= read -r -d '' src; do
            rel="${src#"$out_host"/}"
            refuse_symlink_in_path "$rel"
          done < <(find "$out_host" -mindepth 1 -print0)
          cp -R --remove-destination "$out_host"/. "$GITHUB_WORKSPACE"/
        fi
        echo "upload-reports=$upload_reports" >> "$GITHUB_OUTPUT"
        echo "upload-sarif=$upload_sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Upload HTML reports as artifact
      # always(): the reports are exactly what you want to inspect when
      # the severity gate failed the scan step.
      if: ${{ always() && steps.scan.outputs.upload-reports == 'true' && (inputs.output == 'all' || ((inputs.output == 'security' || inputs.output == 'auditor') && inputs.output-file == '')) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir || 'reports' }}/*.html
        if-no-files-found: error
        retention-days: 30

    - name: Upload single HTML report as artifact
      if: ${{ always() && steps.scan.outputs.upload-reports == 'true' && (inputs.output == 'security' || inputs.output == 'auditor') && inputs.output-file != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-file }}
        if-no-files-found: error
        retention-days: 30

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && steps.scan.outputs.upload-sarif == 'true' && inputs.output == 'sarif' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.output-file || 'tf-eu-guard.sarif' }}
        category: ${{ inputs.category }}
