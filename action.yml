name: 'tf-eu-guard'
description: 'EU compliance security linter for Terraform (source, plan JSON) and Kubernetes (NIS2 + GDPR)'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to the IaC directory (or, for iac-type: terraform_plan, the "terraform show -json" plan file), relative to the repository root'
    required: true
    default: './terraform'
  output:
    description: 'Report format (dev, security, auditor, json, sarif, all). sarif writes tf-eu-guard.sarif into the workspace for GitHub Code Scanning'
    required: false
    default: 'json'
  iac-type:
    description: 'IaC language to scan: terraform, terraform_plan (pass the plan file path as path), or kubernetes — mirrors the CLI --iac-type flag'
    required: false
    default: 'terraform'
  framework:
    description: 'Framework filter (nis2, gdpr, all)'
    required: false
    default: 'all'
  fail-on-severity:
    description: 'Fail the workflow if findings at or above this severity exist (CRITICAL, HIGH, MEDIUM, LOW, INFO); empty disables gating'
    required: false
    default: 'HIGH'
  upload-reports:
    description: 'Upload the generated HTML report(s) as a workflow artifact when output includes dev/security/auditor (or all)'
    required: false
    default: 'false'
  fail-on-any:
    description: 'Fail the workflow when any mapped finding exists, regardless of severity'
    required: false
    default: 'false'
  checkov-json:
    description: 'Use a pre-generated Checkov JSON result instead of running Checkov (path is optional when set)'
    required: false
    default: ''
  output-dir:
    description: 'Directory for generated HTML reports (default: reports/)'
    required: false
    default: ''
  output-file:
    description: 'Destination for one security, auditor, or SARIF report; SARIF defaults to /workspace/tf-eu-guard.sarif'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF output to GitHub Code Scanning (the workflow needs security-events: write permission). Only applies when output is sarif'
    required: false
    default: 'false'

outputs:
  exit-code:
    description: 'Exit code returned by the tf-eu-guard scan (0, 1, 2, or 3)'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Run tf-eu-guard scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IAC_TYPE: ${{ inputs.iac-type }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_FAIL_ON_ANY: ${{ inputs.fail-on-any }}
        INPUT_CHECKOV_JSON: ${{ inputs.checkov-json }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        image="tf-eu-guard:action-${GITHUB_RUN_ID:-local}"
        docker build --quiet -t "$image" "$ACTION_PATH"

        args=()
        if [ -n "$INPUT_CHECKOV_JSON" ]; then
          args+=(--checkov-json "$INPUT_CHECKOV_JSON")
        else
          args+=("$INPUT_PATH")
        fi
        args+=(
          --iac-type "$INPUT_IAC_TYPE"
          --output "$INPUT_OUTPUT"
          --framework "$INPUT_FRAMEWORK"
        )
        # An empty fail-on-severity input means "no gating" — the CLI
        # accepts '' with that meaning too, but omitting the flag entirely
        # is what the input description promises.
        if [ -n "$INPUT_FAIL_ON_SEVERITY" ]; then
          args+=(--fail-on-severity "$INPUT_FAIL_ON_SEVERITY")
        fi
        if [ "$INPUT_FAIL_ON_ANY" = "true" ]; then
          args+=(--fail-on-any)
        fi
        if [ -n "$INPUT_OUTPUT_DIR" ]; then
          args+=(--output-dir "$INPUT_OUTPUT_DIR")
        fi
        # SARIF always lands in the workspace (not just stdout) so later
        # steps — and the Code Scanning upload below — can consume it.
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          args+=(--output-file "$INPUT_OUTPUT_FILE")
        elif [ "$INPUT_OUTPUT" = "sarif" ]; then
          args+=(--output-file /workspace/tf-eu-guard.sarif)
        fi

        # The scan's exit code IS the gate (1 = findings at/above
        # threshold, 2 = bad invocation, 3 = tool failure); let it
        # propagate.
        set +e
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          "$image" "${args[@]}"
        status=$?
        set -e
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Upload HTML reports as artifact
      # always(): the reports are exactly what you want to inspect when
      # the severity gate failed the scan step.
      if: ${{ always() && inputs.upload-reports == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: tf-eu-guard-reports
        path: reports/
        if-no-files-found: error
        retention-days: 30

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.output == 'sarif' }}
      uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
      with:
        sarif_file: tf-eu-guard.sarif
